<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Screener · Quant Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-base: #0E0E10;
    --bg-surface: #161618;
    --bg-raised: #1E1E22;
    --bg-overlay: #242428;
    --bg-sidebar: #0A0A0C;
    --border-subtle: #27272A;
    --border: #3F3F46;
    --border-active: #D4A843;
    --accent: #D4A843;
    --accent-hover: #E0B84F;
    --accent-dim: rgba(212,168,67,0.10);
    --positive: #34D399;
    --positive-bg: #052e1c;
    --positive-border: #0f5132;
    --negative: #F87171;
    --warning: #FBBF24;
    --warning-bg: #3d2c00;
    --warning-border: #7c5500;
    --fg-1: #FAFAFA;
    --fg-2: #A1A1AA;
    --fg-3: #52525B;
    --font-display: 'DM Serif Display', Georgia, serif;
    --font-ui: 'Inter', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Fira Code', monospace;
    --t-fast: 150ms ease;
    --t-normal: 250ms ease;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #050507; }
  body {
    color: var(--fg-1);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    position: relative;
    background:
      radial-gradient(ellipse 100% 80% at 50% 0%, #0A0A0C 0%, #050507 70%),
      #050507;
  }
  /* Dot-grid HUD overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: radial-gradient(rgba(255,255,255,0.6) 1px, transparent 1px);
    background-size: 22px 22px;
    background-position: 0 0;
    opacity: 0.03;
  }
  /* Soft gold halo at the top */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(212,168,67,0.06), transparent 60%);
  }
  .nav, .page { position: relative; z-index: 1; }

  ::selection { background: var(--accent-dim); color: var(--fg-1); }

  /* Nav */
  .nav {
    height: 48px;
    background: rgba(10,10,12,0.72);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    backdrop-filter: blur(20px) saturate(140%);
    border-bottom: 1px solid rgba(212,168,67,0.20);
    box-shadow: 0 1px 0 rgba(212,168,67,0.05), 0 12px 32px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--fg-1);
    letter-spacing: 0.01em;
  }
  .brand-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow:
      0 0 0 3px rgba(212,168,67,0.12),
      0 0 14px rgba(212,168,67,0.7);
  }
  .nav-items {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-item {
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    color: var(--fg-2);
    background: transparent;
    border: none;
    padding: 8px 14px;
    cursor: pointer;
    position: relative;
    transition: color var(--t-fast);
    letter-spacing: 0.01em;
  }
  .nav-item:hover { color: var(--fg-1); }
  .nav-item.active { color: var(--fg-1); }
  .nav-item.active::after {
    content: '';
    position: absolute;
    left: 14px; right: 14px;
    bottom: -14px;
    height: 2px;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(212,168,67,0.6);
  }

  /* Page */
  .page {
    max-width: 1320px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .page-title {
    font-family: var(--font-display);
    font-size: 32px;
    color: var(--fg-1);
    margin: 0 0 4px;
    font-weight: 400;
    line-height: 1.1;
  }
  .page-sub {
    color: var(--fg-2);
    font-size: 13px;
    margin: 0 0 24px;
    letter-spacing: 0.01em;
  }

  /* Upload */
  .upload {
    background: rgba(255,255,255,0.02);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(212,168,67,0.20);
    border-radius: 12px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast);
    text-align: center;
    box-shadow: 0 0 30px rgba(212,168,67,0.08), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .upload:hover {
    border-color: rgba(212,168,67,0.55);
    box-shadow: 0 0 36px rgba(212,168,67,0.15), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .upload.dragover {
    border-color: rgba(212,168,67,0.85);
    background: rgba(212,168,67,0.04);
    box-shadow: 0 0 48px rgba(212,168,67,0.25), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .upload.loaded {
    border-color: rgba(212,168,67,0.5);
    box-shadow: 0 0 30px rgba(212,168,67,0.12), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .upload-icon {
    width: 32px; height: 32px;
    color: var(--fg-2);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .upload.loaded .upload-icon { color: var(--accent); }
  .upload-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--fg-1);
  }
  .upload-sub {
    font-size: 12px;
    color: var(--fg-3);
    letter-spacing: 0.01em;
  }
  .upload-loaded-line {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
  }
  .upload-loaded-line .sep { color: var(--fg-3); margin: 0 8px; }
  .upload-replace {
    margin-top: 4px;
    font-size: 11px;
    color: var(--fg-3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Run button + progress */
  .run-row { margin-top: 16px; }
  .run-btn {
    width: 100%;
    height: 44px;
    border-radius: 8px;
    background: linear-gradient(135deg, #D4A843 0%, #E8C060 100%);
    color: #0E0E10;
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.01em;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: box-shadow var(--t-fast), filter var(--t-fast), transform var(--t-fast);
    box-shadow: 0 0 0 1px rgba(212,168,67,0.4), 0 8px 24px rgba(212,168,67,0.15);
  }
  .run-btn:hover:not(:disabled) {
    filter: brightness(1.05);
    box-shadow: 0 0 30px rgba(212,168,67,0.4), 0 0 0 1px rgba(212,168,67,0.6), 0 8px 32px rgba(212,168,67,0.25);
  }
  .run-btn:active:not(:disabled) { transform: translateY(1px); }
  .run-btn:disabled {
    background: rgba(255,255,255,0.04);
    color: var(--fg-3);
    cursor: not-allowed;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
  }
  .progress-wrap {
    width: 100%;
    height: 44px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, rgba(52,211,153,0.6), #34D399);
    box-shadow: 0 0 24px rgba(52,211,153,0.45);
    transition: width 120ms linear;
  }
  .progress-label {
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg-2);
    letter-spacing: 0.02em;
  }

  /* Summary strip */
  .summary {
    display: flex;
    gap: 8px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  .pill-stat {
    background: rgba(255,255,255,0.04);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-radius: 8px;
    padding: 10px 20px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    border: 1px solid rgba(255,255,255,0.10);
  }
  .pill-stat .lbl {
    font-size: 11px;
    color: var(--fg-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .pill-stat .val {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 16px;
  }
  .pill-stat.passed .val {
    color: var(--positive);
    text-shadow: 0 0 14px rgba(52,211,153,0.6);
  }
  .pill-stat.scanned .val { color: var(--fg-1); }
  .pill-stat.insuf .val { color: var(--fg-3); }

  /* Sort bar */
  .sort-row {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .sort-label {
    font-size: 11px;
    color: var(--fg-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: 4px;
  }
  .sort-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sort-pill {
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    color: var(--fg-2);
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    transition: color var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
    letter-spacing: 0.01em;
  }
  .sort-pill:hover { color: var(--fg-1); border-color: rgba(255,255,255,0.15); }
  .sort-pill.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(212,168,67,0.08);
    box-shadow: 0 0 10px rgba(212,168,67,0.3);
  }
  .results-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-3);
    letter-spacing: 0.02em;
  }
  .results-count strong { color: var(--fg-1); font-weight: 600; }

  /* Grid */
  .grid {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }

  /* Card */
  .card {
    background: rgba(255,255,255,0.03);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: var(--tw-card-pad, 16px);
    cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: var(--tw-row-accent, 2px);
  }
  .card.green::before { background: var(--positive); box-shadow: 0 0 12px rgba(52,211,153,0.5); }
  .card.yellow::before { background: var(--warning); box-shadow: 0 0 12px rgba(251,191,36,0.5); }
  .card.green {
    box-shadow:
      0 0 24px rgba(52,211,153,0.08),
      inset 0 1px 0 rgba(52,211,153,0.10);
  }
  .card.yellow {
    box-shadow:
      0 0 24px rgba(251,191,36,0.08),
      inset 0 1px 0 rgba(251,191,36,0.10);
  }
  .card:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.14);
    transform: translateY(-1px);
  }
  .card.green:hover {
    box-shadow:
      0 0 36px rgba(52,211,153,0.16),
      inset 0 1px 0 rgba(52,211,153,0.14);
  }
  .card.yellow:hover {
    box-shadow:
      0 0 36px rgba(251,191,36,0.16),
      inset 0 1px 0 rgba(251,191,36,0.14);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .ticker {
    font-family: var(--font-display);
    font-size: var(--tw-ticker-size, 20px);
    font-weight: 400;
    color: var(--fg-1);
    line-height: 1.1;
    letter-spacing: 0.01em;
    text-shadow: 0 0 20px rgba(212,168,67,0.3);
  }
  .company {
    font-size: 11px;
    font-weight: 300;
    color: var(--fg-3);
    opacity: var(--tw-company-opacity, 0.85);
    margin-top: 3px;
    letter-spacing: 0.01em;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sector-pill {
    background: var(--tw-sector-bg, #2D2D33);
    border: 1px solid var(--tw-sector-border, #45454D);
    color: var(--tw-sector-fg, #D4D4D8);
    font-size: 10px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 4px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .metrics {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    gap: var(--tw-metric-gap, 8px);
  }
  .metric-row {
    display: grid;
    grid-template-columns: 70px 1fr;
    align-items: center;
    gap: 10px;
  }
  .metric-label {
    font-size: 10px;
    color: var(--fg-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .quarters {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-3);
  }
  .quarters .q-old { color: var(--fg-3); }
  .quarters .arrow {
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
  }
  .quarters .arrow.pos {
    color: var(--positive);
    text-shadow: 0 0 8px rgba(52,211,153,0.6);
  }
  .quarters .arrow.warn {
    color: var(--warning);
    text-shadow: 0 0 8px rgba(251,191,36,0.55);
  }
  .quarters .arrow.neg {
    color: var(--negative);
    text-shadow: 0 0 8px rgba(248,113,113,0.6);
  }
  .quarters .q-new {
    color: var(--fg-1);
    font-weight: 600;
    font-size: 13px;
  }
  .quarters .sep {
    color: var(--fg-3);
    opacity: 0.6;
  }

  .card-bottom {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 4px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border: 1px solid;
  }
  .status .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: currentColor;
  }
  .status.green {
    background: var(--positive-bg);
    color: var(--positive);
    border-color: var(--positive-border);
    box-shadow: 0 0 12px rgba(52,211,153,0.4);
  }
  .status.yellow {
    background: var(--warning-bg);
    color: var(--warning);
    border-color: var(--warning-border);
    box-shadow: 0 0 12px rgba(251,191,36,0.4);
  }
  .mcap {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-3);
    letter-spacing: 0.01em;
    margin-left: auto;
    text-align: right;
  }

  /* Empty/loading helpers */
  .pre-run-hint {
    margin-top: 24px;
    padding: 14px 16px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    color: var(--fg-2);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pre-run-hint .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--fg-3);
  }

  /* Hidden file input */
  input[type="file"] { display: none; }

  /* Icon resets */
  svg { display: block; }
</style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}

    </TweakRow>

}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

      "accent": "#D4A843",
      "showRowAccent": true
    }/*EDITMODE-END*/;

    const SECTOR_PRESETS = {

      med:  { bg: '#2D2D33', border: '#45454D', fg: '#D4D4D8' },
      high: { bg: '#3A3A42', border: '#55555F', fg: '#FAFAFA' },

    const DENSITY = {

    /* ─── Lucide helper ──────────────────────────────────────── */
    function Icon({ name, size = 16, stroke = 1.5, color = 'currentColor', style }) {

    /* ─── Mock Code 33 winners ───────────────────────────────── */

    function fmtPct(n) {
      if (n === null || n === undefined) return '—';
      const s = n > 0 ? '+' : '';
      return `${s}${n}%`;
    }
    function fmtMarg(n) {
      return `${n}%`;
    }

    /* ─── Top nav ────────────────────────────────────────────── */
    function TopNav() {
      const items = [
        { id: 'screener', label: 'Screener', active: true },
        { id: 'overview', label: 'Overview' },
        { id: 'portfolio', label: 'Portfolio' },
      ];
      return (
        <nav className="nav">
          <div className="nav-brand">
            <span className="brand-dot" />
            Quant Terminal
          </div>
          <div className="nav-items">
            {items.map(it => (
              <button key={it.id} className={`nav-item ${it.active ? 'active' : ''}`}
                onClick={() => {
                  if (it.id === 'overview') window.location.href = '/overview';
                  if (it.id === 'portfolio') window.location.href = '/portfolio';
                  if (it.id === 'screener') window.location.href = '/';
                }}>
                {it.label}
              </button>
            ))}
          </div>
        </nav>
      );
    }

    /* ─── Upload zone ────────────────────────────────────────── */
    function UploadZone({ file, onFile }) {
      const [drag, setDrag] = useState(false);
      const inputRef = useRef(null);

      const handleFiles = useCallback((fileList) => {
        const f = fileList && fileList[0];
        if (!f) return;
        onFile({ name: f.name, size: f.size, tickers: 529 });
        // Store file for actual engine run
        window.__PENDING_FILE__ = f;
      }, [onFile]);

      const onDrop = (e) => {
        e.preventDefault();
        setDrag(false);
        handleFiles(e.dataTransfer.files);
      };

      // Allow demo without a real CSV
      const simulate = (e) => {
        e.stopPropagation();
        onFile({ name: 'tradingview-export-2026-05-23.csv', size: 87543, tickers: 529, simulated: true });
      };

      return (
        <div
          className={`upload ${drag ? 'dragover' : ''} ${file ? 'loaded' : ''}`}
          onClick={() => inputRef.current && inputRef.current.click()}
          onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={onDrop}
        >
          <input
            ref={inputRef}
            type="file"
            accept=".csv,text/csv"
            onChange={(e) => handleFiles(e.target.files)}
          />
          <div className="upload-icon">
            <Icon name={file ? 'file-check-2' : 'upload-cloud'} size={32} stroke={1.5} />
          </div>
          {!file ? (
            <>
              <div className="upload-title">Drop your TradingView CSV</div>
              <div className="upload-sub">or click to browse · 500–600 tickers expected</div>
              <div className="upload-sub" style={{ marginTop: 4 }}>
                <a
                  href="#"
                  onClick={simulate}
                  style={{ color: 'var(--fg-2)', textDecoration: 'underline', textDecorationColor: 'var(--border)' }}
                >
                  use sample data
                </a>
              </div>
            </>
          ) : (
            <>
              <div className="upload-loaded-line">
                {file.name}
                <span className="sep">·</span>
                {file.tickers.toLocaleString()} tickers
              </div>
              <div className="upload-replace">click to replace</div>
            </>
          )}
        </div>
      );
    }

    /* ─── Sort bar ───────────────────────────────────────────── */
    const SORTS = [
      { id: 'eps', label: 'EPS momentum' },
      { id: 'rev', label: 'Revenue' },
      { id: 'mcap', label: 'Market cap' },
    ];

    function SortBar({ sort, setSort, count }) {
      return (
        <div className="sort-row">
          <div className="sort-pills">
            <span className="sort-label">Sort</span>
            {SORTS.map(s => (
              <button
                key={s.id}
                className={`sort-pill ${sort === s.id ? 'active' : ''}`}
                onClick={() => setSort(s.id)}
              >
                {s.label}
              </button>
            ))}
          </div>
          <div className="results-count">
            <strong>{count}</strong> winners
          </div>
        </div>
      );
    }

    /* ─── Metric row ─────────────────────────────────────────── */
    function MetricRow({ label, values, formatter = fmtPct }) {
      const [q1, q2, q3] = values;
      const up = q3 >= q2;
      // Tone: red ONLY when actual value is negative.
      //       Amber when slowing (q3 < q2). Green when accelerating.
      let tone;
      if (q3 < 0) tone = 'neg';
      else if (q3 < q2) tone = 'warn';
      else tone = 'pos';
      return (
        <div className="metric-row">
          <div className="metric-label">{label}</div>
          <div className="quarters">
            <span className="q-old">{formatter(q1)}</span>
            <span className="sep">→</span>
            <span className="q-old">{formatter(q2)}</span>
            <span className={`arrow ${up ? 'up' : 'dn'} ${tone}`}>{up ? '↑' : '↓'}</span>
            <span className="q-new">{formatter(q3)}</span>
          </div>
        </div>
      );
    }

    /* ─── Card ───────────────────────────────────────────────── */
    function WinnerCard({ w }) {
      return (
        <div 
          className={`card ${w.status}`}
          onClick={() => window.location.href = `/overview?ticker=${w.ticker}`}
          style={{cursor: 'pointer'}}
        >
          <div className="card-top">
            <div>
              <div className="ticker">{w.ticker}</div>
              <div className="company">{w.company}</div>
            </div>
            <div className="sector-pill">{w.sector}</div>
          </div>

          <div className="metrics">
            <MetricRow label="EPS YoY" values={w.eps} />
            <MetricRow label="Revenue YoY" values={w.rev} />
            <MetricRow label="Net margin" values={w.margin} formatter={fmtMarg} />
          </div>

          <div className="card-bottom">
            <span className={`status ${w.status}`}>
              <span className="dot" />
              {w.status === 'green' ? 'Green' : 'Yellow'}
            </span>
            <span className="mcap">{w.mcap}</span>
          </div>
        </div>
      );
    }

    /* ─── App ────────────────────────────────────────────────── */
    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [file, setFile] = useState(null);
      const [phase, setPhase] = useState(window.__REAL_META__ ? 'done' : 'idle'); // idle | running | done
      const [progress, setProgress] = useState(0); // 0..1
      const [scanned, setScanned] = useState(0);
      const [sort, setSort] = useState('eps');
      const [winners, setWinners] = useState([]);
      const [meta, setMeta] = useState(null);

      // Apply tweaks via CSS variables on :root
      useEffect(() => {
        const r = document.documentElement;
        const sec = SECTOR_PRESETS[t.sectorContrast] || SECTOR_PRESETS.med;
        const d = DENSITY[t.density] || DENSITY.regular;
        r.style.setProperty('--accent', t.accent);
        r.style.setProperty('--accent-dim', t.accent + '1a');
        r.style.setProperty('--tw-company-opacity', t.companyOpacity);
        r.style.setProperty('--tw-sector-bg', sec.bg);
        r.style.setProperty('--tw-sector-border', sec.border);
        r.style.setProperty('--tw-sector-fg', sec.fg);
        r.style.setProperty('--tw-card-pad', d.cardPad + 'px');
        r.style.setProperty('--tw-metric-gap', d.gap + 'px');
        r.style.setProperty('--tw-ticker-size', d.ticker + 'px');
        r.style.setProperty('--tw-row-accent', t.showRowAccent ? '2px' : '0px');
      }, [t]);

      const total = file ? file.tickers : 0;

      // Run animation
      useEffect(() => {
        if (phase !== 'running') return;
        const start = performance.now();
        const dur = 2600; // ms
        let raf;
        const tick = (t) => {
          const p = Math.min(1, (t - start) / dur);
          setProgress(p);
          setScanned(Math.floor(p * total));
          if (p < 1) {
            raf = requestAnimationFrame(tick);
          } else {
            setPhase('done');
            setScanned(total);
          }
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [phase, total]);

      const onRun = async () => {
        console.log('[RUN] clicked - file:', !!file, 'pending:', !!window.__PENDING_FILE__);
        if (!file || !window.__PENDING_FILE__) {
          alert('Please upload your CSV file first.');
          setFile(null);
          setPhase('idle');
          return;
        }
        setPhase('running');
        setProgress(0);
        setScanned(0);

        const formData = new FormData();
        formData.append('file', window.__PENDING_FILE__);

        try {
          // Animate progress while waiting
          let p = 0;
          const interval = setInterval(() => {
            p = Math.min(p + 0.01, 0.95);
            setProgress(p);
            setScanned(Math.floor(p * (file.tickers || 529)));
          }, 100);

          const res = await fetch('/api/scan', {
            method: 'POST',
            body: formData,
          });
          const data = await res.json();
          
          clearInterval(interval);
          setProgress(1);
          setScanned(file.tickers || 529);
          
          // Update winners with real data
          window.__REAL_WINNERS__ = data.winners;
          window.__REAL_META__ = data.meta;
          setWinners(data.winners);
          console.log(data.winners[0]);
          setMeta(data.meta);
          setPhase('done');
        } catch(err) {
          console.error('Scan failed:', err);
          setPhase('idle');
        }
      };

      const sorted = useMemo(() => {
        const arr = [...winners];
        if (sort === 'eps') {
          arr.sort((a, b) => b.eps[2] - a.eps[2]);
        } else if (sort === 'rev') {
          arr.sort((a, b) => b.rev[2] - a.rev[2]);
        } else if (sort === 'mcap') {
          const parse = (s) => {
            const m = s.match(/([\d.]+)([BMKT])/);
            if (!m) return 0;
            const n = parseFloat(m[1]);
            return n * (m[2] === 'T' ? 1e12 : m[2] === 'B' ? 1e9 : m[2] === 'M' ? 1e6 : 1e3);
          };
          arr.sort((a, b) => parse(b.mcap) - parse(a.mcap));
        }
        return arr;
      }, [sort, winners]);

      // Compute summary numbers
      const passed = winners.length;
      const insuf = file ? Math.round(total * 0.07) : 0; // ~7% insufficient

      return (
        <>
          <TopNav />
          <main className="page">
            <h1 className="page-title">Screener</h1>
            <p className="page-sub">Code 33 — EPS, revenue and margin acceleration over three quarters.</p>

            <UploadZone
              file={file}
              onFile={(f) => { setFile(f); setPhase('idle'); setProgress(0); setScanned(0); }}
            />

            <div className="run-row">
              {phase !== 'running' ? (
                <button
                  className="run-btn"
                  disabled={!file}
                  onClick={onRun}
                >
                  {phase === 'done' ? 'Re-run Code 33' : 'Run Code 33'}
                  <Icon name="arrow-right" size={16} stroke={1.75} color="#0E0E10" />
                </button>
              ) : (
                <>
                  <div className="progress-wrap">
                    <div className="progress-fill" style={{ width: `${progress * 100}%` }} />
                  </div>
                  <div className="progress-label">
                    Analysing {scanned.toLocaleString()} of {total.toLocaleString()}...
                  </div>
                </>
              )}
            </div>

            {phase === 'done' && (
              <div className="summary">
                <div className="pill-stat scanned">
                  <span className="lbl">Scanned</span>
                  <span className="val">{meta ? meta.total : (file ? file.tickers : 0)}</span>
                </div>
                <div className="pill-stat passed">
                  <span className="lbl">Passed</span>
                  <span className="val">{meta ? meta.passed : winners.length}</span>
                </div>
                <div className="pill-stat insuf">
                  <span className="lbl">Insufficient data</span>
                  <span className="val">{meta ? meta.insufficient : 0}</span>
                </div>
              </div>
            )}

            {phase === 'idle' && !file && (
              <div className="pre-run-hint">
                <span className="dot" />
                Waiting for CSV — export Symbol, Description, Sector, EPS &amp; Revenue growth columns from TradingView.
              </div>
            )}

            {phase === 'done' && (
              <>
                <SortBar sort={sort} setSort={setSort} count={sorted.length} />
                <div className="grid">
                  {sorted.map(w => <WinnerCard key={w.ticker} w={w} />)}
                </div>
              </>
            )}
          </main>

          <TweaksPanel>
            <TweakSection label="Card" />
            <TweakRadio
              label="Density"
              value={t.density}
              options={['compact','regular','comfy']}
              onChange={(v) => setTweak('density', v)}
            />
            <TweakToggle
              label="Left accent bar"
              value={t.showRowAccent}
              onChange={(v) => setTweak('showRowAccent', v)}
            />
            <TweakSection label="Typography" />
            <TweakSlider
              label="Company name opacity"
              value={t.companyOpacity}
              min={0.3} max={1} step={0.05}
              onChange={(v) => setTweak('companyOpacity', v)}
            />
            <TweakSection label="Sector pill" />
            <TweakRadio
              label="Contrast"
              value={t.sectorContrast}
              options={['low','med','high']}
              onChange={(v) => setTweak('sectorContrast', v)}
            />
            <TweakSection label="Theme" />
            <TweakColor
              label="Accent"
              value={t.accent}
              options={['#D4A843', '#5B8EFF', '#34D399', '#F87171']}
              onChange={(v) => setTweak('accent', v)}
            />
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
