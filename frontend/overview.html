<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AMD · Overview · Quant Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-base: #0E0E10;
    --bg-nav: #0A0A0C;
    --bg-panel: #1A1A1E;
    --bg-card: #141416;
    --bg-row-alt: #0E0E10;
    --border-subtle: #1F1F23;
    --border: #2A2A2E;
    --accent: #D4A843;
    --accent-hover: #E0B84F;
    --accent-bg-soft: #1F1A0E;
    --positive: #34D399;
    --positive-bg: #052e1c;
    --positive-border: #0f5132;
    --negative: #F87171;
    --warning: #FBBF24;
    --fg-1: #FAFAFA;
    --fg-2: #71717A;
    --fg-3: #3F3F46;
    --font-display: 'DM Serif Display', Georgia, serif;
    --font-ui: 'Inter', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Fira Code', monospace;
    --t-fast: 150ms ease;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    color: var(--fg-1);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(212,168,67,0.08) 0%, transparent 70%),
      var(--bg-base);
    background-attachment: fixed;
  }

  ::selection { background: rgba(212,168,67,0.18); color: var(--fg-1); }

  /* ─── NAV ─────────────────────────────────────────── */
  .nav {
    height: 48px;
    background: var(--bg-nav);
    border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    position: sticky; top: 0; z-index: 50;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--font-display); font-size: 18px; color: var(--fg-1);
  }
  .brand-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(212,168,67,0.12), 0 0 12px rgba(212,168,67,0.6);
  }
  .nav-items { display: flex; align-items: center; gap: 4px; }
  .nav-item {
    font-size: 13px; font-weight: 500; color: var(--fg-2);
    background: transparent; border: none;
    padding: 8px 14px; cursor: pointer; position: relative;
    transition: color var(--t-fast);
  }
  .nav-item:hover { color: var(--fg-1); }
  .nav-item.active { color: var(--fg-1); }
  .nav-item.active::after {
    content: '';
    position: absolute; left: 14px; right: 14px; bottom: -14px;
    height: 2px; background: var(--accent);
    box-shadow: 0 0 12px rgba(212,168,67,0.5);
  }

  /* ─── IDENTITY BAR ────────────────────────────────── */
  .identity {
    background: var(--bg-nav);
    border-bottom: 1px solid var(--border-subtle);
    padding: 18px 24px;
    position: sticky; top: 48px; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
  }
  .ident-left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .ident-name {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 400;
    color: var(--fg-1);
    line-height: 1.1; letter-spacing: 0.01em;
  }
  .ident-meta {
    font-size: 12px; color: var(--fg-2);
    display: flex; align-items: center; gap: 8px;
    letter-spacing: 0.02em;
  }
  .ident-meta .sep { color: var(--fg-3); }

  .ident-right {
    display: flex; align-items: center; gap: 16px;
  }
  .ident-price-block {
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
  }
  .ident-price {
    font-family: var(--font-mono);
    font-size: 32px; font-weight: 600;
    color: var(--fg-1);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .ident-change {
    font-family: var(--font-mono);
    font-size: 14px; font-weight: 500;
    color: var(--positive);
    letter-spacing: 0.01em;
  }
  .ident-change.down { color: var(--negative); }

  .code33-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--positive-bg);
    border: 1px solid var(--positive);
    color: var(--positive);
    font-family: var(--font-ui);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 6px;
    box-shadow: 0 0 14px rgba(52,211,153,0.30);
    white-space: nowrap;
  }
  .code33-badge .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
  }

  /* ─── PAGE ────────────────────────────────────────── */
  .page {
    max-width: 1320px;
    margin: 0 auto;
    padding: 24px 24px 80px;
  }

  /* ─── SHARED SECTION ──────────────────────────────── */
  .section { margin-top: 32px; }
  .section:first-child { margin-top: 0; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-label {
    font-family: var(--font-ui);
    font-size: 11px; font-weight: 500;
    color: var(--fg-2);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 10px;
    padding-bottom: 4px;
  }
  .section-label::after {
    content: '';
    display: block;
    width: 40px; height: 2px;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(212,168,67,0.4);
  }

  /* ─── CHART ───────────────────────────────────────── */
  .chart-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 12px;
    position: relative;
  }
  .chart-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .chart-title {
    font-size: 11px; color: var(--fg-2);
    letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 500;
  }
  .timeframes { display: flex; gap: 2px; }
  .tf-btn {
    font-family: var(--font-ui);
    font-size: 12px; font-weight: 500;
    color: var(--fg-2);
    background: transparent; border: none;
    padding: 6px 10px; cursor: pointer;
    transition: color var(--t-fast);
    position: relative;
  }
  .tf-btn:hover { color: var(--fg-1); }
  .tf-btn.active { color: var(--accent); }
  .tf-btn.active::after {
    content: '';
    position: absolute; left: 10px; right: 10px; bottom: -2px;
    height: 1px; background: var(--accent);
  }
  .chart-svg-wrap {
    height: 200px;
    position: relative;
  }
  .chart-svg-wrap svg { width: 100%; height: 100%; }

  /* ─── KEY STATS ───────────────────────────────────── */
  .stats-grid {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 8px;
  }
  @media (max-width: 1000px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px)  { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-pill {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-lbl {
    font-size: 10px; font-weight: 500;
    color: var(--fg-2);
    letter-spacing: 0.10em;
    text-transform: uppercase;
  }
  .stat-val {
    font-family: var(--font-mono);
    font-size: 15px; font-weight: 600;
    color: var(--fg-1);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  /* ─── FINANCIALS ──────────────────────────────────── */
  .tabs {
    display: flex; gap: 2px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .tab {
    font-family: var(--font-ui);
    font-size: 13px; font-weight: 500;
    color: var(--fg-2);
    background: transparent; border: none;
    padding: 10px 16px;
    cursor: pointer;
    transition: color var(--t-fast);
    position: relative;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--fg-1); }
  .tab.active { color: var(--accent); }
  .tab.active::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -1px;
    height: 1px; background: var(--accent);
  }

  .table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: auto;
  }
  table.fin {
    width: 100%;
    border-collapse: collapse;
    min-width: 880px;
  }
  table.fin th,
  table.fin td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border-subtle);
  }
  table.fin thead th {
    background: var(--bg-nav);
    font-family: var(--font-ui);
    font-size: 11px; font-weight: 500;
    color: var(--fg-2);
    letter-spacing: 0.10em;
    text-transform: uppercase;
    text-align: right;
    white-space: nowrap;
    position: sticky; top: 0;
  }
  table.fin thead th:first-child { text-align: left; }
  table.fin tbody tr:nth-child(odd)  { background: var(--bg-card); }
  table.fin tbody tr:nth-child(even) { background: var(--bg-row-alt); }
  table.fin tbody tr:hover { background: rgba(255,255,255,0.02); }
  table.fin tbody tr:last-child td { border-bottom: none; }

  td.metric {
    font-family: var(--font-ui);
    font-size: 13px; font-weight: 500;
    color: var(--fg-1);
    text-align: left;
    white-space: nowrap;
  }
  td.num {
    font-family: var(--font-mono);
    font-size: 13px; font-weight: 500;
    color: var(--fg-1);
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* YoY rows */
  tr.yoy td.metric {
    color: var(--fg-2);
    font-weight: 400;
    padding-left: 26px;
    font-size: 12px;
  }
  tr.yoy td.num {
    font-size: 11px;
    font-weight: 500;
  }
  tr.yoy td.num.pos { color: var(--positive); }
  tr.yoy td.num.neg { color: var(--negative); }
  tr.yoy td.num.mut { color: var(--fg-3); }

  /* ─── LIVE NEWS ───────────────────────────────────── */
  .news-head { display: flex; align-items: center; gap: 12px; }
  .live-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-ui);
    font-size: 10px; font-weight: 600;
    color: var(--positive);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .live-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--positive);
    box-shadow: 0 0 8px var(--positive);
    animation: pulse-live 1.6s ease-in-out infinite;
  }
  @keyframes pulse-live {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--positive); }
    50%      { opacity: 0.35; box-shadow: 0 0 14px var(--positive); }
  }
  .news-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
  @media (max-width: 920px) { .news-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .news-grid { grid-template-columns: 1fr; } }
  .news-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast);
    display: flex; flex-direction: column; gap: 8px;
  }
  .news-card:hover { background: #18181C; border-color: #34343A; }
  .news-meta {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px;
    color: var(--fg-2);
  }
  .news-time {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--fg-2);
  }
  .news-src { letter-spacing: 0.01em; }
  .news-meta .sep { color: var(--fg-3); }
  .news-headline {
    font-size: 13px; font-weight: 500;
    color: var(--fg-1);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ─── BOTTOM ROW ─────────────────────────────────── */
  .bottom-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 920px) { .bottom-row { grid-template-columns: 1fr; } }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .panel-label {
    font-family: var(--font-ui);
    font-size: 11px; font-weight: 500;
    color: var(--fg-2);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .panel-label::after {
    content: '';
    display: block;
    width: 28px; height: 2px;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(212,168,67,0.4);
  }

  /* Ownership */
  .holder-row {
    display: grid;
    grid-template-columns: 140px 1fr 56px;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .holder-row:last-of-type { border-bottom: none; }
  .holder-name {
    font-size: 12px;
    color: var(--fg-1);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .holder-bar {
    position: relative;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .holder-bar-fill {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-hover));
    box-shadow: 0 0 10px rgba(212,168,67,0.35);
    border-radius: 999px;
    width: var(--w, 0%);
  }
  .holder-pct {
    font-family: var(--font-mono);
    font-size: 12px; font-weight: 500;
    color: var(--fg-1);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .insider-block {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border-subtle);
  }
  .insider-block .panel-label { margin-bottom: 10px; }
  .insider-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin: 4px 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px;
    transition: border-color var(--t-fast), background var(--t-fast);
  }
  .insider-card:hover { background: #18181C; border-color: #34343A; }
  .ins-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ins-name {
    font-family: var(--font-ui);
    font-size: 13px; font-weight: 500;
    color: var(--fg-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ins-meta {
    font-size: 11px;
    color: var(--fg-2);
    display: inline-flex; align-items: baseline; gap: 6px;
    letter-spacing: 0.01em;
  }
  .ins-meta .ins-role { font-family: var(--font-ui); }
  .ins-meta .ins-date {
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .ins-meta .sep { color: var(--fg-3); }
  .ins-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .side-pill {
    font-family: var(--font-ui);
    font-size: 9px; font-weight: 600;
    letter-spacing: 0.14em;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid;
    text-transform: uppercase;
    line-height: 1.4;
  }
  .side-pill.sell {
    background: rgba(248,113,113,0.10);
    border-color: rgba(248,113,113,0.30);
    color: var(--negative);
  }
  .side-pill.buy {
    background: rgba(52,211,153,0.10);
    border-color: rgba(52,211,153,0.30);
    color: var(--positive);
  }
  .ins-amount {
    font-family: var(--font-mono);
    font-size: 14px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .ins-amount.sell { color: var(--negative); }
  .ins-amount.buy  { color: var(--positive); }

  /* Peers */
  table.peers {
    width: 100%;
    border-collapse: collapse;
  }
  table.peers th, table.peers td {
    padding: 11px 8px;
    text-align: right;
    font-family: var(--font-mono);
    font-size: 13px;
    border-bottom: 1px solid var(--border-subtle);
  }
  table.peers th {
    font-family: var(--font-ui);
    font-size: 10px; font-weight: 500;
    color: var(--fg-2);
    letter-spacing: 0.10em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  table.peers th:first-child, table.peers td.tk {
    text-align: left;
    padding-left: 14px;
  }
  table.peers td.tk {
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--fg-1);
    font-weight: 400;
  }
  table.peers td.pos { color: var(--positive); }
  table.peers td.neg { color: var(--negative); }
  table.peers td.neutral { color: var(--fg-1); }
  table.peers tr.self {
    background: var(--accent-bg-soft);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  table.peers tr.self td.tk { color: var(--accent); }
  table.peers tr:last-child td { border-bottom: none; }
  table.peers tr:hover:not(.self) { background: rgba(255,255,255,0.02); }

  svg { display: block; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useRef, useEffect, useMemo } = React;

    /* ─── Icon helper ─────────────────────────────────────── */
    function Icon({ name, size = 16, stroke = 1.5, color = 'currentColor' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!ref.current || !window.lucide) return;
        ref.current.innerHTML = '';
        const node = window.lucide.createElement(window.lucide.icons[toPascal(name)] || window.lucide.icons.Circle);
        node.setAttribute('width', size);
        node.setAttribute('height', size);
        node.setAttribute('stroke-width', stroke);
        node.setAttribute('stroke', color);
        ref.current.appendChild(node);
      }, [name, size, stroke, color]);
      return <span ref={ref} style={{ display: 'inline-flex' }} />;
    }
    const toPascal = (k) => k.split('-').map(s => s[0].toUpperCase() + s.slice(1)).join('');

    /* ─── Top nav ─────────────────────────────────────────── */
    function TopNav() {
      const items = [
        { id: 'screener',  label: 'Screener' },
        { id: 'overview',  label: 'Overview', active: true },
        { id: 'portfolio', label: 'Portfolio' },
      ];
      return (
        <nav className="nav">
          <div className="nav-brand">
            <span className="brand-dot" />
            Quant Terminal
          </div>
          <div className="nav-items">
            {items.map(it => (
              <button key={it.id} className={`nav-item ${it.active ? 'active' : ''}`}
                onClick={() => {
                  if (it.id === 'screener') window.location.href = '/';
                  if (it.id === 'portfolio') window.location.href = '/portfolio';
                  if (it.id === 'overview') window.location.href = '/overview';
                }}>
                {it.label}
              </button>
            ))}
          </div>
        </nav>
      );
    }

    /* ─── Identity bar ────────────────────────────────────── */
    function IdentityBar({ ticker, onSearch, data }) {
      const [val, setVal] = useState('');
      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && val.trim()) {
          onSearch(val.trim());
          setVal('');
        }
      };

      const compName = data?.company_name || ticker;
      const price = data?.price ? `$${data.price.toFixed(2)}` : '---';
      const stat = data?.status || 'insufficient';
      
      const statusMap = {
        green: { color: 'var(--positive)', bg: 'var(--positive-bg)', border: 'var(--positive-border)', text: 'CODE 33 GREEN' },
        yellow: { color: 'var(--warning)', bg: 'var(--warning-bg)', border: 'var(--warning-border)', text: 'CODE 33 YELLOW' },
        red: { color: 'var(--negative)', bg: 'rgba(248,113,113,0.10)', border: 'rgba(248,113,113,0.30)', text: 'CODE 33 RED' },
        insufficient: { color: 'var(--fg-3)', bg: 'transparent', border: 'var(--border)', text: 'NO SIGNAL' }
      };
      
      const curStat = statusMap[stat] || statusMap['insufficient'];
      const statusColor = curStat.color;
      const statusBg = curStat.bg;
      const statusBorder = curStat.border;
      const statusText = curStat.text;

      return (
        <section className="identity">
          <div className="ident-left">
            <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
              <div className="ident-name">{compName}</div>
              <input 
                type="text" 
                placeholder="Search ticker..." 
                value={val}
                onChange={e => setVal(e.target.value)}
                onKeyDown={handleKeyDown}
                style={{
                  width: '160px', background: '#141416', border: '1px solid #2A2A2E', 
                  borderRadius: '8px', padding: '8px 12px', fontFamily: 'var(--font-mono)', 
                  fontSize: '12px', color: '#FAFAFA', outline: 'none', transition: 'border-color var(--t-fast)'
                }}
                onFocus={e => e.target.style.borderColor = '#D4A843'}
                onBlur={e => e.target.style.borderColor = '#2A2A2E'}
              />
            </div>
            <div className="ident-meta">
              <span>{ticker}</span><span className="sep">·</span>
              <span>Nasdaq</span><span className="sep">·</span>
              <span>USD</span>
            </div>
          </div>
          <div className="ident-right">
            {(data || ticker === 'AMD') && (
              <>
                <div className="ident-price-block">
                  <div className="ident-price">{price}</div>
                  <div className="ident-change" style={{
                    fontFamily: 'IBM Plex Mono, monospace', fontSize: '14px',
                    color: (data?.change || 0) >= 0 ? '#34D399' : '#F87171'
                  }}>
                    {ticker === 'AMD' && !data ? '+$17.92 (+3.99%)' : 
                     (data?.change !== undefined ? 
                       `${data.change >= 0 ? '+' : '-'}$${Math.abs(data.change).toFixed(2)} (${data.change_pct >= 0 ? '+' : '-'}${Math.abs(data.change_pct).toFixed(2)}%)` 
                       : '')}
                  </div>
                </div>
                <span className="code33-badge" style={{ color: statusColor, background: statusBg, borderColor: statusBorder, boxShadow: `0 0 14px ${statusColor}40` }}>
                  <span className="dot" style={{ background: statusColor, boxShadow: `0 0 6px ${statusColor}` }} />
                  {statusText}
                </span>
              </>
            )}
          </div>
        </section>
      );
    }

    /* ─── Chart ───────────────────────────────────────────── */
    const TFS = ['1D', '1W', '1M', '3M', '1Y'];

    const ChartSVG = ({ data }) => {
      if (!data || data.length === 0) return null;
      
      const prices = data.map(d => d.close);
      const minP = Math.min(...prices);
      const maxP = Math.max(...prices);
      const range = maxP - minP || 1;
      const W = 1200, H = 200, PAD = 10;
      
      const x = (i) => PAD + (i / (prices.length-1)) * (W - PAD*2);
      const y = (p) => H - PAD - ((p - minP) / range) * (H - PAD*2);
      
      const points = prices.map((p, i) => `${x(i)},${y(p)}`).join(' ');
      
      const areaPoints = `${x(0)},${H} ` + points + ` ${x(prices.length-1)},${H}`;
      
      const isPositive = prices[prices.length-1] >= prices[0];
      const lineColor = isPositive ? '#34D399' : '#F87171';
      
      return (
        <svg viewBox={`0 0 ${W} ${H}`} 
             preserveAspectRatio="none"
             style={{width:'100%', height:'100%'}}>
          <defs>
            <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={lineColor} stopOpacity="0.15"/>
              <stop offset="100%" stopColor={lineColor} stopOpacity="0"/>
            </linearGradient>
          </defs>
          <polygon points={areaPoints} fill="url(#chartGrad)"/>
          <polyline points={points} fill="none" stroke={lineColor} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
          <circle cx={x(prices.length-1)} cy={y(prices[prices.length-1])} r="4" fill={lineColor}/>
        </svg>
      );
    };

    function ChartPanel({ ticker, initialChartData }) {
      const [chartData, setChartData] = useState([]);
      const [activeTimeframe, setActiveTimeframe] = useState('3M');
      
      const TIMEFRAME_MAP = {
        '1D': '1d', '1W': '5d', '1M': '1mo',
        '3M': '3mo', '1Y': '1y'
      };

      useEffect(() => {
        if (!ticker) return;
        if (activeTimeframe === '3M' && initialChartData && initialChartData.prices) {
           const sorted = [...initialChartData.prices].sort((a,b) => new Date(a.date) - new Date(b.date));
           setChartData(sorted);
           return;
        }
        const period = TIMEFRAME_MAP[activeTimeframe] || '3mo';
        fetch(`/api/chart/${ticker}?period=${period}`)
          .then(r => r.json())
          .then(d => {
            if (d.prices) {
              const sorted = [...d.prices].sort((a,b) => new Date(a.date) - new Date(b.date));
              setChartData(sorted);
            }
            else setChartData([]);
          })
          .catch(console.error);
      }, [ticker, activeTimeframe, initialChartData]);
      
      let periodReturn = null;
      if (chartData.length >= 2) {
        const first = chartData[0].close;
        const last = chartData[chartData.length - 1].close;
        periodReturn = ((last - first) / first) * 100;
        console.log(`[Chart] ${ticker} ${activeTimeframe}: first=${first}, last=${last}, return=${periodReturn.toFixed(2)}%`);
      }

      return (
        <div className="chart-panel">
          <div className="chart-head">
            <span className="chart-title">
              Price · {activeTimeframe}
              {periodReturn !== null && (
                <span style={{ 
                  color: periodReturn >= 0 ? '#34D399' : '#F87171',
                  fontFamily: 'IBM Plex Mono, monospace',
                  fontSize: '14px',
                  fontWeight: 500,
                  marginLeft: '12px'
                }}>
                  {periodReturn >= 0 ? '+' : ''}{periodReturn.toFixed(1)}%
                </span>
              )}
            </span>
            <div className="timeframes">
              {TFS.map(t => (
                <button key={t} className={`tf-btn ${activeTimeframe === t ? 'active' : ''}`} onClick={() => setActiveTimeframe(t)}>
                  {t}
                </button>
              ))}
            </div>
          </div>
          <div className="chart-svg-wrap">
            <ChartSVG data={chartData} />
          </div>
        </div>
      );
    }

    /* ─── Key stats ──────────────────────────────────────── */
    function KeyStats({ data }) {
      const lastEps = (data?.eps_yoy || []).filter(x => x !== null && x !== undefined).slice(-1)[0];
      const lastRev = (data?.rev_yoy || []).filter(x => x !== null && x !== undefined).slice(-1)[0];
      const lastMargin = (data?.npm || []).filter(x => x !== null && x !== undefined).slice(-1)[0];

      const renderPct = (val) => {
        if (val == null) return 'N/A';
        const color = val > 0 ? '#34D399' : val < 0 ? '#F87171' : 'inherit';
        return <span style={{ color }}>{val > 0 ? '+' : ''}{val.toFixed(1)}%</span>;
      };

      const formatMcap = (v) => {
        if (!v || v === 'N/A') return 'N/A';
        return String(v).startsWith('$') ? v : `$${v}`;
      };

      const stats = data ? [
        ['Market cap', formatMcap(data.market_cap_fmt)],
        ['P/E ratio', data.pe_ratio !== 'N/A' && data.pe_ratio !== null ? data.pe_ratio.toFixed(1) + 'x' : 'N/A'],
        ['EPS YoY', renderPct(lastEps)],
        ['Rev YoY', renderPct(lastRev)],
        ['Net margin', renderPct(lastMargin)],
        ['Avg vol', data.avg_volume ? (data.avg_volume >= 1e6 ? (data.avg_volume/1e6).toFixed(1)+'M' : data.avg_volume) : 'N/A']
      ] : [
        ['Market cap', '$151.3B'],
        ['P/E ratio', '47.2x'],
        ['Revenue TTM', '$37.4B'],
        ['52w high', '$187.28'],
        ['52w low', '$76.32'],
        ['Avg vol', '43.2M'],
      ];

      return (
        <div className="stats-grid">
          {stats.map(([lbl, val]) => (
            <div className="stat-pill" key={lbl}>
              <div className="stat-lbl">{lbl}</div>
              <div className="stat-val">{val}</div>
            </div>
          ))}
        </div>
      );
    }

    /* ─── Financials ─────────────────────────────────────── */
    const FIN_TABS = ['Income Statement', 'Balance Sheet', 'Cash Flow', 'Valuation', 'Earnings'];

    function yoyTone(v) {
      if (v === '—' || !v) return 'mut';
      if (v.startsWith('-')) return 'neg';
      return 'pos';
    }

    function Financials({ data, ticker, finData }) {
      const [tab, setTab] = useState('Income Statement');
      if (!finData) return <div style={{padding:'40px', textAlign:'center', color:'var(--fg-3)'}} className="skeleton">Loading financials...</div>;
      if (finData.error) return <div style={{padding:'40px', textAlign:'center', color:'var(--negative)'}}>Failed to load financials</div>;
      
      const rev = data?.rev || [];
      const ni = data?.ni || [];
      const eps = data?.eps || [];
      const revYoy = data?.rev_yoy || [];
      const epsYoy = data?.eps_yoy || [];
      const labels = data?.rev_labels || [];

      const slice7 = (arr) => {
        if (!arr) return Array(7).fill('—');
        const sliced = arr.slice(-7);
        while (sliced.length < 7) sliced.unshift('—');
        return sliced.map(v => v !== null ? v : '—');
      };
      
      const fmtNum = (v) => {
        if (v === '—' || v == null) return '—';
        const absV = Math.abs(v);
        if (absV >= 1e9) return (v/1e9).toFixed(2) + 'B';
        if (absV >= 1e6) return (v/1e6).toFixed(0) + 'M';
        return v.toFixed(2);
      };
      
      const fmtYoy = (v) => {
        if (v === '—' || v == null) return '—';
        return (v > 0 ? '+' : '') + v.toFixed(1) + '%';
      };

      const quarters = slice7(labels);

      const finRows = [
        { metric: 'Total revenue', vals: slice7(rev).map(fmtNum) },
        { metric: 'YoY growth', yoy: true, vals: slice7(revYoy).map(fmtYoy) },
        { metric: 'Net income', vals: slice7(ni).map(fmtNum) },
        { metric: 'EPS diluted', vals: slice7(eps).map(fmtNum) },
        { metric: 'YoY growth', yoy: true, vals: slice7(epsYoy).map(fmtYoy) },
      ];

      const dateToQuarter = (dateStr) => {
        try {
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return dateStr;
          const month = d.getMonth() + 1;
          const year = d.getFullYear();
          const q = month <= 3 ? 1 : month <= 6 ? 2 : 
                    month <= 9 ? 3 : 4;
          return `Q${q} ${year}`;
        } catch { return dateStr; }
      };

      const getColumns = (dataObj) => {
        if (!dataObj) return [];
        const firstRow = Object.values(dataObj)[0] || {};
        return Object.keys(firstRow)
          .sort()
          .reverse()
          .slice(0, 7);
      };

      const BS_ROWS = [
        {label: 'Total Assets', 
         keys: ['TotalAssets','Total Assets']},
        {label: 'Total Liabilities', 
         keys: ['TotalLiabilitiesNetMinorityInterest',
                'Total Liabilities Net Minority Interest']},
        {label: 'Stockholders Equity', 
         keys: ['StockholdersEquity','Stockholders Equity',
                'CommonStockEquity']},
        {label: 'Cash & Equivalents', 
         keys: ['CashAndCashEquivalents',
                'Cash And Cash Equivalents',
                'CashCashEquivalentsAndShortTermInvestments']},
        {label: 'Total Debt', 
         keys: ['TotalDebt','Total Debt']},
        {label: 'Net Debt', 
         keys: ['NetDebt','Net Debt']},
      ];

      const CF_ROWS = [
        {label: 'Operating Cash Flow', 
         keys: ['OperatingCashFlow',
                'Operating Cash Flow',
                'CashFlowFromContinuingOperatingActivities']},
        {label: 'Free Cash Flow', 
         keys: ['FreeCashFlow','Free Cash Flow']},
        {label: 'Capital Expenditure', 
         keys: ['CapitalExpenditure','Capital Expenditure',
                'CapexCashFlow']},
        {label: 'Investing Cash Flow', 
         keys: ['InvestingCashFlow',
                'Investing Cash Flow',
                'CashFlowFromContinuingInvestingActivities']},
        {label: 'Financing Cash Flow', 
         keys: ['FinancingCashFlow',
                'Financing Cash Flow',
                'CashFlowFromContinuingFinancingActivities']},
      ];

      const renderFinTable = (dataObj, rowDefs) => {
        if (!dataObj || Object.keys(dataObj).length === 0)
          return <div style={{padding:24, 
                              color:'var(--fg-3)',
                              textAlign:'center'}}>
            No data available
          </div>;
        
        const cols = getColumns(dataObj);
        
        const getVal = (rowData, keys) => {
          for (const k of keys) {
            if (rowData[k] !== undefined && 
                rowData[k] !== null) {
              return rowData[k];
            }
          }
          return null;
        };
        
        const fmtNumStr = (v) => {
          if (v === null || v === undefined) return '—';
          const n = parseFloat(v);
          if (isNaN(n)) return '—';
          const abs = Math.abs(n);
          const sign = n < 0 ? '-' : '';
          if (abs >= 1e12) return `${sign}$${(abs/1e12).toFixed(2)}T`;
          if (abs >= 1e9)  return `${sign}$${(abs/1e9).toFixed(2)}B`;
          if (abs >= 1e6)  return `${sign}$${(abs/1e6).toFixed(0)}M`;
          return `${sign}${n.toFixed(2)}`;
        };
        
        return (
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%', 
                           borderCollapse:'collapse',
                           minWidth:700}}>
              <thead>
                <tr style={{background:'var(--bg-nav)'}}>
                  <th style={{padding:'8px 14px',
                              textAlign:'left',
                              fontSize:11,
                              color:'var(--fg-2)',
                              letterSpacing:'0.10em',
                              textTransform:'uppercase',
                              fontWeight:500,
                              minWidth:200}}>
                    METRIC
                  </th>
                  {cols.map(c => (
                    <th key={c} style={{padding:'8px 14px',
                                        textAlign:'right',
                                        fontSize:11,
                                        color:'var(--fg-2)',
                                        letterSpacing:'0.08em',
                                        fontWeight:500}}>
                      {dateToQuarter(c)}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rowDefs.map((row, i) => {
                  const rowData = {};
                  cols.forEach(col => {
                    const found = getVal(
                      Object.fromEntries(
                        Object.entries(dataObj).map(
                          ([k, v]) => [k, v[col]]
                        )
                      ), 
                      row.keys
                    );
                    rowData[col] = found;
                  });
                  
                  return (
                    <tr key={row.label} style={{
                      background: i%2===0 ? 
                        'var(--bg-card)' : 'var(--bg-row-alt)',
                      borderBottom:'1px solid var(--border-subtle)'
                    }}>
                      <td style={{padding:'9px 14px',
                                  fontSize:13,
                                  fontWeight:500,
                                  color:'var(--fg-1)'}}>
                        {row.label}
                      </td>
                      {cols.map(col => (
                        <td key={col} style={{
                          padding:'9px 14px',
                          textAlign:'right',
                          fontSize:13,
                          fontFamily:'var(--font-mono)',
                          color: parseFloat(rowData[col]) < 0 ? 
                            'var(--negative)' : 'var(--fg-1)'
                        }}>
                          {fmtNumStr(rowData[col])}
                        </td>
                      ))}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        );
      };

      const renderValuation = () => {
        if (!finData?.valuation) return <div style={{padding:'40px', textAlign:'center', color:'var(--fg-3)'}}>Loading...</div>;
        const v = finData.valuation;
        
        const formatMetric = (metric, val) => {
          if (val == null || val === 'N/A') return '—';
          if (metric === 'ROE' || metric === 'ROA' || metric === 'Profit margin' || metric === 'Profit Margin') {
            const isPos = val > 0;
            const color = isPos ? 'var(--positive)' : 'var(--fg-1)';
            return <span style={{color}}>{(val * 100).toFixed(2) + '%'}</span>;
          }
          return val.toFixed(2);
        };

        const Card = ({ label, metricKey }) => (
          <div style={{ background: 'var(--bg-card)', border: '1px solid var(--fg-3)', borderRadius: '8px', padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
            <div style={{ color: 'var(--fg-2)', fontSize: '11px', textTransform: 'uppercase', fontWeight: 500 }}>{label}</div>
            <div style={{ color: 'var(--fg-1)', fontSize: '20px', fontWeight: 'bold', fontFamily: 'var(--font-mono)' }}>
              {formatMetric(label, v[metricKey] !== undefined ? v[metricKey] : v[label])}
            </div>
          </div>
        );

        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
            <div>
              <h3 style={{ color: '#D4A843', fontSize: '14px', textTransform: 'uppercase', marginBottom: '16px' }}>Multiples</h3>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px' }}>
                <Card label="P/E" metricKey="Trailing P/E" />
                <Card label="Forward P/E" metricKey="Forward P/E" />
                <Card label="P/S" metricKey="Price/Sales" />
                <Card label="P/B" metricKey="Price/Book" />
                <Card label="EV/EBITDA" metricKey="EV/EBITDA" />
                <Card label="EV/Revenue" metricKey="EV/Revenue" />
              </div>
            </div>
            <div>
              <h3 style={{ color: '#D4A843', fontSize: '14px', textTransform: 'uppercase', marginBottom: '16px' }}>Returns</h3>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px' }}>
                <Card label="ROE" metricKey="ROE" />
                <Card label="ROA" metricKey="ROA" />
                <Card label="Profit Margin" metricKey="Profit margin" />
              </div>
            </div>
            <div>
              <h3 style={{ color: '#D4A843', fontSize: '14px', textTransform: 'uppercase', marginBottom: '16px' }}>Leverage</h3>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px' }}>
                <Card label="Debt/Equity" metricKey="Debt/Equity" />
              </div>
            </div>
          </div>
        );
      };

      const renderTabContent = () => {
        if (tab === 'Income Statement') {
          return (
            <table className="fin">
              <thead>
                <tr>
                  <th>Metric</th>
                  {quarters.map((q, idx) => <th key={idx}>{q}</th>)}
                </tr>
              </thead>
              <tbody>
                {finRows.map((row, i) => (
                  <tr key={i} className={row.yoy ? 'yoy' : ''}>
                    <td className="metric">{row.metric}</td>
                    {row.vals.map((v, j) => (
                      <td key={j} className={`num ${row.yoy ? yoyTone(v) : ''}`}>{v}</td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          );
        }
        if (tab === 'Balance Sheet') {
          console.log('BS DATA:', JSON.stringify(finData?.balance_sheet).slice(0,500));
          return renderFinTable(finData?.balance_sheet, BS_ROWS);
        }
        if (tab === 'Cash Flow') {
          return renderFinTable(finData?.cash_flow, CF_ROWS);
        }
        if (tab === 'Valuation') {
          return renderValuation();
        }
        if (tab === 'Earnings') {
          if (!finData?.earnings || finData.earnings.length === 0) {
            return <div style={{padding:'40px', textAlign:'center', color:'var(--fg-3)'}}>Earnings data coming soon</div>;
          }
          const rows = finData.earnings;
          return (
            <div style={{display: 'flex', flexDirection: 'column', gap: '20px'}}>
              <div style={{overflowX:'auto'}}>
                <table style={{width:'100%', borderCollapse:'collapse', minWidth:500}} className="fin">
                  <thead>
                    <tr style={{background:'var(--bg-nav)'}}>
                      <th style={{padding:'8px 14px', textAlign:'left', fontSize:11, color:'var(--fg-2)', letterSpacing:'0.10em', textTransform:'uppercase', fontWeight:500}}>Quarter</th>
                      <th style={{padding:'8px 14px', textAlign:'right', fontSize:11, color:'var(--fg-2)', letterSpacing:'0.10em', textTransform:'uppercase', fontWeight:500}}>Revenue</th>
                      <th style={{padding:'8px 14px', textAlign:'right', fontSize:11, color:'var(--fg-2)', letterSpacing:'0.10em', textTransform:'uppercase', fontWeight:500}}>EPS</th>
                      <th style={{padding:'8px 14px', textAlign:'right', fontSize:11, color:'var(--fg-2)', letterSpacing:'0.10em', textTransform:'uppercase', fontWeight:500}}>EPS YoY%</th>
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((row, i) => (
                      <tr key={row.date} style={{
                        background: i%2===0 ? 'var(--bg-card)' : 'var(--bg-row-alt)',
                        borderBottom:'1px solid var(--border-subtle)'
                      }}>
                        <td style={{padding:'9px 14px', fontSize:13, fontWeight:500, color:'var(--fg-1)'}}>{dateToQuarter(row.date)}</td>
                        <td style={{padding:'9px 14px', textAlign:'right', fontSize:13, fontFamily:'var(--font-mono)', color:'var(--fg-1)'}}>{fmtNum(row.revenue)}</td>
                        <td style={{padding:'9px 14px', textAlign:'right', fontSize:13, fontFamily:'var(--font-mono)', color: row.eps < 0 ? 'var(--negative)' : 'var(--fg-1)'}}>{row.eps !== null ? row.eps.toFixed(2) : '—'}</td>
                        <td style={{padding:'9px 14px', textAlign:'right', fontSize:13, fontFamily:'var(--font-mono)', color: row.eps_yoy > 0 ? 'var(--positive)' : (row.eps_yoy < 0 ? 'var(--negative)' : 'var(--fg-1)')}}>{row.eps_yoy !== null ? (row.eps_yoy > 0 ? '+' : '') + row.eps_yoy.toFixed(1) + '%' : '—'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{padding: '16px 20px', background: 'var(--bg-card)', border: '1px solid var(--border-subtle)', borderRadius: '8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                <span style={{color: 'var(--fg-2)', fontSize: 13, fontWeight: 500, textTransform: 'uppercase', letterSpacing: '0.05em'}}>Next Earnings</span>
                <span style={{color: 'var(--fg-1)', fontSize: 14, fontWeight: 600}}>{finData.next_earnings || 'N/A'}</span>
              </div>
            </div>
          );
        }
      };

      return (
        <>
          <div className="tabs">
            {FIN_TABS.map(t => (
              <button key={t} className={`tab ${tab === t ? 'active' : ''}`} onClick={() => setTab(t)}>
                {t}
              </button>
            ))}
          </div>
          <div className="table-wrap">
            {renderTabContent()}
          </div>
        </>
      );
    }

    /* ─── News ───────────────────────────────────────────── */
    function NewsSection({ ticker, newsItems }) {
      if (!newsItems) return <div style={{padding:'40px', textAlign:'center', color:'var(--fg-3)'}} className="skeleton">Loading news...</div>;
      if (newsItems.error) return <div style={{padding:'40px', textAlign:'center', color:'var(--negative)'}}>Failed to load news</div>;

      const ago = (ts) => {
        const diff = Math.floor(Date.now()/1000) - ts;
        if (diff < 60) return `${diff}s ago`;
        if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
        if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
        return `${Math.floor(diff/86400)}d ago`;
      };

      return (
        <div className="news-grid">
          {newsItems.map((item, i) => (
            <a href={item.url} target="_blank" 
               rel="noopener noreferrer"
               key={i} className="news-card"
               style={{textDecoration:'none'}}>
              <div style={{fontSize:10, 
                           color:'var(--fg-2)',
                           marginBottom:6}}>
                {ago(item.time)} · {item.source}
              </div>
              <div style={{fontSize:13,
                           color:'var(--fg-1)',
                           lineHeight:1.4}}>
                {item.title}
              </div>
            </a>
          ))}
          {newsItems.length === 0 && <div style={{color: 'var(--fg-3)'}}>No recent news found.</div>}
        </div>
      );
    }

    /* ─── Ownership ──────────────────────────────────────── */
    function Ownership({ ticker, ownershipData }) {
      const MAX_PCT = 10;
      if (!ownershipData) return <div className="panel" style={{minHeight:'200px'}}><div className="panel-label">Ownership</div><div style={{padding:'40px', textAlign:'center', color:'var(--fg-3)'}} className="skeleton">Loading...</div></div>;
      if (ownershipData.error) return <div className="panel" style={{minHeight:'200px'}}><div className="panel-label">Ownership</div><div style={{padding:'40px', textAlign:'center', color:'var(--negative)'}}>Failed to load</div></div>;

      return (
        <div className="panel">
          <div className="panel-label">Ownership</div>
          <div>
            {ownershipData.institutional.length > 0 ? ownershipData.institutional.map((h, i) => (
              <div className="holder-row" key={i}>
                <div className="holder-name">{h.name}</div>
                <div className="holder-bar">
                  <div className="holder-bar-fill" style={{ '--w': `${Math.min(100, (h.pct / MAX_PCT) * 100)}%` }} />
                </div>
                <div className="holder-pct">{h.pct.toFixed(1)}%</div>
              </div>
            )) : <div style={{color: 'var(--fg-3)', padding: '10px 0', fontSize: '12px'}}>No institutional data available.</div>}
          </div>
          <div className="insider-block">
            <div className="panel-label">Insider Activity</div>
            {ownershipData.insiders.length > 0 ? ownershipData.insiders.map((ins, i) => {
              // Convert exact values like 8400000 to $8.4M formatting if possible
              const valNum = Math.abs(ins.value);
              const valFmt = valNum >= 1e6 ? `$${(valNum/1e6).toFixed(1)}M` : valNum >= 1e3 ? `$${(valNum/1e3).toFixed(1)}K` : `$${valNum}`;
              return (
                <div className="insider-card" key={i}>
                  <div className="ins-left">
                    <div className="ins-name">{ins.name}</div>
                    <div className="ins-meta">
                      <span className="ins-role">{ins.role}</span>
                      <span className="sep">·</span>
                      <span className="ins-date">{ins.date}</span>
                    </div>
                  </div>
                  <div className="ins-right">
                    <span className={`side-pill ${ins.type.toLowerCase()}`}>{ins.type}</span>
                    <div className={`ins-amount ${ins.type.toLowerCase()}`}>
                      {ins.type === 'BUY' ? '+' : '−'}{valFmt}
                    </div>
                  </div>
                </div>
              );
            }) : <div style={{color: 'var(--fg-3)', padding: '10px 0', fontSize: '12px'}}>No insider activity available.</div>}
          </div>
        </div>
      );
    }

    /* ─── Peers ──────────────────────────────────────────── */
    function Peers({ ticker, data, peersData, onSearch }) {
      if (!peersData) return <div className="panel" style={{minHeight:'200px'}}><div className="panel-label">Peers</div><div style={{padding:'40px', textAlign:'center', color:'var(--fg-3)'}} className="skeleton">Loading...</div></div>;
      if (peersData.error) return <div className="panel" style={{minHeight:'200px'}}><div className="panel-label">Peers</div><div style={{padding:'40px', textAlign:'center', color:'var(--negative)'}}>Failed to load</div></div>;

      const lastEps = (data?.eps_yoy || []).filter(x => x !== null && x !== undefined).slice(-1)[0];
      const lastRev = (data?.rev_yoy || []).filter(x => x !== null && x !== undefined).slice(-1)[0];
      const lastMargin = (data?.npm || []).filter(x => x !== null && x !== undefined).slice(-1)[0];

      return (
        <div className="panel">
          <div className="panel-label">Peers</div>
          <table style={{width:'100%', borderCollapse:'collapse'}}>
            <thead>
              <tr>
                {['TICKER','EPS GROWTH','REV GROWTH',
                  'NET MARGIN'].map(h => (
                  <th key={h} style={{
                    fontSize:11, color:'var(--fg-2)',
                    letterSpacing:'0.10em', padding:'8px 12px',
                    textAlign: h==='TICKER' ? 'left' : 'right',
                    fontWeight:500
                  }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              <tr style={{
                background:'var(--accent-bg-soft)',
                borderLeft:'2px solid var(--accent)'
              }}>
                <td style={{padding:'10px 12px', 
                            color:'var(--accent)',
                            fontWeight:600,
                            fontFamily:'var(--font-mono)'}}>
                  {ticker}
                </td>
                <td style={{padding:'10px 12px', textAlign:'right',
                            fontFamily:'var(--font-mono)',
                            color:'var(--positive)'}}>
                  {lastEps != null ? 
                    `${lastEps>0?'+':''}${lastEps.toFixed(1)}%` 
                    : '—'}
                </td>
                <td style={{padding:'10px 12px', textAlign:'right',
                            fontFamily:'var(--font-mono)',
                            color:'var(--positive)'}}>
                  {lastRev != null ? 
                    `${lastRev>0?'+':''}${lastRev.toFixed(1)}%` 
                    : '—'}
                </td>
                <td style={{padding:'10px 12px', textAlign:'right',
                            fontFamily:'var(--font-mono)'}}>
                  {lastMargin != null ? 
                    `${lastMargin.toFixed(1)}%` : '—'}
                </td>
              </tr>
              {(peersData?.peers || []).map(p => (
                <tr key={p.ticker} style={{
                  borderBottom:'1px solid var(--border-subtle)',
                  cursor:'pointer'
                }}
                onClick={() => {
                  if (onSearch) onSearch(p.ticker);
                }}>
                  <td style={{padding:'10px 12px',
                              fontFamily:'var(--font-mono)',
                              fontWeight:600,
                              color:'var(--fg-1)'}}>
                    {p.ticker}
                  </td>
                  <td style={{padding:'10px 12px', 
                              textAlign:'right',
                              fontFamily:'var(--font-mono)',
                              color: p.eps_yoy == null ? 'var(--fg-3)' :
                                     p.eps_yoy > 0 ? 'var(--positive)' 
                                                   : 'var(--negative)'}}>
                    {p.eps_yoy != null ? 
                      `${p.eps_yoy>0?'+':''}${p.eps_yoy}%` : '—'}
                  </td>
                  <td style={{padding:'10px 12px', 
                              textAlign:'right',
                              fontFamily:'var(--font-mono)',
                              color: p.rev_yoy == null ? 'var(--fg-3)' :
                                     p.rev_yoy > 0 ? 'var(--positive)' 
                                                   : 'var(--negative)'}}>
                    {p.rev_yoy != null ? 
                      `${p.rev_yoy>0?'+':''}${p.rev_yoy}%` : '—'}
                  </td>
                  <td style={{padding:'10px 12px', 
                              textAlign:'right',
                              fontFamily:'var(--font-mono)',
                              color:'var(--fg-1)'}}>
                    {p.npm != null ? `${p.npm}%` : '—'}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    /* ─── App ────────────────────────────────────────────── */
    function EmptyState({ onSearch }) {
      const [val, setVal] = useState('');
      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && val.trim()) {
          onSearch(val.trim());
        }
      };
      return (
        <div style={{
          background: '#0E0E10', minHeight: '100vh', display: 'flex', 
          flexDirection: 'column', alignItems: 'center', justifyContent: 'center'
        }}>
          <h1 style={{ fontFamily: 'var(--font-display)', fontSize: '48px', margin: '0 0 24px 0', color: 'var(--fg-1)', fontWeight: 'normal' }}>Quant Terminal</h1>
          <input 
            type="text" 
            placeholder="Enter ticker symbol..." 
            value={val}
            onChange={e => setVal(e.target.value)}
            onKeyDown={handleKeyDown}
            style={{
              width: '400px', background: '#141416', border: '1px solid #2A2A2E', 
              borderRadius: '8px', padding: '12px 16px', fontFamily: 'var(--font-mono)', 
              fontSize: '16px', color: '#FAFAFA', outline: 'none', transition: 'border-color var(--t-fast)'
            }}
            onFocus={e => e.target.style.borderColor = '#D4A843'}
            onBlur={e => e.target.style.borderColor = '#2A2A2E'}
          />
        </div>
      );
    }

    function App() {
      const params = new URLSearchParams(window.location.search);
      const initialTicker = params.get('ticker') || null;
      const [activeTicker, setActiveTicker] = useState(initialTicker);
      const [tickerData, setTickerData] = useState(null);
      const [chartData, setChartData] = useState(null);
      const [finData, setFinData] = useState(null);
      const [newsData, setNewsData] = useState(null);
      const [ownershipData, setOwnershipData] = useState(null);
      const [peersData, setPeersData] = useState(null);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (!activeTicker) return;
        setLoading(true);
        setFinData(null);
        setNewsData(null);
        setOwnershipData(null);
        setPeersData(null);

        Promise.all([
          fetch(`/api/ticker/${activeTicker}`).then(r => r.json()),
          fetch(`/api/chart/${activeTicker}?period=3mo`).then(r => r.json())
        ]).then(([tkr, chart]) => {
          setTickerData(tkr);
          setChartData(chart);
          setLoading(false);

          Promise.allSettled([
            fetch(`/api/financials/${activeTicker}`).then(r => r.json()),
            fetch(`/api/news/${activeTicker}`).then(r => r.json()),
            fetch(`/api/ownership/${activeTicker}`).then(r => r.json()),
            fetch(`/api/peers/${activeTicker}`).then(r => r.json())
          ]).then((results) => {
            const [fin, nws, own, prs] = results;
            if (fin.status === 'fulfilled') setFinData(fin.value);
            else setFinData({ error: true });

            if (nws.status === 'fulfilled') setNewsData(nws.value.news || []);
            else setNewsData({ error: true });

            if (own.status === 'fulfilled') setOwnershipData(own.value);
            else setOwnershipData({ error: true });

            if (prs.status === 'fulfilled') setPeersData(prs.value);
            else setPeersData({ error: true });
          });
        }).catch(() => setLoading(false));
      }, [activeTicker]);

      const handleSearch = (tk) => {
        const upper = tk.toUpperCase();
        setActiveTicker(upper);
        setTickerData(null);
        window.history.pushState({}, '', `/overview?ticker=${upper}`);
      };

      if (!activeTicker) {
        return <EmptyState onSearch={handleSearch} />;
      }

      if (loading || (!tickerData && activeTicker !== 'AMD')) {
        return (
          <>
            <TopNav />
            <IdentityBar ticker={activeTicker} onSearch={handleSearch} data={null} />
            <main className="page" style={{ display: 'flex', justifyContent: 'center', paddingTop: '100px' }}>
              <div style={{ color: 'var(--fg-2)', fontSize: '16px' }}>Loading...</div>
            </main>
          </>
        );
      }

      return (
        <>
          <TopNav />
          <IdentityBar ticker={activeTicker} onSearch={handleSearch} data={tickerData} />
          <main className="page">
            <section className="section">
              <ChartPanel ticker={activeTicker} initialChartData={chartData} />
              <KeyStats data={tickerData} />
            </section>

            <section className="section">
              <div className="section-head">
                <span className="section-label">Financials</span>
              </div>
              <Financials data={tickerData} ticker={activeTicker} finData={finData} />
            </section>

            <section className="section">
              <div className="section-head">
                <span className="section-label">
                  Live News
                </span>
                <span className="live-pill">
                  <span className="dot" />
                  Live
                </span>
              </div>
              <NewsSection ticker={activeTicker} newsItems={newsData} />
            </section>

            <section className="section">
              <div className="bottom-row">
                <Ownership ticker={activeTicker} ownershipData={ownershipData} />
                <Peers ticker={activeTicker} data={tickerData} peersData={peersData} onSearch={handleSearch} />
              </div>
            </section>
          </main>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
