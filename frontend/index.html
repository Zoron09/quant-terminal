mpany  || w.ticker,\n        sec: w.sector   || 'Unknown',\n        st:  w.status,\n        cap: w.mcap     || 'N/A',\n        rq:  (w.rev    || [0,0,0]).map(v => (Number(v) >= 0 ? '+' : '') + Number(v).toFixed(0) + '%'),\n        mq:  (w.margin || [0,0,0]).map(v => (Number(v) >= 0 ? '+' : '') + Number(v).toFixed(1) + '%'),\n      }));\n    }\n  };\n  S.scanStopped = null; S.scanFailReasons = null;\n  try {\n    const fd = new FormData();\n    fd.append('file', S.file);\n    const resp = await fetch('/api/scan', { method: 'POST', body: fd });\n    const start = await resp.json();\n    if (start.error && !start.job_id) {\n      console.warn('[runScan] start error:', start.error);\n    } else {\n      while (true) {\n        const st = await fetch('/api/scan/status').then(r => r.json());\n        applyStatus(st);\n        if (st.done || st.error) {\n          S.scanStopped = st.stopped_early ? (st.stop_reason || 'stopped early') : null;\n          S.scanFailReasons = st.failure_reasons || null;\n          if (st.error) console.warn('[runScan] job error:', st.error);\n          break;\n        }\n        renderScreener();\n        await new Promise(res => setTimeout(res, 3000));\n      }\n    }\n  } catch (err) {\n    console.warn('[runScan] error:', err);\n  }\n  S.scanning = false; S.scanRan = true; renderScreener();\n}\n\nconst DB_NAME = 'SinListDB';\nconst DB_VERSION = 1;\nconst STORE = 'trades';\nlet db = null;\nlet TRADES = [];\nlet sortCol = 'date';\nlet sortAsc = false;\n\nfunction openDB() {\n  return new Promise((resolve, reject) => {\n    const req = indexedDB.open(DB_NAME, DB_VERSION);\n    req.onupgradeneeded = e => {\n      const d = e.target.result;\n      if (!d.objectStoreNames.contains(STORE)) {\n        d.createObjectStore(STORE, { keyPath: 'id' });\n      }\n    };\n    req.onsuccess = e => { db = e.target.result; resolve(db); };\n    req.onerror = e => reject(e.target.error);\n  });\n}\n\nfunction dbGetAll() {\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(STORE, 'readonly');\n    const req = tx.objectStore(STORE).getAll();\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = e => reject(e.target.error);\n  });\n}\n\nfunction dbPut(trade) {\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(STORE, 'readwrite');\n    const req = tx.objectStore(STORE).put(trade);\n    req.onsuccess = () => resolve();\n    req.onerror = e => reject(e.target.error);\n  });\n}\n\nfunction dbClear() {\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(STORE, 'readwrite');\n    const req = tx.objectStore(STORE).clear();\n    req.onsuccess = () => resolve();\n    req.onerror = e => reject(e.target.error);\n  });\n}\n\nfunction dbDelete(id) {\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(STORE, 'readwrite');\n    const req = tx.objectStore(STORE).delete(id);\n    req.onsuccess = () => resolve();\n    req.onerror = e => reject(e.target.error);\n  });\n}\n\n// =============================================================================\n// Helpers\n// =============================================================================\nconst DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\n\nfunction genId() {\n  return 'manual_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);\n}\n\nfunction parseTags(str) {\n  if (!str) return [];\n  return str.split(',').map(s => s.trim()).filter(Boolean);\n}\n\nfunction fmtPnl(v) {\n  const n = Number(v) || 0;\n  const sign = n >= 0 ? '+' : '';\n  return sign + n.toFixed(2);\n}\n\nfunction fmtNum(v, decimals = 2) {\n  const n = Number(v);\n  return isNaN(n) ? '\u2014' : n.toFixed(decimals);\n}\n\nfunction dowFromDate(dateStr) {\n  if (!dateStr) return '';\n  const d = new Date(dateStr + 'T12:00:00');\n  return DOW[d.getDay()] || '';\n}\n\nfunction computeStats(trades) {\n  const n = trades.length;\n  const wins = trades.filter(t => Number(t.pnl) > 0).length;\n  const totalPnl = trades.reduce((s, t) => s + (Number(t.pnl) || 0), 0);\n  const avgPnl = n ? totalPnl / n : 0;\n  const pnls = trades.map(t => Number(t.pnl) || 0);\n  const best = pnls.length ? Math.max(...pnls) : 0;\n  const worst = pnls.length ? Math.min(...pnls) : 0;\n  const winRate = n ? (wins / n) * 100 : 0;\n  return { n, wins, totalPnl, avgPnl, best, worst, winRate };\n}\n\nfunction updateStats(trades) {\n  const s = computeStats(trades);\n\n  document.getElementById('stat-total').textContent = s.n || '\u2014';\n  const wrEl = document.getElementById('stat-wr');\n  wrEl.textContent = s.n ? s.winRate.toFixed(1) + '%' : '\u2014';\n  wrEl.className = 'value ' + (s.n && s.winRate >= 50 ? 'pos' : s.n ? 'neg' : 'neutral');\n  const pnlEl = document.getElementById('stat-pnl');\n  pnlEl.textContent = s.n ? (s.totalPnl >= 0 ? '+' : '') + s.totalPnl.toFixed(2) : '\u2014';\n  pnlEl.className = 'value ' + (s.totalPnl > 0 ? 'pos' : s.totalPnl < 0 ? 'neg' : 'neutral');\n  const avgEl = document.getElementById('stat-avg');\n  avgEl.textContent = s.n ? (s.avgPnl >= 0 ? '+' : '') + s.avgPnl.toFixed(2) : '\u2014';\n  avgEl.className = 'value ' + (s.avgPnl > 0 ? 'pos' : s.avgPnl < 0 ? 'neg' : 'neutral');\n  document.getElementById('stat-best').textContent = s.n ? '+' + s.best.toFixed(2) : '\u2014';\n  document.getElementById('stat-worst').textContent = s.n ? s.worst.toFixed(2) : '\u2014';\n}\n\nfunction updateAccFilter() {\n  const sel = document.getElementById('filter-acc');\n  const current = sel.value;\n  const accs = [...new Set(TRADES.map(t => t.acc).filter(Boolean))].sort();\n  sel.innerHTML = '<option value=\"\">All accounts<\/option>' + accs.map(a => `<option>${a}<\/option>`).join('');\n  if (accs.includes(current)) sel.value = current;\n}\n\n// =============================================================================\n// Sorting & filtering\n// =============================================================================\nfunction sortBy(col) {\n  if (sortCol === col) { sortAsc = !sortAsc; } else { sortCol = col; sortAsc = true; }\n  // Update header arrows\n  document.querySelectorAll('th').forEach(th => th.classList.remove('sorted'));\n  const arrowEl = document.getElementById('sort-' + col);\n  if (arrowEl) {\n    arrowEl.parentElement.classList.add('sorted');\n    arrowEl.textContent = sortAsc ? '\u2191' : '\u2193';\n  }\n  renderTable();\n}\n\nfunction getFilteredTrades() {\n  const search = document.getElementById('filter-search').value.toLowerCase();\n  const dir = document.getElementById('filter-dir').value;\n  const win = document.getElementById('filter-win').value;\n  const acc = document.getElementById('filter-acc').value;\n  const dateFilter = document.getElementById('filter-date') ? document.getElementById('filter-date').value : '';\n\n  return TRADES.filter(t => {\n    if (search && !((t.pairs || '').toLowerCase().includes(search) || (t.notes || '').toLowerCase().includes(search) || (t.model || '').toLowerCase().includes(search))) return false;\n    if (dir && t.dir !== dir) return false;\n    if (win === 'win' && !(Number(t.pnl) > 0)) return false;\n    if (win === 'loss' && !(Number(t.pnl) <= 0)) return false;\n    if (acc && t.acc !== acc) return false;\n    if (dateFilter && t.date !== dateFilter) return false;\n    return true;\n  });\n}\n\nfunction _entryMinutes(t) {\n  // Convert \"9:31 AM\" / \"12:26 PM\" to total minutes since midnight for sorting.\n  const m = (t.entryTime || '').match(/(\\d+):(\\d+)\\s*(AM|PM)/i);\n  if (!m) return 0;\n  let h = parseInt(m[1]), min = parseInt(m[2]);\n  const pm = m[3].toUpperCase() === 'PM';\n  if (pm && h !== 12) h += 12;\n  if (!pm && h === 12) h = 0;\n  return h * 60 + min;\n}\n\nfunction buildSeqMap() {\n  // Sort ALL trades by date then entryTime (chronological, independent of display sort).\n  // Returns {id: sequenceNumber} where #1 = oldest trade.\n  const sorted = [...TRADES].sort((a, b) => {\n    const d = (a.date || '').localeCompare(b.date || '');\n    if (d !== 0) return d;\n    return _entryMinutes(a) - _entryMinutes(b);\n  });\n  const map = {};\n  sorted.forEach((t, i) => { map[t.id] = i + 1; });\n  return map;\n}\n\nfunction renderTable() {\n  const seqMap = buildSeqMap(); // chronological sequence, independent of display sort\n  const filtered = getFilteredTrades();\n  updateStats(filtered);\n\n  // Sort\n  filtered.sort((a, b) => {\n    let va = a[sortCol], vb = b[sortCol];\n    if (sortCol === 'pnl' || sortCol === 'entry' || sortCol === 'exit' || sortCol === 'contracts' || sortCol === 'rating') {\n      va = Number(va) || 0; vb = Number(vb) || 0;\n    } else {\n      va = (va || '').toString(); vb = (vb || '').toString();\n    }\n    if (va < vb) return sortAsc ? -1 : 1;\n    if (va > vb) return sortAsc ? 1 : -1;\n    // Tiebreaker: for same primary value, always sort by entryTime descending (newest first)\n    return _entryMinutes(b) - _entryMinutes(a);\n  });\n\n  const tbody = document.getElementById('trades-tbody');\n  if (filtered.length === 0) {\n    tbody.innerHTML = `<tr><td colspan=\"16\" class=\"empty-state\">${TRADES.length === 0 ? 'No trades yet. Add one or import a Wealthsimple JSON.' : 'No trades match filters.'}<\/td><\/tr>`;\n    return;\n  }\n\n  tbody.innerHTML = filtered.map(t => {\n    const pnl = Number(t.pnl) || 0;\n    const cls = pnl > 0 ? 'win' : pnl < 0 ? 'loss' : '';\n    const ptags = (t.ptags || []).map(tag => `<span class=\"tag ptag\">${escHtml(tag)}<\/span>`).join('');\n    const ntags = (t.ntags || []).map(tag => `<span class=\"tag ntag\">${escHtml(tag)}<\/span>`).join('');\n    return `<tr>\n      <td style=\"color:var(--muted);text-align:right\">${seqMap[t.id] || ''}<\/td>\n      <td>${escHtml(t.date || '')}<\/td>\n      <td>${escHtml(t.pairs || '')}<\/td>\n      <td><span class=\"dir-badge ${t.dir === 'LONG' ? 'long' : 'short'}\">${escHtml(t.dir || '')}<\/span><\/td>\n      <td>${t.contracts || '\u2014'}<\/td>\n      <td>${fmtNum(t.entry, 4)}${t.fills && t.fills.length > 1 ? `<span class=\"fills-badge\" title=\"${escHtml(t.fills.map(f => f.qty + 'x @ $' + fmtNum(f.entry, 4) + '  ' + (f.entryTime || '')).join('\\n'))}\">${t.fills.length} fills<\/span>` : ''}<\/td>\n      <td>${escHtml(t.entryTime || '')}<\/td>\n      <td>${fmtNum(t.exit, 4)}<\/td>\n      <td>${t.exitDate ? `<span title=\"${escHtml(t.exitDate)}\" style=\"color:var(--yellow);font-size:10px\">${escHtml(t.exitDate.slice(5))}<\/span> ` : ''}${escHtml(t.exitTime || '')}<\/td>\n      <td class=\"${cls}\">${fmtPnl(t.pnl)}<\/td>\n      <td title=\"${escHtml(t.acc || '')}\">${escHtml((t.acc || '').slice(0, 18))}<\/td>\n      <td>${t.rating != null ? t.rating : '\u2014'}<\/td>\n      <td>${escHtml(t.session || '')}<\/td>\n      <td>${escHtml(t.model || '')}<\/td>\n      <td>${ptags}${ntags}<\/td>\n      <td class=\"actions\">\n        <button onclick=\"openEditModal('${escHtml(t.id)}')\" style=\"padding:4px 8px;font-size:11px\">Edit<\/button>\n        <button class=\"danger\" onclick=\"deleteTrade('${escHtml(t.id)}')\" style=\"padding:4px 8px;font-size:11px\">Del<\/button>\n      <\/td>\n    <\/tr>`;\n  }).join('');\n}\n\nfunction escHtml(s) {\n  return String(s || '').replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n}\n\nfunction clearFilters() {\n  document.getElementById('filter-search').value = '';\n  document.getElementById('filter-dir').value = '';\n  document.getElementById('filter-win').value = '';\n  document.getElementById('filter-acc').value = '';\n  document.getElementById('filter-date').value = '';\n  renderTable();\n}\n\n// =============================================================================\n// Add / Edit modal\n// =============================================================================\nlet editingId = null;\n\nfunction openAddModal() {\n  editingId = null;\n  document.getElementById('modal-title').textContent = 'Add Trade';\n  const form = document.getElementById('trade-form');\n  form.reset();\n  document.getElementById('edit-id').value = '';\n  // Default date to today\n  form.date.value = new Date().toISOString().slice(0, 10);\n  document.getElementById('trade-modal').style.display = 'flex';\n}\n\nfunction openEditModal(id) {\n  const trade = TRADES.find(t => t.id === id);\n  if (!trade) return;\n  editingId = id;\n  document.getElementById('modal-title').textContent = 'Edit Trade';\n  const form = document.getElementById('trade-form');\n  form.reset();\n  document.getElementById('edit-id').value = id;\n\n  const fields = ['date','pairs','dir','contracts','entry','entryTime','exit','exitTime','pnl','acc','session','model','ew','rating','notes'];\n  fields.forEach(f => { if (form[f]) form[f].value = trade[f] != null ? trade[f] : ''; });\n  if (form.fp) form.fp.checked = !!trade.fp;\n  if (form.be) form.be.checked = !!trade.be;\n  if (form.ptags) form.ptags.value = (trade.ptags || []).join(', ');\n  if (form.ntags) form.ntags.value = (trade.ntags || []).join(', ');\n  document.getElementById('trade-modal').style.display = 'flex';\n}\n\nfunction closeModal() {\n  document.getElementById('trade-modal').style.display = 'none';\n}\n\nasync function submitTrade(e) {\n  e.preventDefault();\n  const form = e.target;\n  const fd = new FormData(form);\n\n  const pnl = parseFloat(fd.get('pnl')) || 0;\n  const contracts = parseInt(fd.get('contracts')) || 0;\n  const dateStr = fd.get('date') || '';\n\n  const trade = {\n    id: fd.get('id') || genId(),\n    date: dateStr,\n    pairs: (fd.get('pairs') || '').toUpperCase().trim(),\n    session: fd.get('session') || '',\n    model: fd.get('model') || '',\n    dir: fd.get('dir') || 'LONG',\n    pnl,\n    contracts,\n    entry: parseFloat(fd.get('entry')) || 0,\n    entryTime: fd.get('entryTime') || '',\n    exit: parseFloat(fd.get('exit')) || 0,\n    exitTime: fd.get('exitTime') || '',\n    ew: fd.get('ew') || '',\n    acc: fd.get('acc') || '',\n    rating: fd.get('rating') ? parseInt(fd.get('rating')) : null,\n    fp: form.fp ? form.fp.checked : false,\n    be: form.be ? form.be.checked : false,\n    win: pnl > 0,\n    ptags: parseTags(fd.get('ptags')),\n    ntags: parseTags(fd.get('ntags')),\n    notes: fd.get('notes') || '',\n    dow: dowFromDate(dateStr),\n  };\n\n  try {\n    await dbPut(trade);\n    const idx = TRADES.findIndex(t => t.id === trade.id);\n    if (idx >= 0) TRADES[idx] = trade; else TRADES.push(trade);\n    updateAccFilter();\n    renderTable();\n    closeModal();\n    showToast(editingId ? 'Trade updated.' : 'Trade added.', 'success');\n  } catch (err) {\n    showToast('Error saving trade: ' + err.message, 'error');\n  }\n}\n\nasync function clearAllTrades() {\n  if (!confirm('This will delete all trades. Are you sure?')) return;\n  try {\n    await dbClear();\n    TRADES = [];\n    updateAccFilter();\n    renderTable();\n    showToast('All trades deleted.', 'info');\n  } catch (err) {\n    showToast('Error: ' + err.message, 'error');\n  }\n}\n\nasync function deleteTrade(id) {\n  if (!confirm('Delete this trade?')) return;\n  try {\n    await dbDelete(id);\n    TRADES = TRADES.filter(t => t.id !== id);\n    updateAccFilter();\n    renderTable();\n    showToast('Trade deleted.', 'info');\n  } catch (err) {\n    showToast('Error: ' + err.message, 'error');\n  }\n}\n\n// =============================================================================\n// Wealthsimple JSON import\n// =============================================================================\nfunction triggerImport() {\n  document.getElementById('ws-import-input').value = '';\n  document.getElementById('ws-import-input').click();\n}\n\nasync function handleImportFile(input) {\n  const file = input.files[0];\n  if (!file) return;\n  try {\n    const text = await file.text();\n    const data = JSON.parse(text);\n    if (!Array.isArray(data)) throw new Error('JSON must be an array of trade objects');\n    await importTrades(data);\n  } catch (err) {\n    showToast('Import failed: ' + err.message, 'error');\n  }\n}\n\nasync function importTrades(data) {\n  const existingIds = new Set(TRADES.map(t => t.id));\n  let imported = 0, skipped = 0;\n  for (const trade of data) {\n    if (!trade.id) { skipped++; continue; }\n    if (existingIds.has(trade.id)) { skipped++; continue; }\n    // Ensure required defaults\n    trade.win = Number(trade.pnl) > 0;\n    trade.ptags = trade.ptags || [];\n    trade.ntags = trade.ntags || [];\n    trade.fp = trade.fp || false;\n    trade.be = trade.be || false;\n    trade.session = trade.session || '';\n    trade.model = trade.model || '';\n    trade.ew = trade.ew || '';\n    trade.notes = trade.notes || '';\n    trade.rating = trade.rating || null;\n    try {\n      await dbPut(trade);\n      TRADES.push(trade);\n      existingIds.add(trade.id);\n      imported++;\n    } catch (err) {\n      skipped++;\n    }\n  }\n  updateAccFilter();\n  renderTable();\n  showToast(`Imported ${imported} trade${imported !== 1 ? 's' : ''}, skipped ${skipped} duplicate${skipped !== 1 ? 's' : ''}.`, imported > 0 ? 'success' : 'info');\n}\n\n// =============================================================================\n// Needs-review import + modal\n// =============================================================================\nfunction triggerReviewImport() {\n  document.getElementById('review-import-input').value = '';\n  document.getElementById('review-import-input').click();\n}\n\nasync function handleReviewFile(input) {\n  const file = input.files[0];\n  if (!file) return;\n  try {\n    const text = await file.text();\n    const data = JSON.parse(text);\n    if (!Array.isArray(data)) throw new Error('Expected a JSON array');\n    showReviewModal(data);\n  } catch (err) {\n    showToast('Could not load review file: ' + err.message, 'error');\n  }\n}\n\nfunction showReviewModal(items) {\n  const body = document.getElementById('review-modal-body');\n  if (!items || items.length === 0) {\n    body.innerHTML = '<p class=\"empty-state\">No items needing review.<\/p>';\n  } else {\n    body.innerHTML = items.map(item => {\n      const leg = item.leg || {};\n      const ticker = leg.assetSymbol || '?';\n      const date = (leg.occurredAt || '').slice(0, 10);\n      const reason = item.reason || '?';\n      const contractType = leg.contractType || '';\n      const strike = leg.strikePrice != null ? leg.strikePrice : '';\n      const expiry = leg.expiryDate || '';\n      const qty = leg.assetQuantity != null ? leg.assetQuantity : '';\n      return `<div class=\"review-item\">\n        <div class=\"ticker\">${escHtml(ticker)} ${contractType ? escHtml(contractType) + ' $' + escHtml(String(strike)) + ' ' + escHtml(expiry) : ''}<\/div>\n        <div class=\"reason\">\u26a0 ${escHtml(reason)}<\/div>\n        <div class=\"meta\">Date: ${escHtml(date)}  |  Qty: ${escHtml(String(qty))}<\/div>\n      <\/div>`;\n    }).join('');\n  }\n  document.getElementById('review-modal').style.display = 'flex';\n}\n\nfunction closeReviewModal() {\n  document.getElementById('review-modal').style.display = 'none';\n}\n\n// =============================================================================\n// Pre-trade checklist modal (static, read-only for now)\n// =============================================================================\nfunction openChecklistModal() {\n  document.getElementById('checklist-modal').style.display = 'flex';\n}\n\nfunction closeChecklistModal() {\n  document.getElementById('checklist-modal').style.display = 'none';\n}\n\n// =============================================================================\n// Toast\n// =============================================================================\nfunction showToast(msg, type = 'info') {\n  const c = document.getElementById('toast-container');\n  const t = document.createElement('div');\n  t.className = 'toast ' + type;\n  t.textContent = msg;\n  c.appendChild(t);\n  requestAnimationFrame(() => { requestAnimationFrame(() => t.classList.add('show')); });\n  setTimeout(() => {\n    t.classList.remove('show');\n    setTimeout(() => t.remove(), 300);\n  }, 3500);\n}\n\n// =============================================================================\n// Auto-sync from ws_import_latest.json\n// =============================================================================\nasync function syncLatest(silent = false) {\n  let resp;\n  try {\n    resp = await fetch('ws_import_latest.json?t=' + Date.now(), { cache: 'no-store' });\n  } catch (_) {\n    return; // network error (e.g. file:// protocol) \u2014 fail silently\n  }\n  if (!resp.ok) return; // 404 = file not generated yet \u2014 fail silently\n  let data;\n  try { data = await resp.json(); } catch (_) { return; }\n  if (!Array.isArray(data)) return;\n\n  const existingIds = new Set(TRADES.map(t => t.id));\n  let imported = 0;\n  for (const trade of data) {\n    if (!trade.id || existingIds.has(trade.id)) continue;\n    trade.win = Number(trade.pnl) > 0;\n    trade.ptags = trade.ptags || [];\n    trade.ntags = trade.ntags || [];\n    trade.fp = trade.fp || false;\n    trade.be = trade.be || false;\n    trade.session = trade.session || '';\n    trade.model = trade.model || '';\n    trade.ew = trade.ew || '';\n    trade.notes = trade.notes || '';\n    trade.rating = trade.rating || null;\n    try {\n      await dbPut(trade);\n      TRADES.push(trade);\n      existingIds.add(trade.id);\n      imported++;\n    } catch (_) {}\n  }\n  if (imported > 0) {\n    updateAccFilter();\n    renderTable();\n    renderAnalyticsPage();\n    showToast(`Synced ${imported} new trade${imported !== 1 ? 's' : ''}.`, 'success');\n  } else {\n    if (data.length !== TRADES.length) {\n      showToast(`JSON has ${data.length} trades but journal has ${TRADES.length} \u2014 try Clear All + Sync to reset.`, 'error');\n    } else if (!silent) {\n      showToast('No new trades \u2014 already up to date.', 'info');\n    }\n  }\n}\n\n// =============================================================================\n// Navigation (top tab bar)\n// =============================================================================\nconst PAGE_RENDERERS = {\n  analytics: () => renderAnalyticsPage(),\n  review: () => loadReviewNotes(),\n  trades: () => renderTable(),\n  missed: () => renderMissedTable(),\n  milestones: () => loadMilestone(),\n};\n\nfunction showPage(name) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  const target = document.getElementById('page-' + name);\n  if (target) target.classList.add('active');\n\n  document.querySelectorAll('.tab[data-page]').forEach(el => el.classList.toggle('active', el.dataset.page === name));\n\n  const renderFn = PAGE_RENDERERS[name];\n  if (renderFn) renderFn();\n}\n\n// =============================================================================\n// Chart helpers (hand-rolled inline SVG, no external deps)\n// =============================================================================\nfunction getCssVar(name) {\n  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();\n}\n\nfunction buildSvgBar(data, opts = {}) {\n  const { w = 440, h = 160, padL = 6, padR = 6, padT = 10, padB = 24, singleColor } = opts;\n  if (!data.length) return '<p class=\"empty-state\" style=\"padding:30px 0\">No data yet.<\/p>';\n  const vals = data.map(d => d.value);\n  const minV = Math.min(...vals, 0);\n  const maxV = Math.max(...vals, 0);\n  const range = maxV - minV || 1;\n  const plotW = w - padL - padR;\n  const plotH = h - padT - padB;\n  const n = data.length;\n  const gap = Math.max(2, plotW / n * 0.18);\n  const bw = Math.max(4, plotW / n - gap);\n  const zeroY = padT + plotH * (1 - (-minV / range));\n\n  let els = '';\n  const midV = minV + range * 0.5;\n  if (midV !== 0) {\n    const y = padT + plotH * (1 - (midV - minV) / range);\n    els += `<line x1=\"${padL}\" y1=\"${y}\" x2=\"${w - padR}\" y2=\"${y}\" stroke=\"${getCssVar('--border-line')}\" stroke-width=\"1\"/>`;\n  }\n  els += `<line x1=\"${padL}\" y1=\"${zeroY}\" x2=\"${w - padR}\" y2=\"${zeroY}\" stroke=\"${getCssVar('--muted3')}\" stroke-width=\"1\"/>`;\n\n  data.forEach((d, i) => {\n    const x = padL + i * (plotW / n) + gap / 2;\n    const isPos = d.value >= 0;\n    const barTop = isPos ? padT + plotH * (1 - (d.value - minV) / range) : zeroY;\n    const barH = Math.max(1, Math.abs(d.value / range) * plotH);\n    const color = singleColor || (isPos ? getCssVar('--green') : getCssVar('--red'));\n    els += `<rect x=\"${x}\" y=\"${barTop}\" width=\"${bw}\" height=\"${barH}\" fill=\"${color}\" fill-opacity=\"0.88\" rx=\"2\"/>`;\n    els += `<text x=\"${x + bw / 2}\" y=\"${h - 5}\" text-anchor=\"middle\" fill=\"${getCssVar('--muted3')}\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\">${escHtml(String(d.label))}<\/text>`;\n  });\n\n  return `<svg viewBox=\"0 0 ${w} ${h}\" style=\"width:100%;height:${h}px;display:block\">${els}<\/svg>`;\n}\n\nfunction renderBarChart(elId, labels, data, label, fixedColor) {\n  const el = document.getElementById(elId);\n  if (!el) return;\n  el.innerHTML = buildSvgBar(labels.map((l, i) => ({ label: l, value: data[i] })), { singleColor: fixedColor });\n}\n\nfunction buildSvgLine(pts, opts = {}) {\n  const { w = 440, h = 160, padL = 8, padR = 8, padT = 12, padB = 8 } = opts;\n  if (!pts || pts.length < 2) return '<p class=\"empty-state\" style=\"padding:30px 0\">Not enough data yet.<\/p>';\n  const minV = Math.min(...pts);\n  const maxV = Math.max(...pts);\n  const rng = maxV - minV || 1;\n  const plotW = w - padL - padR;\n  const plotH = h - padT - padB;\n  const xFor = i => padL + (i / (pts.length - 1)) * plotW;\n  const yFor = v => padT + plotH - ((v - minV) / rng) * plotH;\n  const zeroY = yFor(0);\n  const pathD = pts.map((v, i) => `${i === 0 ? 'M' : 'L'}${xFor(i)},${yFor(v)}`).join(' ');\n  const areaD = `M${xFor(0)},${zeroY} ${pts.map((v, i) => `L${xFor(i)},${yFor(v)}`).join(' ')} L${xFor(pts.length - 1)},${zeroY}Z`;\n  const last = pts[pts.length - 1];\n  const isPos = last >= 0;\n  const lc = isPos ? getCssVar('--green') : getCssVar('--red');\n  const fc = isPos ? 'rgba(52,211,153,0.07)' : 'rgba(248,113,113,0.07)';\n\n  return `<svg viewBox=\"0 0 ${w} ${h}\" style=\"width:100%;height:${h}px;display:block\">\n    <line x1=\"${padL}\" y1=\"${zeroY}\" x2=\"${w - padR}\" y2=\"${zeroY}\" stroke=\"${getCssVar('--muted3')}\" stroke-width=\"1\"/>\n    <path d=\"${areaD}\" fill=\"${fc}\"/>\n    <path d=\"${pathD}\" fill=\"none\" stroke=\"${lc}\" stroke-width=\"1.75\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n    <circle cx=\"${xFor(pts.length - 1)}\" cy=\"${yFor(last)}\" r=\"3\" fill=\"${lc}\"/>\n  <\/svg>`;\n}\n\nfunction renderLineChart(elId, labels, data, label) {\n  const el = document.getElementById(elId);\n  if (!el) return;\n  el.innerHTML = buildSvgLine(data);\n}\n\nfunction buildSvgRadar(values, labels) {\n  const cx = 148, cy = 132, r = 90;\n  const N = values.length;\n  const step = (2 * Math.PI) / N;\n  const a0 = -Math.PI / 2;\n  const px = (i, s) => cx + r * s * Math.cos(a0 + i * step);\n  const py = (i, s) => cy + r * s * Math.sin(a0 + i * step);\n\n  let els = '';\n  [0.25, 0.5, 0.75, 1].forEach((s, ri) => {\n    const pts = Array.from({ length: N }, (_, i) => `${px(i, s)},${py(i, s)}`).join(' ');\n    els += `<polygon points=\"${pts}\" fill=\"none\" stroke=\"${ri === 3 ? getCssVar('--muted3') : getCssVar('--border-btn')}\" stroke-width=\"1\"/>`;\n  });\n  for (let i = 0; i < N; i++) {\n    els += `<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${px(i, 1)}\" y2=\"${py(i, 1)}\" stroke=\"${getCssVar('--border-btn')}\" stroke-width=\"1\"/>`;\n  }\n  const ds = values.map(v => Math.max(0, Math.min(100, v)) / 100);\n  const dpts = ds.map((s, i) => `${px(i, s)},${py(i, s)}`).join(' ');\n  els += `<polygon points=\"${dpts}\" fill=\"rgba(52,211,153,0.14)\" stroke=\"${getCssVar('--green')}\" stroke-width=\"2\" stroke-linejoin=\"round\"/>`;\n  ds.forEach((s, i) => {\n    els += `<circle cx=\"${px(i, s)}\" cy=\"${py(i, s)}\" r=\"3.5\" fill=\"${getCssVar('--green')}\"/>`;\n  });\n  const off = 24;\n  labels.forEach((lbl, i) => {\n    const cosA = Math.cos(a0 + i * step);\n    const sinA = Math.sin(a0 + i * step);\n    const lx = cx + (r + off) * cosA;\n    const ly = cy + (r + off) * sinA;\n    const anchor = Math.abs(cosA) < 0.15 ? 'middle' : cosA > 0 ? 'start' : 'end';\n    els += `<text x=\"${lx}\" y=\"${ly - 2}\" text-anchor=\"${anchor}\" fill=\"${getCssVar('--muted')}\" font-size=\"10\" font-family=\"Inter, sans-serif\" font-weight=\"500\">${escHtml(lbl)}<\/text>`;\n    els += `<text x=\"${lx}\" y=\"${ly + 12}\" text-anchor=\"${anchor}\" fill=\"${getCssVar('--green')}\" font-size=\"10\" font-family=\"IBM Plex Mono, monospace\" font-weight=\"600\">${values[i].toFixed(0)}%<\/text>`;\n  });\n\n  return `<svg viewBox=\"0 0 296 280\" style=\"width:100%;display:block\">${els}<\/svg>`;\n}\n\n// =============================================================================\n// Analytics page assembly\n// =============================================================================\nfunction renderAnalyticsPage() {\n  renderAnalyticsStats();\n  renderAnalyticsGoal();\n  renderPerformanceRadar();\n  renderCalendar();\n  renderTimeAnalysis();\n  renderRiskAnalysis();\n  renderDisciplineAnalysis();\n}\n\nfunction _fmtShortDate(dateStr) {\n  const d = new Date(dateStr + 'T12:00:00');\n  return d.toLocaleString('en-US', { month: 'short', day: 'numeric' });\n}\n\nfunction renderAnalyticsStats() {\n  const s = computeStats(TRADES);\n  const wrEl = document.getElementById('an-stat-winrate');\n  wrEl.textContent = s.n ? s.winRate.toFixed(1) + '%' : '\u2014';\n  wrEl.className = 'big-value ' + (s.n && s.winRate >= 50 ? 'pos' : s.n ? 'neg' : 'neutral');\n  document.getElementById('an-stat-winrate-sub').textContent = s.n ? `${s.wins} of ${s.n} trades` : '\u2014';\n\n  const pnlEl = document.getElementById('an-stat-pnl');\n  pnlEl.textContent = s.n ? fmtPnl(s.totalPnl) : '\u2014';\n  pnlEl.className = 'big-value ' + (s.totalPnl > 0 ? 'pos' : s.totalPnl < 0 ? 'neg' : 'neutral');\n  document.getElementById('an-stat-pnl-sub').textContent = s.n ? `avg ${fmtPnl(s.avgPnl)} / trade` : '\u2014';\n\n  document.getElementById('an-stat-count').textContent = s.n || '\u2014';\n  const dates = TRADES.map(t => t.date).filter(Boolean).sort();\n  document.getElementById('an-stat-count-sub').textContent = dates.length\n    ? `${_fmtShortDate(dates[0])} \u2014 ${_fmtShortDate(dates[dates.length - 1])}`\n    : '\u2014';\n}\n\nfunction renderAnalyticsGoal() {\n  const goal = parseFloat(localStorage.getItem(MILESTONE_KEY)) || 0;\n  const wrap = document.getElementById('an-goal-wrap');\n  const totalPnl = computeStats(TRADES).totalPnl;\n  if (!goal || goal <= 0) {\n    wrap.innerHTML = `<div class=\"label\" style=\"margin-bottom:10px\">Profit Goal<\/div><p class=\"empty-state\" style=\"padding:8px 0;text-align:left\">No goal set yet. <a href=\"#\" onclick=\"showPage('milestones');return false;\" style=\"color:var(--green)\">Set a goal \u2192<\/a><\/p>`;\n    return;\n  }\n  const pct = Math.max(0, Math.min(100, (totalPnl / goal) * 100));\n  wrap.innerHTML = `\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px\">\n      <div class=\"label\" style=\"margin-bottom:0\">Profit Goal<\/div>\n      <div style=\"font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--green)\">${pct.toFixed(1)}%<\/div>\n    <\/div>\n    <div class=\"thin-progress\"><div style=\"width:${pct}%;background:${totalPnl >= 0 ? 'var(--green)' : 'var(--red)'}\"><\/div><\/div>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 0\">\n      <span style=\"font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--text)\">${fmtPnl(totalPnl)}<\/span>\n      <span style=\"font-family:var(--font-mono);font-size:11px;color:var(--muted2)\">of ${fmtPnl(goal)}<\/span>\n    <\/div>`;\n}\n\n// =============================================================================\n// Performance Radar\n// =============================================================================\nfunction computeRadarMetrics() {\n  const s = computeStats(TRADES);\n  const winRate = s.n ? s.winRate : 0;\n\n  const wins = TRADES.filter(t => Number(t.pnl) > 0).map(t => Number(t.pnl));\n  const losses = TRADES.filter(t => Number(t.pnl) < 0).map(t => Number(t.pnl));\n  const grossProfit = wins.reduce((a, b) => a + b, 0);\n  const grossLoss = Math.abs(losses.reduce((a, b) => a + b, 0));\n  const profitFactorRaw = grossLoss !== 0 ? grossProfit / grossLoss : (grossProfit > 0 ? 100 : 0);\n  const profitFactor = Math.min(100, profitFactorRaw * 25);\n\n  const byDate = {};\n  TRADES.forEach(t => { if (!t.date) return; byDate[t.date] = (byDate[t.date] || 0) + (Number(t.pnl) || 0); });\n  const days = Object.values(byDate);\n  const positiveDays = days.filter(v => v > 0).length;\n  const consistency = days.length ? (positiveDays / days.length) * 100 : 0;\n\n  // fp = \"Full Plan\" checkbox in the trade form \u2014 interpreted as \"followed full plan\" for adherence.\n  const planAdherence = s.n ? (TRADES.filter(t => t.fp === true).length / s.n) * 100 : 0;\n\n  const sorted = [...TRADES].sort((a, b) => {\n    const d = (a.date || '').localeCompare(b.date || '');\n    if (d !== 0) return d;\n    return _entryMinutes(a) - _entryMinutes(b);\n  });\n  let cum = 0, peak = 0, maxDD = 0;\n  sorted.forEach(t => {\n    cum += Number(t.pnl) || 0;\n    if (cum > peak) peak = cum;\n    const dd = peak - cum;\n    if (dd > maxDD) maxDD = dd;\n  });\n  const recoveryFactor = maxDD === 0 ? 100 : Math.min(100, (s.totalPnl / maxDD) * 20);\n\n  return {\n    winRate: Math.max(0, Math.min(100, winRate)),\n    profitFactor: Math.max(0, profitFactor),\n    consistency: Math.max(0, Math.min(100, consistency)),\n    planAdherence: Math.max(0, Math.min(100, planAdherence)),\n    recoveryFactor: Math.max(0, Math.min(100, recoveryFactor)),\n  };\n}\n\nfunction renderPerformanceRadar() {\n  const m = computeRadarMetrics();\n  const el = document.getElementById('chart-radar');\n  if (!el) return;\n  el.innerHTML = buildSvgRadar(\n    [m.winRate, m.profitFactor, m.consistency, m.planAdherence, m.recoveryFactor],\n    ['Win Rate', 'Profit Factor', 'Consistency', 'Plan Adherence', 'Recovery']\n  );\n}\n\n// =============================================================================\n// Calendar heatmap\n// =============================================================================\nlet calYear = null, calMonth = null;\n\nfunction initCalendarState() {\n  const now = new Date();\n  calYear = now.getFullYear();\n  calMonth = now.getMonth();\n}\n\nfunction calPrevMonth() {\n  if (calYear == null) initCalendarState();\n  calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }\n  renderCalendar();\n}\n\nfunction calNextMonth() {\n  if (calYear == null) initCalendarState();\n  calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }\n  renderCalendar();\n}\n\nfunction renderCalendar() {\n  if (calYear == null) initCalendarState();\n\n  const byDate = {};\n  TRADES.forEach(t => {\n    if (!t.date) return;\n    if (!byDate[t.date]) byDate[t.date] = { count: 0, pnl: 0 };\n    byDate[t.date].count++;\n    byDate[t.date].pnl += Number(t.pnl) || 0;\n  });\n\n  const first = new Date(calYear, calMonth, 1);\n  const startDow = first.getDay();\n  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();\n  const monthName = first.toLocaleString('en-US', { month: 'long' });\n  document.getElementById('cal-title').textContent = `${monthName} ${calYear}`;\n\n  let cells = '';\n  for (let i = 0; i < startDow; i++) cells += '<div class=\"cal-cell empty\"><\/div>';\n  for (let d = 1; d <= daysInMonth; d++) {\n    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;\n    const info = byDate[dateStr];\n    if (info) {\n      const cls = 'cal-cell ' + (info.pnl > 0 ? 'cal-pos' : info.pnl < 0 ? 'cal-neg' : 'cal-flat');\n      cells += `<div class=\"${cls}\" onclick=\"filterByDate('${dateStr}')\">\n        <div class=\"cal-day-num\">${d}<\/div>\n        <div class=\"cal-count\">${info.count}T<\/div>\n        <div class=\"cal-pnl\">${info.pnl >= 0 ? '+$' : '-$'}${Math.abs(Math.round(info.pnl))}<\/div>\n      <\/div>`;\n    } else {\n      cells += `<div class=\"cal-cell\"><div class=\"cal-day-num\">${d}<\/div><\/div>`;\n    }\n  }\n  document.getElementById('cal-grid').innerHTML = cells;\n}\n\nfunction filterByDate(dateStr) {\n  document.getElementById('filter-date').value = dateStr;\n  showPage('trades');\n  renderTable();\n}\n\n// =============================================================================\n// Time Analysis\n// =============================================================================\nfunction _formatHourLabel(h) {\n  const ampm = h >= 12 ? 'pm' : 'am';\n  let hh = h % 12; if (hh === 0) hh = 12;\n  return hh + ampm;\n}\n\nfunction renderTimeAnalysis() {\n  const hourBuckets = {};\n  TRADES.forEach(t => {\n    if (!t.entryTime) return;\n    const hour = Math.floor(_entryMinutes(t) / 60);\n    hourBuckets[hour] = (hourBuckets[hour] || 0) + (Number(t.pnl) || 0);\n  });\n  const hours = Object.keys(hourBuckets).map(Number).sort((a, b) => a - b);\n  const hourLabels = hours.map(_formatHourLabel);\n  const hourData = hours.map(h => hourBuckets[h]);\n  renderBarChart('chart-hour', hourLabels, hourData, 'P&L');\n\n  const dowOrder = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\n  const dowBuckets = {}; dowOrder.forEach(d => dowBuckets[d] = 0);\n  TRADES.forEach(t => { if (t.dow && dowBuckets.hasOwnProperty(t.dow)) dowBuckets[t.dow] += Number(t.pnl) || 0; });\n  renderBarChart('chart-dow', dowOrder, dowOrder.map(d => dowBuckets[d]), 'P&L');\n}\n\n// =============================================================================\n// Risk Analysis\n// =============================================================================\nfunction renderRiskAnalysis() {\n  const wins = TRADES.filter(t => Number(t.pnl) > 0).map(t => Number(t.pnl));\n  const losses = TRADES.filter(t => Number(t.pnl) < 0).map(t => Number(t.pnl));\n  const avgWin = wins.length ? wins.reduce((a, b) => a + b, 0) / wins.length : 0;\n  const avgLoss = losses.length ? losses.reduce((a, b) => a + b, 0) / losses.length : 0;\n  renderBarChart('chart-winloss', ['Avg Win', 'Avg Loss'], [avgWin, avgLoss], 'Avg $');\n\n  const sorted = [...TRADES].sort((a, b) => {\n    const d = (a.date || '').localeCompare(b.date || '');\n    if (d !== 0) return d;\n    return _entryMinutes(a) - _entryMinutes(b);\n  });\n  let cum = 0;\n  const cumLabels = [], cumData = [];\n  sorted.forEach(t => { cum += Number(t.pnl) || 0; cumLabels.push(t.date); cumData.push(Math.round(cum * 100) / 100); });\n  renderLineChart('chart-cumulative', cumLabels, cumData, 'Cumulative P&L');\n\n  const grossProfit = wins.reduce((a, b) => a + b, 0);\n  const grossLoss = Math.abs(losses.reduce((a, b) => a + b, 0));\n  const largestWin = wins.length ? Math.max(...wins) : 0;\n  const largestLoss = losses.length ? Math.min(...losses) : 0;\n  const winLossRatio = avgLoss !== 0 ? Math.abs(avgWin / avgLoss) : 0;\n  const profitFactor = grossLoss !== 0 ? grossProfit / grossLoss : 0;\n\n  document.getElementById('risk-largest-win').textContent = wins.length ? '+' + largestWin.toFixed(2) : '\u2014';\n  document.getElementById('risk-largest-loss').textContent = losses.length ? largestLoss.toFixed(2) : '\u2014';\n  document.getElementById('risk-wl-ratio').textContent = winLossRatio ? winLossRatio.toFixed(2) : '\u2014';\n  document.getElementById('risk-profit-factor').textContent = profitFactor ? profitFactor.toFixed(2) : '\u2014';\n}\n\n// =============================================================================\n// Discipline Analysis\n// =============================================================================\nfunction renderDisciplineAnalysis() {\n  const ptagCounts = {}, ntagCounts = {};\n  TRADES.forEach(t => {\n    (t.ptags || []).forEach(tag => ptagCounts[tag] = (ptagCounts[tag] || 0) + 1);\n    (t.ntags || []).forEach(tag => ntagCounts[tag] = (ntagCounts[tag] || 0) + 1);\n  });\n  renderBarChart('chart-ptags', Object.keys(ptagCounts), Object.values(ptagCounts), 'Count', getCssVar('--green'));\n  renderBarChart('chart-ntags', Object.keys(ntagCounts), Object.values(ntagCounts), 'Count', getCssVar('--red'));\n\n  function winRateFor(pred) {\n    const subset = TRADES.filter(pred);\n    if (!subset.length) return null;\n    const wins = subset.filter(t => Number(t.pnl) > 0).length;\n    return (wins / subset.length) * 100;\n  }\n  const fpTrue = winRateFor(t => t.fp === true);\n  const fpFalse = winRateFor(t => !t.fp);\n  const beTrue = winRateFor(t => t.be === true);\n  const beFalse = winRateFor(t => !t.be);\n  const ratedHigh = winRateFor(t => t.rating != null && Number(t.rating) >= 7);\n  const ratedLow = winRateFor(t => t.rating != null && Number(t.rating) < 7);\n\n  document.getElementById('disc-flags').innerHTML =\n    renderFlagRow('Full Plan', fpTrue, fpFalse != null ? `vs ${fpFalse.toFixed(1)}% non-FP` : 'no non-FP trades yet') +\n    renderFlagRow('Breakeven Set', beTrue, beFalse != null ? `vs ${beFalse.toFixed(1)}% non-BE` : 'no non-BE trades yet') +\n    renderFlagRow('Rating \u2265 7', ratedHigh, ratedLow != null ? `vs ${ratedLow.toFixed(1)}% rating < 7` : 'no rating < 7 trades yet');\n}\n\nfunction renderFlagRow(label, pct, subLabel) {\n  if (pct == null) {\n    return `<div>\n      <div class=\"flag-row-top\"><span style=\"font-size:12px;color:var(--muted)\">${escHtml(label)}<\/span><span style=\"font-size:13px;font-family:var(--font-mono);font-weight:600;color:var(--muted3)\">\u2014<\/span><\/div>\n      <div class=\"thin-progress\"><\/div>\n      <div class=\"flag-row-sub\">No data yet<\/div>\n    <\/div>`;\n  }\n  const clamped = Math.max(0, Math.min(100, pct));\n  return `<div>\n    <div class=\"flag-row-top\"><span style=\"font-size:12px;color:var(--muted)\">${escHtml(label)}<\/span><span style=\"font-size:13px;font-family:var(--font-mono);font-weight:600;color:var(--green)\">${pct.toFixed(1)}%<\/span><\/div>\n    <div class=\"thin-progress\"><div style=\"width:${clamped}%;background:var(--green)\"><\/div><\/div>\n    <div class=\"flag-row-sub\">${escHtml(subLabel)}<\/div>\n  <\/div>`;\n}\n\n// =============================================================================\n// Review page (separate localStorage key, does not touch TRADES)\n// =============================================================================\nconst REVIEW_KEY = 'sinlist_review_notes';\n\nfunction loadReviewNotes() {\n  document.getElementById('review-notes').value = localStorage.getItem(REVIEW_KEY) || '';\n}\n\nfunction saveReviewNotes() {\n  localStorage.setItem(REVIEW_KEY, document.getElementById('review-notes').value);\n}\n\n// =============================================================================\n// Missed Trades (new \u2014 separate localStorage key, completely separate from TRADES)\n// =============================================================================\nconst MISSED_KEY = 'sinlist_missed_trades';\n\nfunction loadMissedTrades() {\n  try { return JSON.parse(localStorage.getItem(MISSED_KEY)) || []; } catch (_) { return []; }\n}\n\nfunction saveMissedTrades(arr) {\n  localStorage.setItem(MISSED_KEY, JSON.stringify(arr));\n}\n\nfunction renderMissedTable() {\n  const items = loadMissedTrades();\n  const tbody = document.getElementById('missed-tbody');\n  if (!items.length) {\n    tbody.innerHTML = '<tr><td colspan=\"5\" class=\"empty-state\">No missed trades logged.<\/td><\/tr>';\n    return;\n  }\n  tbody.innerHTML = items.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(item => `<tr>\n    <td>${escHtml(item.date || '')}<\/td>\n    <td>${escHtml(item.ticker || '')}<\/td>\n    <td>${escHtml(item.reason || '')}<\/td>\n    <td>${escHtml(item.notes || '')}<\/td>\n    <td class=\"actions\"><button class=\"danger\" onclick=\"deleteMissedTrade('${escHtml(item.id)}')\" style=\"padding:4px 8px;font-size:11px\">Del<\/button><\/td>\n  <\/tr>`).join('');\n}\n\nfunction addMissedTrade() {\n  const date = document.getElementById('missed-date').value;\n  const ticker = document.getElementById('missed-ticker').value.toUpperCase().trim();\n  const reason = document.getElementById('missed-reason').value.trim();\n  const notes = document.getElementById('missed-notes').value.trim();\n  if (!date || !ticker) { showToast('Date and ticker required.', 'error'); return; }\n  const items = loadMissedTrades();\n  items.push({ id: genId(), date, ticker, reason, notes });\n  saveMissedTrades(items);\n  document.getElementById('missed-date').value = '';\n  document.getElementById('missed-ticker').value = '';\n  document.getElementById('missed-reason').value = '';\n  document.getElementById('missed-notes').value = '';\n  renderMissedTable();\n  showToast('Missed trade logged.', 'success');\n}\n\nfunction deleteMissedTrade(id) {\n  const items = loadMissedTrades().filter(i => i.id !== id);\n  saveMissedTrades(items);\n  renderMissedTable();\n}\n\n// =============================================================================\n// Milestones page (separate localStorage key, does not touch TRADES)\n// =============================================================================\nconst MILESTONE_KEY = 'sinlist_milestone_goal';\n\nfunction loadMilestone() {\n  const goal = parseFloat(localStorage.getItem(MILESTONE_KEY)) || 0;\n  document.getElementById('milestone-goal').value = goal || '';\n  renderMilestoneProgress(goal);\n}\n\nfunction saveMilestoneGoal() {\n  const goal = parseFloat(document.getElementById('milestone-goal').value) || 0;\n  localStorage.setItem(MILESTONE_KEY, String(goal));\n  renderMilestoneProgress(goal);\n  showToast('Milestone goal saved.', 'success');\n}\n\nfunction renderMilestoneProgress(goal) {\n  const totalPnl = computeStats(TRADES).totalPnl;\n  const bar = document.getElementById('milestone-progress-bar');\n  const label = document.getElementById('milestone-label');\n  if (!goal || goal <= 0) {\n    bar.style.width = '0%';\n    bar.style.background = 'var(--border)';\n    label.textContent = 'Set a profit goal to track progress.';\n    return;\n  }\n  const pct = Math.max(0, Math.min(100, (totalPnl / goal) * 100));\n  bar.style.width = pct + '%';\n  bar.style.background = totalPnl >= 0 ? 'var(--green)' : 'var(--red)';\n  label.textContent = `${fmtPnl(totalPnl)} / ${fmtPnl(goal)}  (${pct.toFixed(1)}%)`;\n}\n\n// =============================================================================\n// Boot\n// =============================================================================\n\n// \u2500\u2500\u2500 sin-journal init (called once from renderJournal) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nasync function initSinList() {\n  try {\n    await openDB();\n    TRADES = await dbGetAll();\n    updateAccFilter();\n    renderTable();\n    syncLatest(true);\n    showPage('analytics');\n  } catch (err) {\n    showToast('DB error: ' + err.message, 'error');\n    const tbody = document.getElementById('trades-tbody');\n    if (tbody) tbody.innerHTML = '<tr><td colspan=\"16\" class=\"empty-state\">Could not open database.<\/td><\/tr>';\n  }\n}\n\n\nlet _sinListInited = false;\nfunction renderJournal() {\n  document.getElementById('page-journal').innerHTML = `<div class=\"sin-journal\" style=\"width:100%;min-height:100%\">\n<nav class=\"tabbar\">\n  <div class=\"tab active\" data-page=\"analytics\" onclick=\"showPage('analytics')\"><span class=\"tab-icon\">\ud83d\udcca<\/span> Analytics<\/div>\n  <div class=\"tab\" data-page=\"review\" onclick=\"showPage('review')\"><span class=\"tab-icon\">\ud83d\udcdd<\/span> Review<\/div>\n  <div class=\"tab\" data-page=\"trades\" onclick=\"showPage('trades')\"><span class=\"tab-icon\">\ud83d\udccb<\/span> Trades DB<\/div>\n  <div class=\"tab\" data-page=\"missed\" onclick=\"showPage('missed')\"><span class=\"tab-icon\">\ud83d\udeab<\/span> Missed Trades<\/div>\n  <div class=\"tab\" data-page=\"milestones\" onclick=\"showPage('milestones')\"><span class=\"tab-icon\">\ud83c\udfaf<\/span> Milestones<\/div>\n<\/nav>\n\n<main class=\"content\">\n\n  <!-- ============================ PAGE: Analytics (default landing) ============================ -->\n  <section id=\"page-analytics\" class=\"page active\">\n    <!-- Row 1: hero stats + goal/actions -->\n    <div class=\"stats-row-4\">\n      <div class=\"stat-card-lg\">\n        <div class=\"label\">Win Rate<\/div>\n        <div class=\"big-value neutral\" id=\"an-stat-winrate\">\u2014<\/div>\n        <div class=\"sub-label\" id=\"an-stat-winrate-sub\">\u2014<\/div>\n      <\/div>\n      <div class=\"stat-card-lg\">\n        <div class=\"label\">Total P&amp;L<\/div>\n        <div class=\"big-value neutral\" id=\"an-stat-pnl\">\u2014<\/div>\n        <div class=\"sub-label\" id=\"an-stat-pnl-sub\">\u2014<\/div>\n      <\/div>\n      <div class=\"stat-card-lg\">\n        <div class=\"label\">Trades Logged<\/div>\n        <div class=\"big-value neutral\" id=\"an-stat-count\">\u2014<\/div>\n        <div class=\"sub-label\" id=\"an-stat-count-sub\">\u2014<\/div>\n      <\/div>\n      <div class=\"stat-card-lg goal-actions-card\">\n        <div id=\"an-goal-wrap\"><p class=\"empty-state\" style=\"padding:8px 0\">Loading\u2026<\/p><\/div>\n        <div class=\"goal-actions-buttons\">\n          <button class=\"primary\" onclick=\"openAddModal()\">+ Add Trade<\/button>\n          <button onclick=\"openChecklistModal()\">Pre-Trade Checklist<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- Row 2: radar + calendar -->\n    <div class=\"chart-grid\" style=\"grid-template-columns:1fr 1.7fr;align-items:start;margin-bottom:12px\">\n      <div class=\"chart-card\">\n        <h3>Performance Radar<\/h3>\n        <div id=\"chart-radar\"><\/div>\n      <\/div>\n      <div class=\"chart-card\">\n        <div class=\"cal-header\">\n          <h3 style=\"margin:0\" id=\"cal-title\">\u2014<\/h3>\n          <div style=\"display:flex;gap:5px\">\n            <button onclick=\"calPrevMonth()\">\u2039<\/button>\n            <button onclick=\"calNextMonth()\">\u203a<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"cal-weekdays\">\n          <div>Sun<\/div><div>Mon<\/div><div>Tue<\/div><div>Wed<\/div><div>Thu<\/div><div>Fri<\/div><div>Sat<\/div>\n        <\/div>\n        <div class=\"cal-grid\" id=\"cal-grid\"><\/div>\n        <div class=\"cal-legend\">\n          <div class=\"cal-legend-item\"><span class=\"cal-swatch cal-swatch-pos\"><\/span>Win day<\/div>\n          <div class=\"cal-legend-item\"><span class=\"cal-swatch cal-swatch-neg\"><\/span>Loss day<\/div>\n          <div class=\"cal-legend-item\"><span class=\"cal-swatch cal-swatch-none\"><\/span>No trades<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- Time Analysis -->\n    <div class=\"section-divider\"><span>Time Analysis<\/span><div class=\"line\"><\/div><\/div>\n    <div class=\"chart-grid\">\n      <div class=\"chart-card\"><h3>P&amp;L by Hour of Entry<\/h3><div id=\"chart-hour\"><\/div><\/div>\n      <div class=\"chart-card\"><h3>P&amp;L by Day of Week<\/h3><div id=\"chart-dow\"><\/div><\/div>\n    <\/div>\n\n    <!-- Risk Analysis -->\n    <div class=\"section-divider\"><span>Risk Analysis<\/span><div class=\"line\"><\/div><\/div>\n    <div class=\"stats-bar\" style=\"margin-bottom:10px\">\n      <div class=\"stat-card\"><div class=\"label\">Largest Win<\/div><div class=\"value pos\" id=\"risk-largest-win\">\u2014<\/div><\/div>\n      <div class=\"stat-card\"><div class=\"label\">Largest Loss<\/div><div class=\"value neg\" id=\"risk-largest-loss\">\u2014<\/div><\/div>\n      <div class=\"stat-card\"><div class=\"label\">Profit Factor<\/div><div class=\"value neutral\" id=\"risk-profit-factor\">\u2014<\/div><\/div>\n      <div class=\"stat-card\"><div class=\"label\">Win / Loss Ratio<\/div><div class=\"value neutral\" id=\"risk-wl-ratio\">\u2014<\/div><\/div>\n    <\/div>\n    <div class=\"chart-grid\">\n      <div class=\"chart-card\"><h3>Avg Win vs Avg Loss<\/h3><div id=\"chart-winloss\"><\/div><\/div>\n      <div class=\"chart-card\"><h3>Cumulative P&amp;L (Account Growth)<\/h3><div id=\"chart-cumulative\"><\/div><\/div>\n    <\/div>\n\n    <!-- Discipline Analysis -->\n    <div class=\"section-divider\"><span>Discipline Analysis<\/span><div class=\"line\"><\/div><\/div>\n    <div class=\"chart-grid\" style=\"grid-template-columns:1fr 1fr 1fr\">\n      <div class=\"chart-card\"><h3>Positive Tags<\/h3><div id=\"chart-ptags\"><\/div><\/div>\n      <div class=\"chart-card\"><h3>Negative Tags<\/h3><div id=\"chart-ntags\"><\/div><\/div>\n      <div class=\"chart-card\">\n        <h3>Win Rate by Flag<\/h3>\n        <div id=\"disc-flags\" class=\"flag-rows\"><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============================ PAGE: Review ============================ -->\n  <section id=\"page-review\" class=\"page\">\n    <div class=\"chart-card\">\n      <h3 style=\"font-size:10px;margin-bottom:16px\">Review Notes<\/h3>\n      <textarea id=\"review-notes\" placeholder=\"Weekly / monthly review. What patterns are you seeing? What needs to change?\" style=\"width:100%;min-height:440px;background:var(--bg);border:1px solid var(--border-btn);color:var(--muted);padding:16px 18px;line-height:1.75\" oninput=\"saveReviewNotes()\"><\/textarea>\n    <\/div>\n  <\/section>\n\n  <!-- ============================ PAGE: Trades DB ============================ -->\n  <section id=\"page-trades\" class=\"page\">\n    <!-- Stats -->\n    <div class=\"mini-stats-strip\" id=\"stats-bar\">\n      <div class=\"mini-stat\"><div class=\"label\">Trades<\/div><div class=\"value neutral\" id=\"stat-total\">\u2014<\/div><\/div>\n      <div class=\"mini-stat\"><div class=\"label\">Win Rate<\/div><div class=\"value\" id=\"stat-wr\">\u2014<\/div><\/div>\n      <div class=\"mini-stat\"><div class=\"label\">Total P&amp;L<\/div><div class=\"value\" id=\"stat-pnl\">\u2014<\/div><\/div>\n      <div class=\"mini-stat\"><div class=\"label\">Avg P&amp;L<\/div><div class=\"value\" id=\"stat-avg\">\u2014<\/div><\/div>\n      <div class=\"mini-stat\"><div class=\"label\">Best<\/div><div class=\"value pos\" id=\"stat-best\">\u2014<\/div><\/div>\n      <div class=\"mini-stat\"><div class=\"label\">Worst<\/div><div class=\"value neg\" id=\"stat-worst\">\u2014<\/div><\/div>\n    <\/div>\n\n    <!-- Filters -->\n    <div class=\"filter-bar\" style=\"margin-bottom:12px\">\n      <input type=\"search\" id=\"filter-search\" placeholder=\"Search ticker / notes\u2026\" oninput=\"renderTable()\">\n      <select id=\"filter-dir\" onchange=\"renderTable()\">\n        <option value=\"\">All dirs<\/option>\n        <option>LONG<\/option>\n        <option>SHORT<\/option>\n      <\/select>\n      <select id=\"filter-win\" onchange=\"renderTable()\">\n        <option value=\"\">All outcomes<\/option>\n        <option value=\"win\">Wins<\/option>\n        <option value=\"loss\">Losses<\/option>\n      <\/select>\n      <select id=\"filter-acc\" onchange=\"renderTable()\"><option value=\"\">All accounts<\/option><\/select>\n      <input type=\"date\" id=\"filter-date\" onchange=\"renderTable()\" title=\"Filter by date (set from Calendar)\">\n      <button onclick=\"clearFilters()\" style=\"padding:7px 10px;font-size:12px\">Clear<\/button>\n    <\/div>\n\n    <!-- Trades Table -->\n    <div class=\"table-wrap\">\n      <table id=\"trades-table\">\n        <thead>\n          <tr>\n            <th style=\"color:var(--muted);width:36px\">#<\/th>\n            <th onclick=\"sortBy('date')\">Date <span class=\"sort-arrow\" id=\"sort-date\">\u2195<\/span><\/th>\n            <th onclick=\"sortBy('pairs')\">Ticker <span class=\"sort-arrow\" id=\"sort-pairs\">\u2195<\/span><\/th>\n            <th onclick=\"sortBy('dir')\">Dir <span class=\"sort-arrow\" id=\"sort-dir\">\u2195<\/span><\/th>\n            <th onclick=\"sortBy('contracts')\">Qty <span class=\"sort-arrow\" id=\"sort-contracts\">\u2195<\/span><\/th>\n            <th onclick=\"sortBy('entry')\">Entry <span class=\"sort-arrow\" id=\"sort-entry\">\u2195<\/span><\/th>\n            <th>Entry Time<\/th>\n            <th onclick=\"sortBy('exit')\">Exit <span class=\"sort-arrow\" id=\"sort-exit\">\u2195<\/span><\/th>\n            <th>Exit Time<\/th>\n            <th onclick=\"sortBy('pnl')\">P&amp;L <span class=\"sort-arrow\" id=\"sort-pnl\">\u2195<\/span><\/th>\n            <th>Acc<\/th>\n            <th onclick=\"sortBy('rating')\">Rating <span class=\"sort-arrow\" id=\"sort-rating\">\u2195<\/span><\/th>\n            <th>Session<\/th>\n            <th>Model<\/th>\n            <th>Tags<\/th>\n            <th>Actions<\/th>\n          <\/tr>\n        <\/thead>\n        <tbody id=\"trades-tbody\">\n          <tr><td colspan=\"16\" class=\"empty-state\">Loading\u2026<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n  <\/section>\n\n  <!-- ============================ PAGE: Missed Trades ============================ -->\n  <section id=\"page-missed\" class=\"page\">\n    <div class=\"chart-card\" style=\"margin-bottom:10px\">\n      <h3 style=\"font-size:10px;margin-bottom:14px\">Log Missed Trade<\/h3>\n      <p style=\"color:var(--muted3);font-size:11px;margin-bottom:14px\">Setups you saw but didn't take. Stored locally, separate from your trade log \u2014 does not affect P&amp;L or any Trades DB stats.<\/p>\n      <div class=\"form-row\" style=\"flex-wrap:wrap;gap:10px\">\n        <input type=\"date\" id=\"missed-date\" style=\"width:140px\">\n        <input type=\"text\" id=\"missed-ticker\" placeholder=\"Ticker\" style=\"width:100px;text-transform:uppercase\">\n        <input type=\"text\" id=\"missed-reason\" placeholder=\"Why didn't you take it? FOMO, hesitation, no setup\u2026\" style=\"flex:1;min-width:200px\">\n        <input type=\"text\" id=\"missed-notes\" placeholder=\"Notes\" style=\"flex:1;min-width:180px\">\n        <button class=\"primary\" onclick=\"addMissedTrade()\">Log Missed Trade<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"table-wrap\">\n      <table>\n        <thead><tr><th>Date<\/th><th>Ticker<\/th><th>Reason<\/th><th>Notes<\/th><th>Actions<\/th><\/tr><\/thead>\n        <tbody id=\"missed-tbody\"><tr><td colspan=\"5\" class=\"empty-state\">No missed trades logged.<\/td><\/tr><\/tbody>\n      <\/table>\n    <\/div>\n  <\/section>\n\n  <!-- ============================ PAGE: Milestones ============================ -->\n  <section id=\"page-milestones\" class=\"page\">\n    <div class=\"chart-card\" style=\"max-width:560px\">\n      <h3 style=\"font-size:10px;margin-bottom:22px\">Monthly Profit Goal<\/h3>\n      <div class=\"form-row\" style=\"margin-bottom:28px\">\n        <span style=\"color:var(--muted2);font-size:12px\">Target ($)<\/span>\n        <input type=\"number\" id=\"milestone-goal\" step=\"0.01\" style=\"width:160px;font-family:var(--font-mono);font-size:15px;font-weight:500\">\n        <button class=\"primary\" onclick=\"saveMilestoneGoal()\">Save Goal<\/button>\n      <\/div>\n      <div class=\"milestone-progress-wrap\">\n        <div class=\"milestone-progress-bar\" id=\"milestone-progress-bar\"><\/div>\n      <\/div>\n      <div id=\"milestone-label\" style=\"margin-top:12px;font-family:var(--font-mono);font-size:12px;color:var(--muted2)\">Set a profit goal to track progress.<\/div>\n    <\/div>\n  <\/section>\n\n<\/main>\n\n<!-- Add/Edit Trade Modal -->\n<div class=\"modal-backdrop\" id=\"trade-modal\" style=\"display:none\" onclick=\"if(event.target===this)closeModal()\">\n  <div class=\"modal\">\n    <div class=\"modal-header\">\n      <h2 id=\"modal-title\">Add Trade<\/h2>\n      <button class=\"modal-close\" onclick=\"closeModal()\">\u00d7<\/button>\n    <\/div>\n    <div class=\"modal-body\">\n      <form id=\"trade-form\" onsubmit=\"submitTrade(event)\">\n        <div class=\"form-grid\">\n          <!-- Objective fields -->\n          <div class=\"form-group\">\n            <label>Date *<\/label>\n            <input type=\"date\" name=\"date\" required>\n          <\/div>\n          <div class=\"form-group\">\n            <label>Ticker *<\/label>\n            <input type=\"text\" name=\"pairs\" placeholder=\"NVDA\" required style=\"text-transform:uppercase\">\n          <\/div>\n          <div class=\"form-group\">\n            <label>Direction *<\/label>\n            <select name=\"dir\" required>\n              <option value=\"LONG\">LONG<\/option>\n              <option value=\"SHORT\">SHORT<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"form-group\">\n            <label>Contracts<\/label>\n            <input type=\"number\" name=\"contracts\" min=\"1\" step=\"1\" placeholder=\"1\">\n          <\/div>\n          <div class=\"form-group\">\n            <label>Entry Price<\/label>\n            <input type=\"number\" name=\"entry\" step=\"0.0001\" placeholder=\"0.00\">\n          <\/div>\n          <div class=\"form-group\">\n            <label>Entry Time<\/label>\n            <input type=\"time\" name=\"entryTime\" placeholder=\"HH:MM\">\n          <\/div>\n          <div class=\"form-group\">\n            <label>Exit Price<\/label>\n            <input type=\"number\" name=\"exit\" step=\"0.0001\" placeholder=\"0.00\">\n          <\/div>\n          <div class=\"form-group\">\n            <label>Exit Time<\/label>\n            <input type=\"time\" name=\"exitTime\" placeholder=\"HH:MM\">\n          <\/div>\n          <div class=\"form-group\">\n            <label>P&amp;L ($)<\/label>\n            <input type=\"number\" name=\"pnl\" step=\"0.01\" placeholder=\"0.00\">\n          <\/div>\n          <div class=\"form-group\">\n            <label>Account<\/label>\n            <input type=\"text\" name=\"acc\" placeholder=\"Questrade \u2014 TFSA\">\n          <\/div>\n\n          <hr class=\"section-sep\">\n          <div class=\"section-label\">Manual / Subjective Fields<\/div>\n\n          <div class=\"form-group\">\n            <label>Session<\/label>\n            <select name=\"session\">\n              <option value=\"\">\u2014<\/option>\n              <option>Premarket<\/option>\n              <option>AM<\/option>\n              <option>Midday<\/option>\n              <option>PM<\/option>\n              <option>AH<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"form-group\">\n            <label>Model<\/label>\n            <input type=\"text\" name=\"model\" placeholder=\"VCP breakout\">\n          <\/div>\n          <div class=\"form-group\">\n            <label>Entry Window / Setup<\/label>\n            <input type=\"text\" name=\"ew\" placeholder=\"10min base\">\n          <\/div>\n          <div class=\"form-group\">\n            <label>Rating (1\u201310)<\/label>\n            <input type=\"number\" name=\"rating\" min=\"1\" max=\"10\" step=\"1\" placeholder=\"\u2014\">\n          <\/div>\n\n          <div style=\"grid-column:1/-1\">\n            <div class=\"checkbox-group\">\n              <label class=\"checkbox-label\"><input type=\"checkbox\" name=\"fp\"> Full Plan<\/label>\n              <label class=\"checkbox-label\"><input type=\"checkbox\" name=\"be\"> Breakeven<\/label>\n            <\/div>\n          <\/div>\n\n          <div class=\"form-group\" style=\"grid-column:1/-1\">\n            <label>Positive Tags (comma-separated)<\/label>\n            <input type=\"text\" name=\"ptags\" placeholder=\"good entry, followed plan\">\n          <\/div>\n          <div class=\"form-group\" style=\"grid-column:1/-1\">\n            <label>Negative Tags (comma-separated)<\/label>\n            <input type=\"text\" name=\"ntags\" placeholder=\"early exit, sized too big\">\n          <\/div>\n          <div class=\"form-group\" style=\"grid-column:1/-1\">\n            <label>Notes<\/label>\n            <textarea name=\"notes\" placeholder=\"What happened, what you'd do differently\u2026\"><\/textarea>\n          <\/div>\n        <\/div>\n        <input type=\"hidden\" name=\"id\" id=\"edit-id\">\n      <\/form>\n    <\/div>\n    <div class=\"modal-footer\">\n      <button onclick=\"closeModal()\">Cancel<\/button>\n      <button class=\"primary\" onclick=\"document.getElementById('trade-form').requestSubmit()\">Save Trade<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- Needs-Review Modal -->\n<div class=\"modal-backdrop\" id=\"review-modal\" style=\"display:none\" onclick=\"if(event.target===this)closeReviewModal()\">\n  <div class=\"modal\" style=\"max-width:700px\">\n    <div class=\"modal-header\">\n      <h2>Needs Review<\/h2>\n      <button class=\"modal-close\" onclick=\"closeReviewModal()\">\u00d7<\/button>\n    <\/div>\n    <div class=\"modal-body\" id=\"review-modal-body\">\n      <p class=\"empty-state\">No items.<\/p>\n    <\/div>\n    <div class=\"modal-footer\">\n      <button onclick=\"closeReviewModal()\">Close<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- Pre-Trade Checklist Modal -->\n<div class=\"modal-backdrop\" id=\"checklist-modal\" style=\"display:none\" onclick=\"if(event.target===this)closeChecklistModal()\">\n  <div class=\"modal\" style=\"max-width:480px\">\n    <div class=\"modal-header\">\n      <h2>Pre-Trade Checklist<\/h2>\n      <button class=\"modal-close\" onclick=\"closeChecklistModal()\">\u00d7<\/button>\n    <\/div>\n    <div class=\"modal-body\">\n      <ul style=\"list-style:none;display:flex;flex-direction:column;gap:12px;font-size:13px\">\n        <li>\u2610 BOS / CHoCH confirmed<\/li>\n        <li>\u2610 FVG identified<\/li>\n        <li>\u2610 Liquidity sweep noted<\/li>\n        <li>\u2610 Stop level set<\/li>\n        <li>\u2610 Profit target set<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"modal-footer\">\n      <button onclick=\"closeChecklistModal()\">Close<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- Toast container -->\n<div id=\"toast-container\"><\/div>\n<\/div>`;\n  if (!_sinListInited) { _sinListInited = true; initSinList(); }\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  FILE INPUT\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\ndocument.getElementById('csv-input').addEventListener('change', e => {\n  const f = e.target.files[0]; if (!f) return;\n  S.fileLoaded = true; S.fileName = f.name;\n  S.file = f;\n  const rd = new FileReader();\n  rd.onload = ev => {\n    S.tickerCount = Math.max(0, ev.target.result.split('\\n').filter(l => l.trim()).length - 1);\n    if (S.page === 'screener') renderScreener();\n  };\n  rd.readAsText(f);\n});\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SWIPE\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nlet _sx, _sy, _stx, _sty, _dragging = false, _lockAxis = null;\n\ndocument.addEventListener('touchstart', e => {\n  _sx = e.touches[0].clientX;\n  _sy = e.touches[0].clientY;\n  const t = new DOMMatrix(getComputedStyle(world).transform);\n  _stx = t.m41; _sty = t.m42;\n  _dragging = true; _lockAxis = null;\n  world.style.transition = 'none';\n}, { passive: false });\n\ndocument.addEventListener('touchmove', e => {\n  if (!_dragging) return;\n  if (S.page === 'home') e.preventDefault();\n  const dx = e.touches[0].clientX - _sx;\n  const dy = e.touches[0].clientY - _sy;\n  const JOURNAL_DEADZONE = 24;\n  if ((S.page === 'home' || S.page === 'analysis') && dx < -JOURNAL_DEADZONE && Math.abs(dx) > Math.abs(dy)) {\n    _dragging = false;\n    window.location.href = '/journal';\n    return;\n  }\n  if (S.page === 'home') {\n    const clampedY = Math.min(0, _sty + dy);\n    world.style.transform = `translate(${_stx + dx}px, ${clampedY}px)`;\n  } else {\n    world.style.transform = `translate(${_stx + dx}px, ${_sty + dy}px)`;\n  }\n}, { passive: false });\n\ndocument.addEventListener('touchend', e => {\n  if (!_dragging) return;\n  _dragging = false;\n  const dx = e.changedTouches[0].clientX - _sx;\n  const dy = e.changedTouches[0].clientY - _sy;\n  const THRESHOLD = 80;\n  if (Math.abs(dy) >= Math.abs(dx)) {\n    if (S.page === 'home') {\n      if (dy < -THRESHOLD) { nav('analysis'); return; }\n      if (dy > THRESHOLD)  { goNews(); return; }\n    } else if (S.page === 'news') {\n      const newsPage = document.getElementById('page-news');\n      const nScroll = newsPage ? newsPage.scrollTop : 0;\n      if (dy < -THRESHOLD && nScroll <= 10) { nav('home'); return; }\n    } else if (S.page === 'analysis') {\n      const analysisPage = document.getElementById('page-analysis');\n      const scrollTop = analysisPage ? analysisPage.scrollTop : 0;\n      if (dy > THRESHOLD && scrollTop <= 10) { nav('home'); return; }\n    }\n    nav(S.page); return;\n  }\n  if (dx < -THRESHOLD && (S.page === 'home' || S.page === 'analysis'))     nav('journal');\n  else if (dx > THRESHOLD && (S.page === 'home' || S.page === 'analysis')) nav('screener');\n  else if (dx > THRESHOLD && S.page === 'journal') nav('home');\n  else if (dx < -THRESHOLD && S.page === 'screener')  nav('home');\n  else nav(S.page);\n});\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  KEYBOARD\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\ndocument.addEventListener('keydown', e => {\n  if (document.activeElement.tagName === 'INPUT') return;\n  if (e.key === 'ArrowRight' && (S.page === 'home' || S.page === 'analysis'))     nav('journal');\n  if (e.key === 'ArrowLeft'  && (S.page === 'home' || S.page === 'analysis'))     nav('screener');\n  if (e.key === 'ArrowUp'    && S.page === 'home')     nav('analysis');\n  if (e.key === 'ArrowDown'  && S.page === 'analysis') nav('home');\n  if (e.key === 'ArrowRight' && S.page === 'screener') nav('home');\n  if (e.key === 'ArrowLeft'  && S.page === 'journal')  nav('home');\n  if (e.key === 'ArrowDown'  && S.page === 'home')     goNews();\n  if (e.key === 'ArrowUp'    && S.page === 'news')     nav('home');\n});\n\n// Both listeners below are ADDITIVE. nav() and the keydown handler above are\n// deliberately untouched.\n//\n// renderAnalysisIdle() focuses the box when it renders, but arriving at the\n// analysis page does not re-render anything \u2014 nav() only translates #world.\n// So the one path that actually matters (home \u2192 ArrowUp \u2192 type) never received\n// focus, and typing went nowhere. Watching the grid's slide finish covers it\n// without reaching into nav().\nfunction _focusIdleSearch() {\n  // Only when the page is genuinely idle: not mid-load, not already showing\n  // data. Stealing focus on a loaded screen would disable arrow-key nav there.\n  if (S.page !== 'analysis' || S.analysis) return;\n  const input = document.getElementById('ticker-input');\n  if (!input || document.activeElement === input) return;\n  input.focus({ preventScroll: true });\n  input.select();\n}\n\nworld.addEventListener('transitionend', e => {\n  // #world's own transform only \u2014 ignore bubbled transitions from children.\n  if (e.target !== world || e.propertyName !== 'transform') return;\n  _focusIdleSearch();\n});\n\n// Escape hatch. A focused input makes the keydown handler above bail\n// ('if (document.activeElement.tagName === 'INPUT') return;'), so arrow-key\n// page navigation is unavailable while the box has focus. Escape gives it back.\n// Nothing else in this page binds Escape \u2014 verified before adding this.\ndocument.addEventListener('keydown', e => {\n  if (e.key !== 'Escape') return;\n  const input = document.getElementById('ticker-input');\n  if (input && document.activeElement === input) input.blur();\n});\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  BOOT\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nrender();\nnav('home', false);\n// No analysis load on boot. loadAnalysis() fans out to six endpoints, one of\n// which (/api/financials) holds the engine adapter's global lock for 15-40s,\n// so booting into a full NVDA analysis nobody asked for put the user's first\n// real search behind work they never requested. Loads now start from a search\n// or a screener card click.\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  NEWS SCANNER \u2014 Stage 1 (headlines only)\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Entirely additive. Reads /api/news-scanner/*, which shares no route prefix,\n// no cache and no code with /api/news (the ticker-scoped analysis-page feed).\n// No catalyst tagging and no article text at this stage \u2014 Stages 2 and 3.\nconst NS_API = '/api/news-scanner';\nconst NS = { mode: 'market', q: '', items: [], status: null, watchlist: [], loading: false };\n\nfunction nsEsc(s) {\n  return String(s == null ? '' : s)\n    .replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;')\n    .replace(/\"/g, '&quot;').replace(/'/g, '&#39;');\n}\n\nfunction nsAgo(ts) {\n  if (!ts) return '';\n  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));\n  if (s < 60) return s + 's ago';\n  if (s < 3600) return Math.floor(s / 60) + 'm ago';\n  if (s < 86400) return Math.floor(s / 3600) + 'h ago';\n  return Math.floor(s / 86400) + 'd ago';\n}\n\nfunction renderNewsShell() {\n  const el = document.getElementById('page-news');\n  if (!el || el.dataset.built) return;\n  el.dataset.built = '1';\n  el.innerHTML = `\n    <div class=\"ns-wrap\">\n      <div class=\"ns-head\">\n        <div class=\"ns-title\">News Scanner<\/div>\n        <div class=\"ns-sub\" id=\"ns-session\"><\/div>\n      <\/div>\n      <div class=\"ns-health\" id=\"ns-health\"><\/div>\n      <div class=\"ns-controls\">\n        <div class=\"ns-toggle\">\n          <button id=\"ns-mode-market\" class=\"on\">Whole market<\/button>\n          <button id=\"ns-mode-watch\">Watchlist<\/button>\n        <\/div>\n        <input class=\"ns-input\" id=\"ns-search\" placeholder=\"Search today's headlines\" style=\"flex:1;min-width:200px\">\n        <input class=\"ns-input\" id=\"ns-add\" placeholder=\"Add ticker\" style=\"width:120px\">\n        <button class=\"ns-btn\" id=\"ns-add-btn\">Add<\/button>\n        <button class=\"ns-btn\" id=\"ns-refresh\">Refresh<\/button>\n      <\/div>\n      <div class=\"ns-chips\" id=\"ns-chips\"><\/div>\n      <div id=\"ns-list\"><\/div>\n    <\/div>`;\n\n  el.querySelector('#ns-mode-market').onclick = () => { NS.mode = 'market'; nsSyncMode(); loadNewsFeed(); };\n  el.querySelector('#ns-mode-watch').onclick  = () => { NS.mode = 'watchlist'; nsSyncMode(); loadNewsFeed(); };\n  el.querySelector('#ns-refresh').onclick     = () => loadNewsFeed();\n  el.querySelector('#ns-add-btn').onclick     = () => nsAddTicker();\n  el.querySelector('#ns-add').addEventListener('keydown', e => { if (e.key === 'Enter') nsAddTicker(); });\n  let t = null;\n  el.querySelector('#ns-search').addEventListener('input', e => {\n    NS.q = e.target.value.trim();\n    clearTimeout(t);\n    t = setTimeout(loadNewsFeed, 250);\n  });\n}\n\nfunction nsSyncMode() {\n  const m = document.getElementById('ns-mode-market');\n  const w = document.getElementById('ns-mode-watch');\n  if (!m || !w) return;\n  m.classList.toggle('on', NS.mode === 'market');\n  w.classList.toggle('on', NS.mode === 'watchlist');\n}\n\nasync function nsAddTicker() {\n  const input = document.getElementById('ns-add');\n  if (!input) return;\n  const t = (input.value || '').trim().toUpperCase();\n  if (!t) return;\n  input.value = '';\n  try {\n    const r = await fetch(`${NS_API}/watchlist/${encodeURIComponent(t)}`, { method: 'POST' });\n    const d = await r.json();\n    if (d.tickers) { NS.watchlist = d.tickers; nsRenderChips(); }\n  } catch (err) { console.warn('[news-scanner] add failed', err); }\n}\n\nasync function nsRemoveTicker(t) {\n  try {\n    const r = await fetch(`${NS_API}/watchlist/${encodeURIComponent(t)}`, { method: 'DELETE' });\n    const d = await r.json();\n    if (d.tickers) { NS.watchlist = d.tickers; nsRenderChips(); if (NS.mode === 'watchlist') loadNewsFeed(); }\n  } catch (err) { console.warn('[news-scanner] remove failed', err); }\n}\n\nfunction nsRenderChips() {\n  const el = document.getElementById('ns-chips');\n  if (!el) return;\n  el.innerHTML = NS.watchlist.length\n    ? NS.watchlist.map(t => `<div class=\"ns-chip\">${nsEsc(t)}<span data-t=\"${nsEsc(t)}\">x<\/span><\/div>`).join('')\n    : '<div class=\"ns-sub\">Watchlist empty<\/div>';\n  el.querySelectorAll('.ns-chip span').forEach(s => { s.onclick = () => nsRemoveTicker(s.dataset.t); });\n}\n\nfunction nsRenderHealth() {\n  const el = document.getElementById('ns-health');\n  const se = document.getElementById('ns-session');\n  if (!el || !NS.status) return;\n  const s = NS.status;\n  if (se) se.textContent = `session ${s.session_date} \u00b7 ${s.items_today == null ? '?' : s.items_today} items`;\n  const bits = Object.keys(s.sources || {}).map(k => {\n    const v = s.sources[k];\n    const bad = !!v.last_error;\n    return `<span class=\"${bad ? 'ns-bad' : 'ns-ok'}\">${nsEsc(k)}: ${bad ? 'error' : 'ok'}<\/span>`;\n  });\n  bits.push(`<span>${s.in_market_window ? 'polling' : 'idle (outside market hours)'}<\/span>`);\n  el.innerHTML = bits.join('');\n}\n\nfunction nsRenderList() {\n  const el = document.getElementById('ns-list');\n  if (!el) return;\n  if (!NS.items.length) {\n    el.innerHTML = `<div class=\"ns-empty\">${NS.loading ? 'Loading...' : 'No headlines for this view yet.'}<\/div>`;\n    return;\n  }\n  el.innerHTML = NS.items.map(i => `\n    <div class=\"ns-item\">\n      <div class=\"ns-item-top\">\n        <span class=\"ns-src\">${nsEsc(i.source)}<\/span>\n        ${i.ticker ? `<span class=\"ns-tkr\">${nsEsc(i.ticker)}<\/span>` : ''}\n        <span class=\"ns-time\">${nsEsc(nsAgo(i.published || i.first_seen))}<\/span>\n      <\/div>\n      ${i.url\n        ? `<a class=\"ns-headline\" href=\"${nsEsc(i.url)}\" target=\"_blank\" rel=\"noopener noreferrer\">${nsEsc(i.headline)}<\/a>`\n        : `<div class=\"ns-headline\">${nsEsc(i.headline)}<\/div>`}\n    <\/div>`).join('');\n}\n\nasync function loadNewsFeed() {\n  NS.loading = true;\n  try {\n    const qs = `mode=${encodeURIComponent(NS.mode)}&limit=100` + (NS.q ? `&q=${encodeURIComponent(NS.q)}` : '');\n    const [feedRes, statusRes, wlRes] = await Promise.all([\n      fetch(`${NS_API}/feed?${qs}`),\n      fetch(`${NS_API}/status`),\n      fetch(`${NS_API}/watchlist`),\n    ]);\n    const feed = await feedRes.json();\n    NS.items = feed.items || [];\n    NS.status = await statusRes.json();\n    NS.watchlist = (await wlRes.json()).tickers || [];\n  } catch (err) {\n    // Same principle as the backend: a failure here must be visible, not\n    // silently swallowed into an empty page.\n    console.warn('[news-scanner] load failed', err);\n  }\n  NS.loading = false;\n  nsRenderHealth();\n  nsRenderChips();\n  nsRenderList();\n}\n\nfunction goNews() {\n  nav('news');\n  renderNewsShell();\n  nsSyncMode();\n  loadNewsFeed();\n}\n\n// Refresh while the tab is open. Checks S.page rather than being wired into\n// nav(), so nav() itself stays untouched.\nsetInterval(() => { if (S.page === 'news') loadNewsFeed(); }, 30000);\n\nrenderNewsShell();\n<\/script>\n\n\n<\/body><\/html>"</script>
