document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

; width: 300vw; height: 300vh; top: 0; left: -100vw; will-change: transform; }\n    #page-home     { position: absolute; left: 100vw; top: 0; width: 100vw; height: 100vh; overflow-y: auto; }\n    #page-analysis { position: absolute; left: 100vw; top: 100vh; width: 100vw; height: 100vh; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }\n    #page-screener { position: absolute; left: 0;     top: 0; width: 100vw; height: 100vh; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }\n    #page-journal  { position: absolute; left: 200vw; top: 0; width: 100vw; height: 100vh; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }\n    /* News Scanner. Sits ABOVE home \u2014 the one cardinal direction from home with\n       nothing bound to it. Outside #world's declared box on purpose; nothing\n       clips it, since #viewport is what clips and it clips to the screen. */\n    #page-news     { position: absolute; left: 100vw; top: -100vh; width: 100vw; height: 100vh; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; background: #000000; }\n    .ns-wrap       { max-width: 980px; margin: 0 auto; padding: 40px 24px 80px; }\n    .ns-head       { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }\n    .ns-title      { font-family: 'DM Serif Display', serif; font-size: 34px; color: #FAFAFA; letter-spacing: 0.3px; }\n    .ns-sub        { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #52525B; letter-spacing: 0.6px; text-transform: uppercase; }\n    .ns-controls   { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 22px 0 18px; }\n    .ns-toggle     { display: inline-flex; border: 1px solid #2A2A2E; border-radius: 6px; overflow: hidden; }\n    .ns-toggle button { background: transparent; border: 0; color: #52525B; font-family: 'Inter', sans-serif; font-size: 12px; letter-spacing: 0.4px; padding: 8px 14px; cursor: pointer; }\n    .ns-toggle button.on { background: #141416; color: #D4A843; }\n    .ns-input      { background: #141416; border: 1px solid #2A2A2E; border-radius: 6px; color: #FAFAFA; font-family: 'Inter', sans-serif; font-size: 13px; padding: 8px 12px; outline: none; }\n    .ns-input:focus { border-color: #D4A843; }\n    .ns-btn        { background: #141416; border: 1px solid #2A2A2E; border-radius: 6px; color: #FAFAFA; font-family: 'Inter', sans-serif; font-size: 12px; padding: 8px 12px; cursor: pointer; }\n    .ns-btn:hover  { border-color: #D4A843; color: #D4A843; }\n    .ns-chips      { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }\n    .ns-chip       { display: inline-flex; align-items: center; gap: 6px; background: #141416; border: 1px solid #2A2A2E; border-radius: 999px; padding: 4px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #FAFAFA; }\n    .ns-chip span  { color: #52525B; cursor: pointer; }\n    .ns-chip span:hover { color: #F87171; }\n    .ns-item       { background: #141416; border: 1px solid #2A2A2E; border-radius: 8px; padding: 14px 16px; margin-bottom: 8px; }\n    .ns-item-top   { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }\n    .ns-src        { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #52525B; letter-spacing: 0.6px; text-transform: uppercase; }\n    .ns-tkr        { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #D4A843; }\n    .ns-time       { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #52525B; margin-left: auto; }\n    .ns-headline   { font-family: 'Inter', sans-serif; font-size: 14px; color: #FAFAFA; line-height: 1.45; text-decoration: none; display: block; }\n    .ns-headline:hover { color: #D4A843; }\n    .ns-empty      { color: #52525B; font-family: 'Inter', sans-serif; font-size: 13px; padding: 40px 0; text-align: center; }\n    .ns-health     { display: flex; gap: 14px; flex-wrap: wra nt-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--gold); }\n    .run-btn {\n      width: 100%; height: 44px; border: none; border-radius: 8px;\n      background: linear-gradient(135deg, #D4A843, #E8C060);\n      color: #0E0E10; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;\n      letter-spacing: .04em; cursor: pointer;\n      display: flex; align-items: center; justify-content: center; gap: 8px;\n      transition: opacity .15s; margin-bottom: 18px;\n    }\n    .run-btn:hover    { opacity: .88; }\n    .run-btn:disabled { opacity: .32; cursor: not-allowed; }\n    .prog-wrap { height: 3px; background: var(--bs); border-radius: 2px; overflow: hidden; margin-bottom: 18px; }\n    .prog-bar  { height: 100%; background: var(--gold); border-radius: 2px; width: 0; }\n    .prog-bar.go { animation: scanP 1.9s ease-out forwards; }\n    @keyframes scanP { 0%{width:0} 40%{width:58%} 80%{width:88%} 100%{width:100%} }\n    .sum-pills { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }\n    .s-pill { background: var(--surf); border: 1px solid var(--brd); border-radius: 8px; padding: 8px 14px; }\n    .s-lbl  { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--fg2); margin-bottom: 2px; }\n    .s-val  { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; }\n    .s-val.g { color: var(--pos); } .s-val.m { color: var(--fg2); }\n    .sort-bar  { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }\n    .sort-lbl  { font-size: 12px; color: var(--fg2); }\n    .sort-btns { display: flex; gap: 4px; }\n    .sort-btn  { font-size: 11px; font-family: 'IBM Plex Mono', monospace; background: none; border: 1px solid var(--bs); color: var(--fg2); border-radius: 4px; padding: 4px 10px; cursor: pointer; transition: all .15s; }\n    .sort-btn:hover { color: var(--fg1); border-color: var(--brd); }\n    .sort-btn.on { color: var(--go x Mono', monospace; font-size: 11px; color: var(--fg2); }\n\n    /* \u2500\u2500 JOURNAL \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n    .pg-journal {\n      min-height: 100%; width: 100vw; background: #000000;\n      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;\n    }\n    .gold-rule { width: 40px; height: 1.5px; background: var(--gold); opacity: .7; }\n\n    /* \u2550\u2550\u2550 sin-journal styles \u2550\u2550\u2550 */\n\n  .sin-journal {\n    --bg: #000000;\n    --bg2: #141416;\n    --border-card: #2A2A2E;\n    --border-btn: #2A2A2E;\n    --border-line: #1A1A1E;\n    --text: #FAFAFA;\n    --muted: #A1A1AA;\n    --muted2: #52525B;\n    --muted3: #3F3F46;\n    --green: #34D399;\n    --red: #F87171;\n    --yellow: #d29922;\n    --blue: #D4A843;\n    --accent: #D4A843;\n    --radius: 6px;\n    --radius-card: 8px;\n    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;\n    --font-serif: 'DM Serif Display', serif;\n    --font-mono: 'IBM Plex Mono', 'Courier New', Courier, monospace;\n    /* legacy aliases kept so unedited rules below still resolve */\n    --bg3: var(--bg2);\n    --border: var(--border-btn);\n  }\n\n  /* Layout */\n\n  /* Top tab bar */\n  .tabbar { background: var(--bg); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; gap: 8px; flex-wrap: wrap; }\n  .tab { background: var(--bg3); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; font-size: 13px; color: var(--muted2); display: flex; align-items: center; gap: 7px; cursor: pointer; transition: all 0.15s; }\n  .tab:hover { color: var(--text); border-color: var(--text); }\n  .tab.active { background: rgba(212,168,67,0.15); border-color: #D4A843; color: #D4A843; }\n  .tab-icon { font-size: 14px; line-height: 1; }\n\n  main.content { padding: 20px; max-width: 1600px; margin: 0 auto; }\n  .sin-journal .page { display: none; }\n  .sin-journal .page.active { display: block; }\n  .page-title { font-size: 19px; font-weight: 700; margin-bottom: 18px; }\n  .section-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 12px; }\n  .section-divider span { font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted3); white-space: nowrap; }\n  .section-divider .line { flex: 1; height: 1px; background: var(--border-line); }\n\n  /* Stats bar */\n  .stats-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }\n  .stat-card { background: var(--bg2); border: 1px solid var(--border-card); border-radius: var(--radius-card); padding: 16px 20px; min-width: 140px; }\n  .stat-card .label { color: var(--muted2); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }\n  .stat-card .value { font-family: var(--font-mono); font-size: 26px; font-weight: 600; }\n\n  /* Analytics hero row */\n  .stats-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 2fr; gap: 10px; margin-bottom: 12px; }\n  .stat-card-lg { background: var(--bg2); border: 1px solid var(--border-card); border-radius: var(--radius-card); padding: 22px 24px; }\n  .stat-card-lg .label { color: var(--muted2); font-size: 10px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; margin-bottom: 16px; }\n  .big-value { font-family: var(--font-mono); font-size: 46px; font-weight: 600; line-height: 1; letter-spacing: -2.5px; margin-bottom: 10px; }\n  .sub-label { font-size: 11px; font-family: var(--font-mono); color: var(--muted2); }\n  .goal-actions-card { display: flex; flex-direction: column; }\n  .goal-actions-buttons { display: flex; gap: 8px; margin-top: auto; padding-top: 20px; }\n  .goal-actions-buttons button { flex: 1; padding: 10px 0; font-size: 12px; }\n\n  /* Trades DB mini stat strip */\n  .mini-stats-strip { display: flex; flex-wrap: wrap; margin-bottom: 10px; background: var(--bg2); border: 1px solid var(--border-card); border-radius: var(--radius-card); overflow: hidden; }\n  .mini-stat { padding: 12px 20px; border-right: 1px solid var(--border-line); }\n  .mini-stat:last-child { border-right: none; }\n  .mini-stat .label { font-size: 9px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted3); margin-bottom: 5px; }\n  .mini-stat .value { font-family: var(--font-mono); font-size: 16px; font-weight: 600; }\n\n  /* Discipline win-rate-by-flag rows */\n  .flag-rows { display: flex; flex-direction: column; gap: 18px; }\n  .flag-row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }\n  .flag-row-sub { font-size: 10px; color: var(--muted3); font-family: var(--font-mono); margin-top: 5px; }\n\n  /* Direction badge */\n  .dir-badge { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; font-family: var(--font-mono); }\n  .dir-badge.long { background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.28); color: var(--green); }\n  .dir-badge.short { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.28); color: var(--red); }\n  .pos { color: var(--green); }\n  .neg { color: var(--red); }\n  .neutral { color: var(--text); }\n\n  /* Controls */\n  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }\n  .sin-journal button { background: transparent; color: var(--muted2); border: 1px solid var(--border-btn); border-radius: var(--radius); padding: 7px 14px; font-size: 12px; font-family: inherit; cursor: pointer; transition: all 0.15s; white-space: nowrap; }\n  .sin-journal button:hover { color: var(--text); border-color: var(--muted2); }\n  .sin-journal button.primary { background: #D4A843; border-color: #D4A843; color: #000000; font-weight: 700; }\n  .sin-journal button.primary:hover { background: #c49a35; border-color: #c49a35; color: #000000; }\n  .sin-journal button.danger { background: transparent; border-color: rgba(248,113,113,0.25); color: rgba(248,113,113,0.75); }\n  .sin-journal button.danger:hover { background: var(--red); border-color: var(--red); color: #000000; }\n  .sin-journal input, .sin-journal select, .sin-journal textarea { background: var(--bg2); color: var(--text); border: 1px solid var(--border-btn); border-radius: var(--radius); padding: 7px 10px; font-size: 13px; font-family: inherit; outline: none; }\n  .sin-journal input:focus, .sin-journal select:focus, .sin-journal textarea:focus { border-color: var(--accent); }\n  .sin-journal select option { background: var(--bg3); }\n\n  /* Table */\n  .table-wrap { overflow-x: auto; border-radius: var(--radius-card); border: 1px solid var(--border-card); }\n  .sin-journal table { width: 100%; border-collapse: collapse; font-size: 13px; }\n  .sin-journal th { background: var(--bg); color: var(--muted2); font-weight: 700; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border-card); position: sticky; top: 0; cursor: pointer; user-select: none; white-space: nowrap; }\n  .sin-journal th:hover { color: var(--text); }\n  .sin-journal th .sort-arrow { margin-left: 4px; opacity: 0.4; }\n  .sin-journal th.sorted .sort-arrow { opacity: 1; color: var(--green); }\n  .sin-journal td { padding: 9px 10px; border-bottom: 1px solid var(--border-line); vertical-align: middle; font-family: var(--font-mono); white-space: nowrap; }\n  .sin-journal tr:last-child td { border-bottom: none; }\n  .sin-journal tr:hover td { background: rgba(255,255,255,0.025); }\n  .sin-journal td.win { color: var(--green); }\n  .sin-journal td.loss { color: var(--red); }\n  .sin-journal td.actions { display: flex; gap: 6px; font-family: inherit; }\n  .tag { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 11px; font-family: inherit; margin: 1px; }\n  .ptag { background: rgba(52,211,153,0.15); color: var(--green); }\n  .ntag { background: rgba(248,113,113,0.15); color: var(--red); }\n  .fills-badge { display: inline-block; margin-left: 5px; padding: 1px 5px; border-radius: 3px; font-size: 10px; background: rgba(255,215,0,0.15); color: var(--yellow); cursor: default; vertical-align: middle; }\n  .empty-state { text-align: center; color: var(--muted); padding: 48px 20px; }\n\n  /* Modal */\n  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }\n  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; }\n  .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }\n  .modal-header h2 { font-size: 16px; }\n  .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; }\n  .modal-close:hover { color: var(--text); background: none; }\n  .modal-body { padding: 20px; flex: 1; }\n  .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }\n\n  /* Form grid */\n  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }\n  .form-group { display: flex; flex-direction: column; gap: 5px; }\n  .form-group label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }\n  .form-group input, .form-group select, .form-group textarea { width: 100%; }\n  .form-group textarea { resize: vertical; min-height: 80px; }\n  .form-row { display: flex; gap: 10px; align-items: center; }\n  .checkbox-group { display: flex; gap: 16px; align-items: center; }\n  .checkbox-label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }\n  .checkbox-label input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--accent); }\n  .section-sep { grid-column: 1 / -1; border: none; border-top: 1px solid var(--border); margin: 4px 0; }\n  .section-label { grid-column: 1 / -1; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }\n  .manual-note { grid-column: 1 / -1; background: rgba(46,160,67,0.08); border: 1px solid rgba(46,160,67,0.2); border-radius: 4px; padding: 8px 12px; color: var(--muted); font-size: 12px; }\n\n  /* Toast */\n  #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 999; pointer-events: none; }\n  .toast { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; font-size: 13px; max-width: 340px; opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: all; }\n  .toast.show { opacity: 1; transform: none; }\n  .toast.success { border-color: var(--green); }\n  .toast.error { border-color: var(--red); }\n  .toast.info { border-color: var(--blue); }\n\n  /* Needs-review list */\n  .review-item { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; }\n  .review-item .ticker { font-weight: 700; font-family: var(--font-mono); }\n  .review-item .reason { color: var(--yellow); font-size: 12px; margin-top: 4px; }\n  .review-item .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }\n\n  /* Filter bar */\n  .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }\n  .filter-bar input[type=search] { min-width: 180px; }\n\n  /* Drag-drop zone */\n  .drop-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 20px; text-align: center; color: var(--muted); transition: border-color 0.2s; margin-bottom: 12px; }\n  .drop-zone.drag-over { border-color: var(--accent); color: var(--text); }\n\n  /* Charts */\n  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; }\n  .chart-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }\n  .chart-card h3 { font-size: 12px; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }\n\n  /* Calendar */\n  .cal-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 14px; }\n  .cal-title-text { font-size: 16px; font-weight: 700; min-width: 170px; text-align: center; }\n  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; text-align: center; }\n  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }\n  .cal-cell { min-height: 78px; border: 1px solid var(--border); border-radius: var(--radius); padding: 6px; background: var(--bg2); font-size: 11px; }\n  .cal-cell.empty { background: transparent; border: none; }\n  .cal-cell.cal-pos, .cal-cell.cal-neg, .cal-cell.cal-flat { cursor: pointer; }\n  .cal-cell.cal-pos { background: rgba(52,211,153,0.12); border-color: rgba(52,211,153,0.3); }\n  .cal-cell.cal-neg { background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.3); }\n  .cal-cell.cal-pos:hover, .cal-cell.cal-neg:hover, .cal-cell.cal-flat:hover { outline: 1px solid var(--green); }\n  .cal-day-num { color: var(--muted); font-weight: 600; margin-bottom: 4px; }\n  .cal-count { color: var(--muted); }\n  .cal-pnl { font-family: var(--font-mono); font-weight: 700; margin-top: 2px; }\n  .cal-cell.cal-pos .cal-pnl { color: var(--green); }\n  .cal-cell.cal-neg .cal-pnl { color: var(--red); }\n  .sin-journal .cal-header button { background: transparent; border: 1px solid var(--border-btn); color: var(--muted2); width: 26px; height: 26px; padding: 0; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1; }\n  .cal-legend { display: flex; gap: 14px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-line); }\n  .cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted2); }\n  .cal-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }\n  .cal-swatch-pos { background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.4); }\n  .cal-swatch-neg { background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.4); }\n  .cal-swatch-none { background: var(--border-line); border: 1px solid var(--border-btn); }\n\n  /* Goal / milestone progress */\n  .milestone-progress-wrap { width: 100%; height: 7px; background: var(--border-btn); border-radius: 5px; overflow: hidden; }\n  .milestone-progress-bar { height: 100%; width: 0%; background: var(--green); transition: width 0.3s; }\n  .thin-progress { background: var(--border-btn); border-radius: 3px; height: 4px; overflow: hidden; }\n  .thin-progress > div { height: 100%; border-radius: 3px; }\n\n    /* \u2550\u2550\u2550 end sin-journal \u2550\u2550\u2550 */\n\n\n    /* \u2500\u2500 SCROLLBARS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n    ::-webkit-scrollbar { width: 4px; height: 4px; }\n    ::-webkit-scrollbar-track { background: transparent; }\n    ::-webkit-scrollbar-thumb { background: var(--brd); border-radius: 2px; }\n  \n    /* seamless background */\n    body, #viewport, #world { background: #000000; }\n    #page-home { position: relative; background: #000000; }\n    #page-home::after {\n      content: ''; position: absolute;\n      bottom: 0; left: 0; right: 0; height: 160px;\n      background: linear-gradient(to bottom, transparent 0%, rgba(212,168,67,0.025) 100%);\n      pointer-events: none; z-index: 1;\n    }\n    #page-analysis {\n      background: linear-gradient(to bottom, rgba(212,168,67,0.025) 0%, transparent 160px) no-repeat top, #000000;\n    }\n    #page-screener, #page-journal { background: #000000; }\n  <\/style>\n<\/head>\n<body>\n  <div id=\"viewport\">\n    <div id=\"world\">\n      <div id=\"page-home\"><\/div>\n      <div id=\"page-news\"><\/div>\n      <div id=\"page-analysis\"><\/div>\n      <div id=\"page-screener\"><\/div>\n      <div id=\"page-journal\"><\/div>\n    <\/div>\n  <\/div>\n  <div id=\"cover\"><\/div>\n  <input type=\"file\" id=\"csv-input\" accept=\".csv\" style=\"display:none\">\n\n<script>\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  STATE\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nconst S = {\n  page: 'home', ticker: '', tf: '1Y',\n  fileLoaded: false, fileName: '', tickerCount: 0, file: null,\n  scanRan: false, scanning: false, sortBy: 'revenue', busy: false,\n  scanMeta: { total: 0, passed: 0, insufficient: 0 },\n  analysis: null\n};\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  MOCK DATA\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// PENDING is what a slow-arriving field shows until its real value lands. It is\n// deliberately a visible marker and NOT a plausible number.\n//\n// This object used to be seeded with real-looking NVIDIA figures - name\n// 'NVIDIA Corporation', mktCap '$3.2T', pe '52.4x', c33Text 'CODE 33 GREEN',\n// and full revYoYA/eps/qs arrays - and _applyToD() only overwrote a field when\n// the API returned a non-null value for it. That was survivable while the page\n// painted once, after every endpoint had answered. With staged rendering it\n// would put NVIDIA's financials and a GREEN Code 33 badge under whatever ticker\n// the user actually searched, for the seconds before the pipeline answers.\n// A wrong number that looks real is worse than no number, so there are none.\nconst PENDING = '\u2026';\nconst D = {\n  name: PENDING, exchange: 'NASDAQ \u00b7 Technology',\n  price: 0, change: 0, changePct: 0, code33: false,\n  mktCap: PENDING, pe: PENDING, epsYoY: PENDING, revYoY: PENDING,\n  netMargin: PENDING, avgVol: PENDING,\n  week52High: PENDING, week52Low: PENDING,\n  c33Text: 'LOADING\u2026', c33Color: '#52525B',\n  owners: [],\n  news: [],\n  qs: [], rev: [], revYoYA: [], ni: [], eps: [], epsYoYA: [],\n  netMarginArr: [], netMarginYoYA: [],\n  val: {}\n};\n\nconst SC = [\n  { t:'AIP',  n:'Aptiv PLC',              sec:'Technology',  st:'green', cap:'$4.2B',  rq:['+38%','+52%','+71%'],   mq:['+8.2%', '+11.4%','+14.7%'] },\n  { t:'CMP',  n:'Compass Minerals Intl',  sec:'Materials',   st:'green', cap:'$1.1B',  rq:['+22%','+31%','+44%'],   mq:['+4.1%', '+7.8%', '+12.3%'] },\n  { t:'MU',   n:'Micron Technology',      sec:'Technology',  st:'green', cap:'$112B',  rq:['+57%','+82%','+93%'],   mq:['+14.2%','+18.9%','+22.4%'] },\n  { t:'NVDA', n:'NVIDIA Corporation',     sec:'Technology',  st:'green', cap:'$3.2T',  rq:['+122%','+197%','+265%'],mq:['+51.2%','+55.7%','+61.2%'] },\n  { t:'FN',   n:'Fabrinet',               sec:'Technology',  st:'amber', cap:'$8.4B',  rq:['+18%','+24%','+29%'],   mq:['+8.7%', '+9.2%', '+9.8%']  },\n  { t:'HWM',  n:'Howmet Aerospace',       sec:'Industrials', st:'green', cap:'$42B',   rq:['+12%','+16%','+21%'],   mq:['+11.4%','+13.1%','+15.8%'] }\n];\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  CHART\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nfunction sn(i, s) {\n  return Math.sin(i*2.399+s)*.42 + Math.cos(i*.803+s*1.5)*.28 + Math.sin(i*.317+s*2.1)*.15;\n}\nfunction mockP(n, a, b, s) {\n  const r = [0];\n  for (let i = 1; i < n; i++) r.push(r[i-1] + sn(i,s) + .35);\n  const rng = r[n-1] - r[0] || 1;\n  return r.map(v => a + ((v-r[0])/rng) * (b-a));\n}\n// Empty, not a mock series. Same reason as D's PENDING seed above: these were\n// NVIDIA-shaped mock prices, and _applyToD() only overwrote them when\n// /api/chart returned data - so a failed chart fetch rendered NVIDIA's price\n// history as the searched ticker's own chart. _applyToD() now fills every key\n// unconditionally. (mockP/sn are left in place but are now unused - a cleanup\n// candidate for /simplify, not a behaviour change.)\nconst PRICES = {\n  'YTD': [], '1D': [], '1W': [], '1M': [], '3M': [], '1Y': [], '5Y': []\n};\n\nfunction makeSVG(prices, isPos) {\n  const W=900, H=190, pt=10, pr=10, pb=22, pl=46;\n  const iW=W-pl-pr, iH=H-pt-pb;\n  const min=Math.min(...prices), max=Math.max(...prices), rng=max-min||1, n=prices.length;\n  const px = i => pl + (i/(n-1))*iW;\n  const py = v => pt + (1-(v-min)/rng)*iH;\n  // Straight segments between the REAL data points \u2014 no smoothing. This used to\n  // emit a cubic bezier per segment with both control points at the x-midpoint,\n  // which rounds every corner and forces a horizontal tangent through each\n  // actual price, so the drawn line was a decorative approximation of the data\n  // rather than the data. Yahoo/TradingView draw polylines; so do we.\n  let lp = `M${px(0).toFixed(1)},${py(prices[0]).toFixed(1)}`;\n  for (let i = 1; i < n; i++) {\n    lp += ` L${px(i).toFixed(1)},${py(prices[i]).toFixed(1)}`;\n  }\n  const ap = lp + ` L${px(n-1).toFixed(1)},${(pt+iH).toFixed(1)} L${px(0).toFixed(1)},${(pt+iH).toFixed(1)} Z`;\n  const col = isPos ? '#34D399' : '#F87171';\n  const gid = 'cg' + Math.random().toString(36).slice(2,7);\n  const ticks = [min, (min+max)/2, max];\n  const ylines = ticks.map(v =>\n    `<line x1=\"${pl}\" y1=\"${py(v).toFixed(1)}\" x2=\"${pl+iW}\" y2=\"${py(v).toFixed(1)}\" stroke=\"#1F1F23\" stroke-width=\"1\"/>` +\n    `<text x=\"${pl-5}\" y=\"${(py(v)+4).toFixed(1)}\" text-anchor=\"end\" font-family=\"IBM Plex Mono,monospace\" font-size=\"9\" fill=\"#3F3F46\">$${v.toFixed(2)}<\/text>`\n  ).join('');\n  return `<svg width=\"100%\" height=\"${H}\" viewBox=\"0 0 ${W} ${H}\" preserveAspectRatio=\"none\" shape-rendering=\"geometricPrecision\" style=\"display:block\"><defs><linearGradient id=\"${gid}\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"${col}\" stop-opacity=\".12\"/><stop offset=\"100%\" stop-color=\"${col}\" stop-opacity=\"0\"/><\/linearGradient><\/defs>${ylines}<path d=\"${ap}\" fill=\"url(#${gid})\"/><path d=\"${lp}\" fill=\"none\" stroke=\"${col}\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>`;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  NAVIGATION\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nconst world = document.getElementById('world');\n\nconst PAGES = {\n  home:     { x: 0,                  y: 0 },\n  analysis: { x: 0,                  y: -window.innerHeight },\n  screener: { x: window.innerWidth,  y: 0 },\n  journal:  { x: -window.innerWidth, y: 0 },\n  // News Scanner lives ABOVE home, so reaching it translates #world DOWN.\n  news:     { x: 0,                  y: window.innerHeight },\n};\n\nfunction nav(page, animate) {\n  if (page === 'journal') { window.location.href = '/journal'; return; }\n  if (page === S.page && animate !== false) return;\n  if (S.page === 'analysis' && page !== 'analysis' && window._pricePollInterval) clearInterval(window._pricePollInterval);\n  S.page = page;\n  const p = PAGES[page];\n  world.style.transition = animate === false\n    ? 'none'\n    : 'transform 0.52s cubic-bezier(0.25, 0.46, 0.45, 0.94)';\n  world.style.transform = `translate(${p.x}px, ${p.y}px)`;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  RENDER DISPATCH\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nfunction render() {\n  renderHome();\n  renderAnalysis();\n  renderScreener();\n  renderJournal();\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  HOME\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nfunction renderHome() {\n  document.getElementById('page-home').innerHTML = `\n    <div class=\"pg-home\">\n      <div class=\"fu\" style=\"text-align:center\">\n        <div class=\"home-title\">Quant<br>Terminal<\/div>\n        <div class=\"home-rule\"><\/div>\n      <\/div>\n      <div class=\"hint h-top\"><span>\u2191<\/span><span>ANALYSIS<\/span><\/div>\n      <div class=\"hint h-left\"><span>\u2190<\/span><span>JOURNAL<\/span><\/div>\n      <div class=\"hint h-right\"><span>SCREENER<\/span><span>\u2192<\/span><\/div>\n    <\/div>`;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  ANALYSIS\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nfunction _applyToD() {\n  const a = S.analysis;\n  if (!a) return;\n  D.ticker = a.ticker || S.ticker || '';\n  // balance_sheet / cash_flow are no longer fetched or returned by\n  // /api/financials, and nothing renders them - the card is a single\n  // Revenue / Net Margin / EPS view now.\n  D.val = (a.financials && a.financials.valuation)    || {};\n  // /api/ticker carries the Code 33 verdict and the stat pills, and it is one\n  // of the two slow halves - on a cold ticker it can be 10s+ behind the fast\n  // four. Every field it owns is written on BOTH branches below: the real value\n  // when the payload is here, an explicit PENDING when it is not. Never left\n  // alone to keep whatever was there before, which would be the previous\n  // ticker's value or a demo seed. Same \"write unconditionally, empty\n  // included\" rule the ownership list already follows.\n  const inf = a.info || {};\n  const infoReady = !!(inf && Object.keys(inf).length);\n  if (infoReady) {\n    D.name = inf.company_name || S.ticker || '';\n  } else {\n    // The ticker the user typed is not a fake value - it is the one thing about\n    // this company that is already known for certain.\n    D.name = S.ticker || PENDING;\n  }\n  if (inf.price    != null) D.price    = Number(inf.price);\n  if (inf.change   != null) D.change   = Number(inf.change);\n  if (inf.change_pct != null) D.changePct = Number(inf.change_pct);\n  // The live quote wins over /api/ticker's cached copy. Applied AFTER the inf\n  // block on purpose. Same three fields, same yfinance fast_info source \u2014 this\n  // is purely about freshness, not a different number.\n  const q = a.quote || {};\n  if (q.price      != null) D.price     = Number(q.price);\n  if (q.change     != null) D.change    = Number(q.change);\n  if (q.change_pct != null) D.changePct = Number(q.change_pct);\n  if (infoReady) {\n    // Each of these used to fall through to the NVIDIA seed when the field was\n    // absent. An em dash means \"the API had nothing here\"; PENDING means \"not\n    // asked yet\". They are different states and must not look the same.\n    D.mktCap = inf.market_cap_fmt || '\u2014';\n    D.pe = (inf.pe_ratio != null && inf.pe_ratio !== 'N/A')\n      ? Number(inf.pe_ratio).toFixed(1) + 'x' : '\u2014';\n    D.week52High = inf.week52_high != null ? '$' + Number(inf.week52_high).toFixed(2) : '\u2014';\n    D.week52Low  = inf.week52_low  != null ? '$' + Number(inf.week52_low).toFixed(2)  : '\u2014';\n    if (inf.avg_volume) {\n      const v = Number(inf.avg_volume);\n      D.avgVol = v >= 1e9 ? (v/1e9).toFixed(1)+'B' : v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1e3 ? (v/1e3).toFixed(1)+'K' : String(v);\n    } else {\n      D.avgVol = '\u2014';\n    }\n  } else {\n    D.mktCap = PENDING; D.pe = PENDING;\n    D.week52High = PENDING; D.week52Low = PENDING; D.avgVol = PENDING;\n  }\n  const bmap = { green:{text:'CODE 33 GREEN',color:'#34D399'}, yellow:{text:'CODE 33 YELLOW',color:'#FBBF24'}, red:{text:'CODE 33 RED',color:'#F87171'}, excluded_bank:{text:'EXCLUDED \\u2014 BANK, NOT YET SUPPORTED',color:'#52525B'} };\n  // LOADING is a THIRD state, distinct from both a real verdict and the\n  // 'NO SIGNAL' the API returns for a status it has no badge for. Without it a\n  // pending page would read 'NO SIGNAL', which is an answer, not a wait.\n  const badge = infoReady\n    ? (bmap[inf.status] || { text:'NO SIGNAL', color:'#52525B' })\n    : { text:'LOADING\u2026', color:'#52525B' };\n  D.c33Text  = badge.text;\n  D.c33Color = badge.color;\n  D.preMarketPrice    = inf.preMarketPrice    != null ? Number(inf.preMarketPrice)    : null;\n  D.preMarketChange   = inf.preMarketChange   != null ? Number(inf.preMarketChange)   : null;\n  D.preMarketChangePct = inf.preMarketChangePercent != null ? Number(inf.preMarketChangePercent) : null;\n\n  if (a.news && a.news.length) {\n    D.news = a.news.map(n => {\n      const diff = Math.floor(Date.now()/1000 - (n.time||0));\n      const ago  = diff < 3600 ? Math.floor(diff/60)+'m ago' : diff < 86400 ? Math.floor(diff/3600)+'h ago' : Math.floor(diff/86400)+'d ago';\n      return { src: n.source||'Yahoo Finance', t: ago, hl: n.title||'', url: n.url||'#' };\n    });\n  }\n  // Mirror the API unconditionally, empty included. The old guard only wrote\n  // D.owners when the response was non-empty, so an empty ownership payload\n  // left the previous ticker's holders \u2014 or the mock literals \u2014 on screen with\n  // nothing to distinguish them from live data.\n  D.owners = (a.ownership || []).map(h => ({ name: h.name, pct: Number(h.pct) }));\n  if (a.financials && a.financials.earnings && a.financials.earnings.length) {\n    const earns = a.financials.earnings.slice(0, 8);\n    D.qs      = earns.map(e => { const d=new Date((e.date||'2000-01-01')+'T12:00:00'); return 'Q'+(Math.floor(d.getMonth()/3)+1)+' FY'+String(d.getFullYear()).slice(2); });\n    D.rev     = earns.map(e => e.revenue != null ? e.revenue / 1e9 : 0);\n    D.eps     = earns.map(e => e.eps != null ? Number(e.eps) : 0);\n    D.netMarginArr = earns.map(e => e.net_margin != null ? Number(e.net_margin) : null);\n    const fmtYoY = (val, delta) => {\n      if (val == null) return '\u2014';\n      const sign = val >= 0 ? '+' : '';\n      let s = sign + Number(val).toFixed(1) + '%';\n      if (delta != null) {\n        const dsign = delta >= 0 ? '\u25b2' : '\u25bc';\n        const dcol = delta >= 0 ? '#34D399' : '#F87171';\n        s += ' <span style=\"font-size:10px;color:' + dcol + '\">' + dsign + Math.abs(Number(delta)).toFixed(1) + 'pp<\/span>';\n      }\n      return s;\n    };\n    const fmtYoYpct = (val, delta) => {\n      if (val == null) return '\u2014';\n      const sign = val >= 0 ? '+' : '';\n      let s = sign + Number(val).toFixed(1) + '%';\n      if (delta != null) {\n        const dsign = delta >= 0 ? '\u25b2' : '\u25bc';\n        const dcol = delta >= 0 ? '#34D399' : '#F87171';\n        s += ' <span style=\"font-size:10px;color:' + dcol + '\">' + dsign + Math.abs(Number(delta)).toFixed(1) + 'pp<\/span>';\n      }\n      return s;\n    };\n    D.epsYoYA     = earns.map((e,i) => fmtYoYpct(e.eps_yoy, i < earns.length-1 ? (e.eps_yoy != null && earns[i+1].eps_yoy != null ? e.eps_yoy - earns[i+1].eps_yoy : null) : null));\n    D.revYoYA     = earns.map((e,i) => fmtYoY(e.rev_yoy, i < earns.length-1 ? (e.rev_yoy != null && earns[i+1].rev_yoy != null ? e.rev_yoy - earns[i+1].rev_yoy : null) : null));\n    D.netMarginYoYA = earns.map((e,i) => fmtYoY(e.net_margin_yoy, i < earns.length-1 ? (e.net_margin_yoy != null && earns[i+1].net_margin_yoy != null ? e.net_margin_yoy - earns[i+1].net_margin_yoy : null) : null));\n    D.ni          = earns.map(e => e.net_margin != null ? e.net_margin : 0);\n    const le      = earns[0] || {};\n    D.epsYoY = le.eps_yoy != null\n      ? ((le.eps_yoy >= 0 ? '+' : '') + Number(le.eps_yoy).toFixed(1) + '%') : '\u2014';\n  } else {\n    // /api/financials has not answered yet, or answered with nothing. Clear\n    // every array it owns rather than leaving the seed (or the last ticker's\n    // numbers) in place - finContentHtml() renders its own pending/empty state\n    // off an empty D.qs.\n    D.qs = []; D.rev = []; D.eps = []; D.ni = [];\n    D.revYoYA = []; D.netMarginArr = []; D.netMarginYoYA = []; D.epsYoYA = [];\n    D.epsYoY = (a.financials && Object.keys(a.financials).length) ? '\u2014' : PENDING;\n  }\n  // Unconditional. Guarded, a failed /api/chart left whatever was in PRICES -\n  // the previous ticker's series, or the NVIDIA mock seed - to be drawn as this\n  // ticker's chart. An empty series draws nothing, which is the honest answer.\n  const cl = (a.chart || []).map(p => p.close);\n  PRICES['YTD'] = [];\n  PRICES['1Y']  = cl;\n  PRICES['3M']  = [];\n  PRICES['1M']  = [];\n  PRICES['1W']  = [];\n  PRICES['1D']  = [];\n  PRICES['5Y']  = [];\n}\n\n// The one definition of the above-chart performance number. renderAnalysis()\n// (first paint) and renderChart() (tab switch) both call it; they used to carry\n// duplicate copies of this arithmetic, which is exactly how two readouts drift\n// apart from each other.\n//\n// 1D is deliberately special-cased. \"1D\" and \"today\" are the same thing, so it\n// reuses the top badge's OWN numbers \u2014 live price against the previous close \u2014\n// rather than recomputing from the intraday series, whose first bar is not the\n// previous close. Measured on NVDA: badge +$1.68 (vs prev close 217.55) against\n// -$1.62 (vs the 09:30 bar at 220.86) \u2014 opposite signs, both arithmetically\n// right, one baseline wrong for the label. Reusing the VALUES rather than just\n// the baseline makes the two identical by construction, not by rounding luck.\n//\n// Every other tab measures the plotted series' own first and last points, so\n// the label can never disagree with the line drawn directly beneath it. It used\n// to end at the separately-fetched live quote, a different number from the\n// chart's own last close.\nfunction periodPerf(tf) {\n  if (tf === '1D') {\n    if (D.change == null || D.changePct == null) return null;\n    return { dollar: Number(D.change), pct: Number(D.changePct) };\n  }\n  var prices = PRICES[tf] || [];\n  if (prices.length < 2) return null;\n  var first = prices[0], last = prices[prices.length - 1];\n  if (!(first > 0)) return null;\n  var dollar = last - first;\n  return { dollar: dollar, pct: dollar / first * 100 };\n}\n\n// One formatter for the badge's \"$change (pct%)\". The 30s poll used to build\n// this string itself and DROPPED THE MINUS SIGN on the dollar figure entirely\n// (a -$1.65 move rendered as \"$1.65\"), while renderAnalysis() put the sign\n// inside the dollar sign (\"$-1.65\"). Both now read \"-$1.65\".\nfunction fmtChange(dollar, pct) {\n  var d = Number(dollar) || 0, p = Number(pct) || 0;\n  var s = d >= 0 ? '+' : '-';\n  return s + '$' + Math.abs(d).toFixed(2) + ' (' + s + Math.abs(p).toFixed(2) + '%)';\n}\n\nfunction renderChart() {\n  var prices = PRICES[S.tf] || [];\n  var pp     = periodPerf(S.tf);\n  var isGain = pp ? pp.dollar >= 0\n                  : (prices.length >= 2 ? prices[prices.length - 1] >= prices[0] : true);\n  var wrap = document.getElementById('chart-wrap');\n  if (wrap) wrap.innerHTML = makeSVG(prices, isGain);\n  document.querySelectorAll('.tf').forEach(function(x){ x.classList.toggle('on', x.dataset.tf === S.tf); });\n  var perfEl = document.getElementById('period-perf');\n  if (perfEl && pp) {\n    perfEl.textContent = (isGain ? '\u25b2' : '\u25bc') + ' $' + Math.abs(pp.dollar).toFixed(2)\n                       + '   ' + Math.abs(pp.pct).toFixed(2) + '%';\n    perfEl.style.color = isGain ? '#34D399' : '#F87171';\n  }\n}\n\nasync function changeChartPeriod(period) {\n  const periodMap   = {'YTD':'ytd','1D':'1d','1W':'5d','1M':'1mo','3M':'3mo','1Y':'1y','5Y':'5y'};\n  const intervalMap = {'YTD':'1d','1D':'5m','1W':'30m','1M':'1d','3M':'1d','1Y':'1d','5Y':'1wk'};\n  const p  = periodMap[period]   || '1y';\n  const iv = intervalMap[period] || '1d';\n  S.tf = period;\n  try {\n    const ch = await fetch('/api/chart/' + S.ticker + '?period=' + p + '&interval=' + iv).then(r => r.json());\n    if (S.analysis) S.analysis.chart = ch.prices || [];\n    PRICES[period] = (ch.prices || []).map(x => x.close);\n    renderChart();\n  } catch(e) { console.error('[changeChartPeriod]', e); }\n}\n\nfunction isMarketOpen() {\n  var et = new Date(new Date().toLocaleString('en-US', {timeZone: 'America/New_York'}));\n  var day = et.getDay();\n  if (day === 0 || day === 6) return false;\n  var mins = et.getHours() * 60 + et.getMinutes();\n  return mins >= 570 && mins < 960;\n}\n\nfunction startPricePoll() {\n  if (window._pricePollInterval) clearInterval(window._pricePollInterval);\n  window._pricePollInterval = setInterval(async function() {\n    if (S.page !== 'analysis' || !S.ticker) return;\n    try {\n      // /api/price, NOT /api/ticker. This poll reads only price/change/change_pct,\n      // while /api/ticker runs the full Code 33 pipeline behind the adapter's global\n      // lock with a 300s cache \u2014 so every ~10th tick fired an unrequested 15-30s\n      // pipeline run that stalled the server for every connected client, on a page\n      // nobody was touching. /api/price returns the same three fields from a single\n      // yfinance fast_info call and never reaches the pipeline.\n      // loadAnalysis()'s initial Promise.all still uses /api/ticker \u2014 it needs it.\n      var d = await fetch('/api/price/' + S.ticker).then(function(r){ return r.json(); });\n      // Keep D in step with what was just painted. The 1D performance label is\n      // derived from D.change/D.changePct, so updating only the DOM would let\n      // the badge move while the label below the chart kept the load-time\n      // numbers \u2014 the two would silently stop matching between polls.\n      if (d.price      != null) D.price     = Number(d.price);\n      if (d.change     != null) D.change    = Number(d.change);\n      if (d.change_pct != null) D.changePct = Number(d.change_pct);\n      var priceEl  = document.querySelector('.price-val');\n      var changeEl = document.querySelector('.price-change');\n      if (priceEl) priceEl.textContent = '$' + (d.price || 0).toFixed(2);\n      if (changeEl) {\n        changeEl.textContent = fmtChange(d.change, d.change_pct);\n        changeEl.style.color = (d.change || 0) >= 0 ? '#34D399' : '#F87171';\n      }\n      // Only 1D's label depends on the quote; every other tab is chart-derived\n      // and unaffected, so this repaints nothing it does not have to.\n      if (S.tf === '1D') renderChart();\n    } catch(e) {}\n  }, 30000);\n}\n\nfunction renderAnalysisIdle() {\n  const loading = S.loadingTicker;\n  const msg = loading\n    ? `<div style=\"font-family:IBM Plex Mono,monospace;color:#D4A843\">Loading ${loading}\\u2026<\/div>\n       <div style=\"margin-top:8px;color:#3F3F46;font-size:12px\">Pulling filings, price, news and ownership.<\/div>`\n    : `<div>Search a ticker to load its analysis.<\/div>\n       <div style=\"margin-top:8px;color:#3F3F46;font-size:12px\">Nothing is fetched until you do.<\/div>`;\n  document.getElementById('page-analysis').innerHTML = `\n    <div class=\"pg-analysis\">\n      <div class=\"search-bar\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/><\/svg>\n        <form id=\"sf\" style=\"display:contents\">\n          <input id=\"ticker-input\" type=\"text\" placeholder=\"Search ticker\\u2026 e.g. NVDA\" value=\"${S.ticker}\" autocomplete=\"off\" spellcheck=\"false\">\n        <\/form>\n      <\/div>\n      <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56vh;text-align:center;color:#52525B;font-size:13px;line-height:1.6;padding:0 24px\">\n        ${msg}\n      <\/div>\n    <\/div>\n    <div class=\"back-hint\"><span>\\u2193<\/span><span>HOME<\/span><\/div>`;\n  const sf = document.getElementById('sf');\n  if (sf) sf.addEventListener('submit', e => {\n    e.preventDefault();\n    const tk = document.getElementById('ticker-input').value.trim().toUpperCase();\n    if (tk) { S.ticker = tk; loadAnalysis(tk); }\n  });\n  // Focus so typing works without clicking into the box first. The keydown\n  // handler routes keys to the page unless an INPUT is focused, so an unfocused\n  // box swallows nothing and Enter submits nothing.\n  //   - guarded on S.page: render() also builds this page at boot while the\n  //     user is on home, and focusing an off-screen input there would disable\n  //     the arrow keys that are the only keyboard route into this page.\n  //   - preventScroll: the input lives inside the transformed #world grid;\n  //     a scroll-into-view would shift that grid.\n  const input = document.getElementById('ticker-input');\n  // select(), not a bare focus(): the box is pre-filled with S.ticker, and\n  // focus() alone leaves the caret at position 0, so the next thing typed is\n  // inserted BEFORE the old symbol (measured: typing MSFT over AAPL searched\n  // 'MSFTAAPL'). Selecting means the first keystroke replaces it.\n  if (input && S.page === 'analysis') { input.focus({ preventScroll: true }); input.select(); }\n}\n\n// Extracted so renderAnalysis() (first paint) and patchSlowSections() (when the\n// Code 33 half lands) build these two sections from ONE definition. Two copies\n// of this markup would be two things to keep in step, which is exactly how the\n// chart's perf number and its badge drifted apart before periodPerf() existed.\n// Single view: Revenue, Net Margin and EPS (Adj), each followed by its own YoY\n// row. The Balance Sheet and Cash Flow branches are gone along with the tab\n// strip that selected them, and /api/financials no longer fetches or returns\n// either one - so there is no hidden panel here, there is no second dataset.\n// Everything below is the Income Statement tab's own markup, unchanged.\nfunction finContentHtml() {\n  if (!D.qs || !D.qs.length) {\n    // Two different empty states, deliberately worded differently: still\n    // loading, versus the API genuinely having no income data for this ticker.\n    return D.epsYoY === PENDING\n      ? '<div style=\"padding:40px;text-align:center;color:#52525B\">Loading financials\u2026<\/div>'\n      : '<div style=\"padding:40px;text-align:center;color:#52525B\">No income data<\/div>';\n  }\n  const ih = '<div class=\"fin-scroll\"><table class=\"fin-tbl\"><thead><tr><th>Metric<\/th>' + D.qs.map(function(q){return '<th>' + q + '<\/th>';}).join('') + '<\/tr><\/thead><tbody>';\n  const posNeg = function(v) { return typeof v === 'string' && v.startsWith('+') ? 'pos' : 'neg'; };\n  const ib =\n    '<tr><td>Revenue<\/td>' + D.rev.map(function(v){return '<td>$' + v.toFixed(1) + 'B<\/td>';}).join('') + '<\/tr>' +\n    '<tr><td class=\"ind\">Rev YoY<\/td>' + (D.revYoYA||[]).map(function(v){return '<td class=\"' + posNeg(v) + '\">' + v + '<\/td>';}).join('') + '<\/tr>' +\n    '<tr><td>Net Margin<\/td>' + (D.netMarginArr||[]).map(function(v){return '<td>' + (v != null ? v.toFixed(1) + '%' : '\u2014') + '<\/td>';}).join('') + '<\/tr>' +\n    '<tr><td class=\"ind\">Margin YoY<\/td>' + (D.netMarginYoYA||[]).map(function(v){return '<td class=\"' + posNeg(v) + '\">' + v + '<\/td>';}).join('') + '<\/tr>' +\n    '<tr><td>EPS (Adj)<\/td>' + D.eps.map(function(v){return '<td>$' + v.toFixed(2) + '<\/td>';}).join('') + '<\/tr>' +\n    '<tr><td class=\"ind\">EPS YoY<\/td>' + (D.epsYoYA||[]).map(function(v){return '<td class=\"' + posNeg(v) + '\">' + v + '<\/td>';}).join('') + '<\/tr>';\n  return ih + ib + '<\/tbody><\/table><\/div>';\n}\n\nfunction statsGridHtml() {\n  return [['Market Cap',D.mktCap],['P/E Ratio',D.pe],['52W High',D.week52High],['52W Low',D.week52Low],['Avg Vol',D.avgVol],['EPS YoY',D.epsYoY]]\n    .map(function(p){ return '<div class=\"stat\"><div class=\"sl\">' + p[0] + '<\/div><div class=\"sv\">' + p[1] + '<\/div><\/div>'; }).join('');\n}\n\n// Update ONLY the sections the slow half owns. Deliberately not a second\n// renderAnalysis(): that replaces all of #page-analysis and re-attaches every\n// listener, so calling it seconds after first paint would wipe out whatever the\n// user had typed into the search box in the meantime - the page would appear to\n// eat their keystrokes. Four targeted nodes instead, no listeners touched.\nfunction patchSlowSections() {\n  const nameEl = document.getElementById('id-name');\n  if (nameEl) nameEl.textContent = D.name;\n  const badgeEl = document.getElementById('c33-badge');\n  if (badgeEl) {\n    badgeEl.textContent = D.c33Text;\n    badgeEl.style.borderColor = D.c33Color;\n    badgeEl.style.color = D.c33Color;\n  }\n  const statsEl = document.getElementById('stats-grid');\n  if (statsEl) statsEl.innerHTML = statsGridHtml();\n  const finEl = document.getElementById('fin-content');\n  if (finEl) finEl.innerHTML = finContentHtml();\n}\n\nfunction renderAnalysis() {\n  // Nothing loaded yet (fresh boot, or a load still in flight): render the idle\n  // state instead of falling through to D, whose defaults are demo values.\n  if (!S.analysis) { renderAnalysisIdle(); return; }\n  _applyToD();\n  const isPos = D.changePct >= 0;\n  const chartPrices = PRICES[S.tf] || [];\n  // Same helper renderChart() uses \u2014 see periodPerf() for why 1D differs.\n  const ppRA       = periodPerf(S.tf);\n  const isGain     = ppRA ? ppRA.dollar >= 0\n                          : (chartPrices.length >= 2 ? chartPrices[chartPrices.length-1] >= chartPrices[0] : true);\n  const perfArrow  = isGain ? '\u25b2' : '\u25bc';\n  const perfColor  = isGain ? '#34D399' : '#F87171';\n  const perfDisplay = ppRA ? perfArrow + ' $' + Math.abs(ppRA.dollar).toFixed(2)\n                             + '   ' + Math.abs(ppRA.pct).toFixed(2) + '%' : '';\n  const preMarketHtml = (D.preMarketPrice && !isMarketOpen())\n    ? '<div class=\"pre-market-row\"><span class=\"pre-label\">Pre-market<\/span><span class=\"pre-price\">$' + D.preMarketPrice.toFixed(2) + '<\/span>' +\n      (D.preMarketChange != null ? '<span class=\"pre-change\" style=\"color:' + (D.preMarketChange >= 0 ? '#34D399' : '#F87171') + '\">' + (D.preMarketChange >= 0 ? '+' : '') + '$' + Math.abs(D.preMarketChange).toFixed(2) + ' (' + (D.preMarketChangePct >= 0 ? '+' : '') + (D.preMarketChangePct || 0).toFixed(2) + '%)<\/span>' : '') + '<\/div>'\n    : '';\n  const tfBtns = ['YTD','1D','1W','1M','3M','1Y','5Y'].map(t =>\n    `<button class=\"tf${t===S.tf?' on':''}\" data-tf=\"${t}\">${t}<\/button>`\n  ).join('');\n\n\nconst news = D.news.map(n => `\n    <div class=\"news-card\">\n      <div style=\"display:flex;justify-content:space-between;gap:8px\">\n        <span class=\"news-src\">${n.src}<\/span>\n        <span class=\"news-time\">${n.t}<\/span>\n      <\/div>\n      <a class=\"news-hl\" href=\"${n.url||'#'}\" target=\"_blank\" rel=\"noopener\" style=\"color:inherit;text-decoration:none;display:block\">${n.hl}<\/a>\n    <\/div>`).join('');\n\n  const own = D.owners.length ? D.owners.map(o => `\n    <div class=\"own-row\">\n      <div class=\"own-name\">${o.name}<\/div>\n      <div class=\"own-bar-bg\"><div class=\"own-bar\" style=\"width:${(o.pct/10*100).toFixed(1)}%\"><\/div><\/div>\n      <div class=\"own-pct\">${o.pct}%<\/div>\n    <\/div>`).join('') : `<div style=\"padding:26px 4px;text-align:center;color:#52525B;font-size:12px;line-height:1.5\">Ownership data unavailable<\/div>`;\n\n  document.getElementById('page-analysis').innerHTML = `\n    <div class=\"pg-analysis\">\n      <div class=\"search-bar\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/><\/svg>\n        <form id=\"sf\" style=\"display:contents\">\n          <input id=\"ticker-input\" type=\"text\" placeholder=\"Search ticker\u2026 e.g. NVDA\" value=\"${S.ticker}\" autocomplete=\"off\" spellcheck=\"false\">\n        <\/form>\n      <\/div>\n      <div class=\"id-bar\">\n        <div>\n          <div class=\"id-name\" id=\"id-name\">${D.name}<\/div>\n          <div class=\"id-meta\">${S.ticker} \u00b7 ${D.exchange}<\/div>\n        <\/div>\n        <div class=\"id-right\">\n          <div>\n            ${preMarketHtml}\n            <span class=\"id-price price-val\">$${D.price.toFixed(2)}<\/span>\n            <span class=\"id-chg price-change ${isPos?'pos':'neg'}\"> ${fmtChange(D.change, D.changePct)}<\/span>\n          <\/div>\n          <span class=\"c33 on\" id=\"c33-badge\" style=\"border-color:${D.c33Color};color:${D.c33Color}\">${D.c33Text}<\/span>\n        <\/div>\n      <\/div>\n      <div class=\"a-body\">\n        <div class=\"card\">\n          <div class=\"card-hd\">PRICE CHART<div class=\"tf-row\">${tfBtns}<\/div><\/div>\n          <div id=\"period-perf\" style=\"text-align:right;font-family:IBM Plex Mono,monospace;font-size:13px;color:${perfColor};padding:4px 12px 0\">${perfDisplay}<\/div>\n          <div id=\"chart-wrap\" style=\"padding:8px 0 0\">${makeSVG(chartPrices, isGain)}<\/div>\n        <\/div>\n        <div class=\"stats-grid\" id=\"stats-grid\">${statsGridHtml()}<\/div>\n        <div class=\"card\">\n          <div class=\"card-hd\">FINANCIALS<\/div>\n          <div id=\"fin-content\">${finContentHtml()}<\/div>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-hd\">LIVE NEWS<span class=\"live-pill\"><span class=\"live-dot\"><\/span>LIVE<\/span><\/div>\n          <div style=\"padding:14px\"><div class=\"news-grid\">${news}<\/div><\/div>\n        <\/div>\n        <div class=\"bot-cols\">\n          <div class=\"card\">\n            <div class=\"card-hd\">INSTITUTIONAL OWNERSHIP<\/div>\n            <div style=\"padding:14px\">${own}<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"back-hint\"><span>\u2193<\/span><span>HOME<\/span><\/div>`;\n\n  document.getElementById('sf').addEventListener('submit', e => {\n    e.preventDefault();\n    const tk = document.getElementById('ticker-input').value.trim().toUpperCase();\n    if (tk) { S.ticker = tk; loadAnalysis(tk); }\n  });\n  document.querySelector('.tf-row').addEventListener('click', e => {\n    const b = e.target.closest('.tf'); if (!b) return;\n    changeChartPeriod(b.dataset.tf);\n  });\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SCREENER\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\n// Generation counter for staged loading. The fast four paint in well under a\n// second; the Code 33 half can be 10s+ behind on a ticker's first touch. If the\n// user searches A and then B inside that window, A's late response must not\n// paint over B's page - so every apply re-checks that its token is still the\n// current one. Without this the staged split would introduce cross-ticker\n// contamination that the old single-Promise.all version could not have.\nlet _analysisToken = 0;\n\nasync function loadAnalysis(tk) {\n  tk = (tk || '').trim().toUpperCase();\n  if (!tk) return;\n  const token = ++_analysisToken;\n  S.ticker = tk;\n  S.loadingTicker = tk;\n  // Drop the previous ticker's payload outright. Keeping it would leave its\n  // values on screen under the new ticker's name for as long as the new load\n  // takes, which is the stale-data failure this whole change exists to avoid.\n  S.analysis = null;\n  renderAnalysisIdle();\n\n  // All six requests are started HERE, together. Only the awaits are staged, so\n  // nothing is serialized behind anything else and total load time is unchanged\n  // - this is purely about when each half is allowed to paint.\n  const pChart  = fetch('/api/chart/'     + tk + '?period=1y&interval=1d').then(r => r.ok ? r.json() : {}).catch(() => ({}));\n  const pNews   = fetch('/api/news/'      + tk).then(r => r.ok ? r.json() : {}).catch(() => ({}));\n  const pOwn    = fetch('/api/ownership/' + tk).then(r => r.ok ? r.json() : {}).catch(() => ({}));\n  // Live quote for the badge. /api/ticker carries the same three fields but\n  // is cached 300s, so at first paint it can be five minutes stale and then\n  // visibly jump when the 30s poll lands. This costs ~0.4s, runs in the same\n  // fan-out, and never touches the pipeline.\n  const pPrice  = fetch('/api/price/'     + tk).then(r => r.ok ? r.json() : {}).catch(() => ({}));\n  // The two slow ones - both run the Code 33 pipeline behind the adapter's\n  // global lock. Started now, awaited second.\n  const pTicker = fetch('/api/ticker/'    + tk).then(r => r.ok ? r.json() : {}).catch(() => ({}));\n  const pFin    = fetch('/api/financials/'+ tk).then(r => r.ok ? r.json() : {}).catch(() => ({}));\n\n  try {\n    const [ch, nw, ow, qt] = await Promise.all([pChart, pNews, pOwn, pPrice]);\n    if (token !== _analysisToken) return;\n    S.analysis = {\n      ticker:    tk,\n      info:      {},\n      chart:     ch.prices || [],\n      financials:{},\n      news:      nw.news || [],\n      ownership: ow.institutional || [],\n      quote:     qt,\n    };\n    S.loadingTicker = null;\n    renderAnalysis();\n    startPricePoll();\n  } catch(e) {\n    console.error('[loadAnalysis] fast group failed:', e);\n  }\n\n  try {\n    const [ti, fi] = await Promise.all([pTicker, pFin]);\n    // Two guards, not one: the token catches a newer search, and the ticker\n    // check catches the case where the fast group failed and left S.analysis\n    // null or belonging to something else.\n    if (token !== _analysisToken) return;\n    if (!S.analysis || S.analysis.ticker !== tk) return;\n    S.analysis.info = ti;\n    S.analysis.financials = fi;\n    console.log('[loadAnalysis] ok', tk, 'price:', ti.price, 'status:', ti.status);\n    _applyToD();\n    patchSlowSections();\n  } catch(e) {\n    console.error('[loadAnalysis] slow group failed:', e);\n  }\n}\n\nfunction getSorted() {\n  const d = [...SC];\n  function parseCap(s) {\n    if (!s || s === 'N/A') return 0;\n    const n = parseFloat(s.replace(/[^0-9.]/g,''));\n    if ((s||'').toUpperCase().includes('T')) return n * 1e12;\n    if ((s||'').toUpperCase().includes('B')) return n * 1e9;\n    if ((s||'').toUpperCase().includes('M')) return n * 1e6;\n    return n;\n  }\n  if      (S.sortBy === 'revenue') d.sort((a,b) => parseFloat(b.rq[2]) - parseFloat(a.rq[2]));\n  else if (S.sortBy === 'margin')  d.sort((a,b) => parseFloat(b.mq[2]) - parseFloat(a.mq[2]));\n  else                             d.sort((a,b) => parseCap(b.cap) - parseCap(a.cap));\n  return d;\n}\n\nfunction renderScreener() {\n  const res = getSorted();\n  const cards = res.map(r => `\n    <div class=\"r-card ${r.st==='green'?'gc':'ac'}\" data-ticker=\"${r.t}\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:8px\">\n        <div><div class=\"r-tick\">${r.t}<\/div><div class=\"r-name\">${r.n}<\/div><\/div>\n        <span class=\"sec-pill\">${r.sec}<\/span>\n      <\/div>\n      <div class=\"m-row\">\n        <div class=\"m-lbl\">REVENUE YoY<\/div>\n        <div class=\"q-pills\">${r.rq.map(q=>`<span class=\"q-pill ${q.startsWith('+')?'p':'n'}\">${q}<\/span>`).join('')}<\/div>\n      <\/div>\n      <div class=\"m-row\">\n        <div class=\"m-lbl\">NET MARGIN<\/div>\n        <div class=\"q-pills\">${r.mq.map(q=>`<span class=\"q-pill ${q.startsWith('+')?'p':'n'}\">${q}<\/span>`).join('')}<\/div>\n      <\/div>\n      <div class=\"r-foot\">\n        <div class=\"st-badge ${r.st==='green'?'g':'a'}\"><span class=\"st-dot\"><\/span>${r.st==='green'?'GREEN':'YELLOW'}<\/div>\n        <div class=\"r-cap\">${r.cap}<\/div>\n      <\/div>\n    <\/div>`).join('');\n\n  document.getElementById('page-screener').innerHTML = `\n    <div class=\"pg-screener\">\n      <div class=\"sc-wrap\">\n        <div class=\"pg-title\">Screener<\/div>\n        <div class=\"pg-sub\">Code 33 \u2014 Revenue and margin acceleration over three quarters.<\/div>\n        <div class=\"upload-z${S.fileLoaded?' ld':''}\" id=\"uz\">\n          <svg class=\"upload-ico\" width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <polyline points=\"16 16 12 12 8 16\"/><line x1=\"12\" y1=\"12\" x2=\"12\" y2=\"21\"/>\n            <path d=\"M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3\"/>\n          <\/svg>\n          ${S.fileLoaded\n            ? `<div class=\"upload-ttl upload-fn\">${S.fileName}<\/div><div class=\"upload-sub\">${S.tickerCount.toLocaleString()} tickers detected<\/div>`\n            : `<div class=\"upload-ttl\">Drop your CSV here<\/div><div class=\"upload-sub\">or click to browse \u2014 expects a ticker column<\/div>`}\n        <\/div>\n        <button class=\"run-btn\" id=\"run-btn\">\n          Run Code 33\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"7\" y1=\"17\" x2=\"17\" y2=\"7\"/><polyline points=\"7 7 17 7 17 17\"/><\/svg>\n        <\/button>\n        ${S.scanning ? `<div class=\"prog-wrap\"><div class=\"prog-bar go\"><\/div><\/div><div class=\"pg-sub\">${(S.scanProgress && S.scanProgress.total) ? (S.scanProgress.completed + ' / ' + S.scanProgress.total + (S.scanProgress.current ? ' \\u2014 ' + S.scanProgress.current : '') + ((S.scanMeta && S.scanMeta.passed) ? ' \\u00b7 ' + S.scanMeta.passed + ' passed' : '')) : 'starting\\u2026'}<\/div>` : ''}\n        ${S.scanRan ? `\n        ${S.scanStopped ? `<div style=\"border:1px solid #FBBF24;background:rgba(251,191,36,.08);border-radius:6px;padding:12px 14px;margin-bottom:16px\">\n          <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#FBBF24;font-weight:600;margin-bottom:6px\">Scan stopped early \\u2014 circuit breaker<\/div>\n          <div style=\"font-size:12px;color:#FAFAFA;line-height:1.55\">${S.scanStopped}<\/div>\n          ${S.scanFailReasons ? `<div style=\"font-size:11px;color:#52525B;margin-top:8px\">${Object.entries(S.scanFailReasons).map(([k,v]) => v + ' \\u00d7 ' + k).join(' \\u00b7 ')}<\/div>` : ''}\n        <\/div>` : ''}\n        <div class=\"sum-pills\">\n          <div class=\"s-pill\"><div class=\"s-lbl\">Scanned<\/div><div class=\"s-val\">${(S.scanMeta.total||0).toLocaleString()}<\/div><\/div>\n          <div class=\"s-pill\"><div class=\"s-lbl\">Passed<\/div><div class=\"s-val g\">${S.scanMeta.passed||0}<\/div><\/div>\n          <div class=\"s-pill\"><div class=\"s-lbl\">Insufficient Data<\/div><div class=\"s-val m\">${S.scanMeta.insufficient||0}<\/div><\/div>\n          ${(S.scanMeta.excluded_banks||0) > 0 ? `<div class=\"s-pill\"><div class=\"s-lbl\">Excluded \\u2014 Banks<\/div><div class=\"s-val m\">${S.scanMeta.excluded_banks}<\/div><\/div>` : ''}\n        <\/div>\n        <div class=\"sort-bar\">\n          <div class=\"sort-lbl\">${S.scanMeta.passed||0} passed Code 33<\/div>\n          <div class=\"sort-btns\" id=\"sort-btns\">\n            <button class=\"sort-btn${S.sortBy==='revenue'?' on':''}\" data-sort=\"revenue\">Revenue<\/button>\n            <button class=\"sort-btn${S.sortBy==='margin' ?' on':''}\" data-sort=\"margin\">Margin<\/button>\n            <button class=\"sort-btn${S.sortBy==='mktcap' ?' on':''}\" data-sort=\"mktcap\">Mkt Cap<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"res-grid\">${cards}<\/div>` : ''}\n      <\/div>\n    <\/div>\n    <div class=\"back-hint\"><span>\u2193<\/span><span>HOME<\/span><\/div>`;\n\n  document.getElementById('uz').addEventListener('click', () => document.getElementById('csv-input').click());\n  document.getElementById('run-btn').addEventListener('click', () => {\n    if (S.scanning) return;\n    S.scanning = true; S.scanRan = false; renderScreener();\n    runScan();\n  });\n  document.getElementById('sort-btns')?.addEventListener('click', e => {\n    const b = e.target.closest('.sort-btn'); if (!b) return;\n    S.sortBy = b.dataset.sort; renderScreener();\n  });\n  document.querySelectorAll('.r-card').forEach(c => c.addEventListener('click', () => {\n    S.ticker = c.dataset.ticker; nav('analysis'); loadAnalysis(S.ticker);\n  }));\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  JOURNAL\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\n// =============================================================================\n// IndexedDB setup\n// =============================================================================\n\nasync function runScan() {\n  if (!S.file) { S.scanning = false; renderScreener(); return; }\n  const applyStatus = (st) => {\n    if (st.meta) S.scanMeta = st.meta;\n    S.scanProgress = { completed: st.completed || 0, total: st.total || 0, current: st.current_ticker || '' };\n    if (st.winners && Array.isArray(st.winners)) {\n      SC.length = 0;\n      st.winners.forEach(w => SC.push({\n        t:   w.ticker,\n        n:   w.co
