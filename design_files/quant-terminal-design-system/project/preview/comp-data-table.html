<!DOCTYPE html>
<html>

<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #070B12; font-family: 'DM Sans', sans-serif; padding: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #111B2E; color: #475569; font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 12px; text-align: right; border-bottom: 1px solid #243650; white-space: nowrap; }
  th:first-child { text-align: left; }
  td { padding: 7px 12px; text-align: right; border-bottom: 1px solid #1A2640; font-family: 'JetBrains Mono', monospace; color: #EDF2F7; white-space: nowrap; }
  td:first-child { text-align: left; font-family: 'DM Sans', sans-serif; color: #94A3B8; }
  tr:hover td { background: #111B2E; }
  .ticker-link { color: #3ECFCF; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .pos { color: #22C55E; }
  .neg { color: #F43F5E; }
  .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 3px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em; }
</style>
</head>
