<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #070B12; font-family: 'DM Sans', sans-serif; padding: 20px; color: #EDF2F7; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #2D3F55; margin-bottom: 12px; }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; border-bottom: 1px solid #1A2640; padding-bottom: 10px; }
  .meta { font-size: 10px; font-family: 'JetBrains Mono', monospace; color: #2D3F55; white-space: nowrap; margin-left: auto; }

  .ticker-demo { display: flex; align-items: baseline; gap: 16px; padding: 14px 16px; background: #0D1420; border: 1px solid #243650; border-radius: 6px; margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="label">JetBrains Mono — Data & Numbers</div>

  <div class="ticker-demo">
    <span style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:#3ECFCF;letter-spacing:0.06em;">NVDA</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;color:#EDF2F7;">$875.39</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:16px;color:#22C55E;font-weight:500;">+24.18 (+2.84%)</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#475569;margin-left:auto;letter-spacing:0.06em;">● LIVE</span>
  </div>

  <div class="row">
    <span style="font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;">$1.23B</span>
    <span class="meta">36px · 700 · value-xl</span>
  </div>
  <div class="row">
    <span style="font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;">+32.4%</span>
    <span class="meta">18px · 600 · value-lg</span>
  </div>
  <div class="row">
    <span style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;">Market Cap · 52-Wk High · SEPA Score</span>
    <span class="meta">14px · 500 · value-mono</span>
  </div>
  <div class="row">
    <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:400;color:#94A3B8;">2,847,392 · 3.42x · 87/100</span>
    <span class="meta">12px · 400 · table data</span>
  </div>
  <div class="row" style="border:none;margin-bottom:0;">
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:400;color:#475569;">yfinance · 15-min delay · Last: 14:32:08</span>
    <span class="meta">11px · caption/mono</span>
  </div>
</body>
</html>
