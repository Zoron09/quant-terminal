<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #070B12; font-family: 'DM Sans', sans-serif; padding: 20px; }
  .top-bar { display: flex; align-items: center; gap: 16px; padding: 14px 18px; background: #0D1420; border: 1px solid #243650; border-radius: 6px; flex-wrap: wrap; }
  .ticker { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; color: #3ECFCF; letter-spacing: 0.06em; }
  .company { font-size: 14px; color: #94A3B8; flex: 1; }
  .price { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; color: #22C55E; }
  .change { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #22C55E; font-weight: 500; }
  .badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; }
  .divider { width: 1px; height: 32px; background: #1A2640; }
  .meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #2D3F55; }
</style>
</head>
<body>
  <div class="top-bar">
    <span class="ticker">NVDA</span>
    <span class="divider"></span>
    <span class="company">NVIDIA Corporation · Technology · Semiconductors</span>
    <span class="price">$875.39</span>
    <span class="change">+$24.18 (+2.84%)</span>
    <span class="badge" style="background:rgba(34,197,94,0.12);color:#22C55E;border:1px solid rgba(34,197,94,0.3);">● LIVE</span>
    <span class="badge" style="background:#0D1420;color:#475569;border:1px solid #243650;">USD</span>
    <span class="meta">15-min delay · yfinance</span>
  </div>
</body>
</html>
