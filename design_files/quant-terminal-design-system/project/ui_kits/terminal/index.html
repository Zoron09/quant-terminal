/* ── SPARKLINE ─────────────────────────────────────────────────── */
function Spark({ data, color, h = 40 }) {
  if (!data || data.length < 2) return null;
  const mn = Math.min(...data), mx = Math.max(...data), r = mx - mn || 1;
  const W = 100, H = h;
  const pts = data.map((v, i) => `${(i / (data.length - 1)) * W},${H - ((v - mn) / r) * (H - 3) - 1}`).join(' ');
  const fillPts = `0,${H} ${pts} ${W},${H}`;
  return (
    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{ display: 'block' }}>
      <defs>
        <linearGradient id={`sg${h}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.2" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <polygon points={fillPts} fill={`url(#sg${h})`} />
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

/* ── CHANGE PILL ── like PilePeak green pills ────────────────────── */
function ChangePill({ pct, value }) {
  const pos = pct >= 0;
  const col = pos ? '#0F2A1A' : '#2A0F0F';
  const text = pos ? T.pos : T.neg;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5,
      background: pos ? 'rgba(74,222,128,0.15)' : 'rgba(248,113,113,0.15)',
      color: text, borderRadius: 6, padding: '4px 10px',
      fontFamily: T.mono, fontSize: 12, fontWeight: 600,
    }}>
      {pos ? '▲' : '▼'} {pos ? '+' : ''}{pct?.toFixed(2)}%
      {value !== undefined && <span style={{ opacity: 0.7 }}>${Math.abs(value).toFixed(2)}</span>}
    </span>
  );
}

/* ── TABS ───────────────────────────────────────────────────────── */
function Tabs({ items, active, onChange }) {
  return (
    <div style={{ display: 'flex', gap: 0, borderBottom: `1px solid ${T.border}`, marginBottom: 28 }}>
      {items.map(item => (
        <button key={item} onClick={() => onChange(item)} style={{
          padding: '10px 18px', fontSize: 13, fontWeight: active === item ? 600 : 400,
          color: active === item ? T.fg1 : T.fg3,
          background: 'transparent', border: 'none', cursor: 'pointer',
          borderBottom: `2px solid ${active === item ? T.accent : 'transparent'}`,
          marginBottom: -1, transition: 'all 120ms',
        }}>{item}</button>
      ))}
    </div>
  );
}

/* ── SECTION TITLE ─────────────────────────────────────────────── */
function SectionTitle({ children, sub }) {
  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ fontSize: 15, fontWeight: 600, color: T.fg1 }}>{children}</div>
      {sub && <div style={{ fontSize: 12, color: T.fg3, marginTop: 3 }}>{sub}</div>}
    </div>
  );
}

/* ── STAT ROW ── no cards, just text rows like PilePeak ─────────── */
function StatRow({ label, value, color, sub }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 0', borderBottom: `1px solid ${T.border}` }}>
      <div>
        <div style={{ fontSize: 12, color: T.fg3, marginBottom: 2 }}>{label}</div>
        {sub && <div style={{ fontSize: 11, color: T.fg3 }}>{sub}</div>}
      </div>
      <div style={{ fontFamily: T.mono, fontSize: 14, fontWeight: 500, color: color || T.fg1 }}>{value}</div>
    </div>
  );
}

/* ── MINI STAT ── the 3-col stat below chart like PilePeak ─────── */
function MiniStat({ label, value, sub, color }) {
  return (
    <div>
      <div style={{ fontSize: 11, color: T.fg3, marginBottom: 6 }}>{label}</div>
      <div style={{ fontFamily: T.mono, fontSize: 18, fontWeight: 600, color: color || T.fg1 }}>{value}</div>
      {sub && <div style={{ fontSize: 11, color: T.fg3, marginTop: 3 }}>{sub}</div>}
    </div>
  );
}

                <div style={{ fontFamily: T.mono, fontSize: 11, color: s.c >= 0 ? T.pos : T.neg }}>{s.c >= 0 ? '+' : ''}{s.c.toFixed(1)}%</div>
              </div>
            </div>
          ))}
        </div>

        {/* Remaining sectors as rows */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 6, marginTop: 6 }}>
          {sectors.slice(5).map(s => (
            <div key={s.n} style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: '10px 12px' }}>
              <div style={{ fontSize: 9, color: T.fg3, textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 600, marginBottom: 4 }}>{s.n}</div>
              <div style={{ fontFamily: T.mono, fontSize: 12, color: s.c >= 0 ? T.pos : T.neg, fontWeight: 600 }}>{s.c >= 0 ? '+' : ''}{s.c.toFixed(1)}%</div>
            </div>
          ))}
        </div>
      </div>

      {/* VIX + Breadth */}
      <div style={{ display: 'grid', gridTemplateColumns: '200px 1fr', gap: 16 }}>
        <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 22, textAlign: 'center' }}>
          <div style={{ fontSize: 10, color: T.fg3, textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 600, marginBottom: 14 }}>VIX</div>
          <div style={{ fontFamily: T.serif, fontSize: 56, color: T.warn, lineHeight: 1 }}>18.42</div>
          <div style={{ fontSize: 12, color: T.warn, fontWeight: 600, marginTop: 8 }}>NEUTRAL</div>
          <div style={{ fontSize: 10, color: T.fg3, marginTop: 8, lineHeight: 1.6 }}>&lt;12 Greed<br />12–28 Neutral<br />28+ Fear</div>
        </div>
        <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 22 }}>
          <div style={{ fontSize: 12, color: T.fg3, fontWeight: 600, letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 20 }}>Market Breadth</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 20 }}>
            {[['Stocks above 50MA', '63.4%', '318 of 502 stocks', T.pos], ['Stocks above 200MA', '71.2%', '357 of 502 stocks', T.pos], ['Market Posture', 'Bullish', 'Based on breadth', T.pos]].map(([l, v, s, c]) => (
              <div key={l}>
                <div style={{ fontSize: 11, color: T.fg3, marginBottom: 8 }}>{l}</div>
                <div style={{ fontFamily: T.mono, fontSize: 26, fontWeight: 600, color: c }}>{v}</div>
                <div style={{ fontSize: 11, color: T.fg3, marginTop: 4 }}>{s}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────
   SEPA SCREEN
──────────────────────────────────────────────────────────────────*/
function SEPAScreen() {
  const [tab, setTab] = React.useState('Trend Template');
  const criteria = [
    { t: 'Price above 150-day moving average', p: true },
    { t: 'Price above 200-day moving average', p: true },
    { t: '150-day MA above 200-day MA', p: true },
    { t: '200-day MA trending up for at least 1 month', p: false },
    { t: '50-day MA above both 150-day and 200-day', p: true },
    { t: 'Price above 50-day moving average', p: true },
    { t: 'Price at least 30% above 52-week low', p: true },
    { t: 'Price within 25% of 52-week high', p: true },
  ];
  const passes = criteria.filter(c => c.p).length;

  return (
    <div>
      <div style={{ marginBottom: 28 }}>
        <div style={{ fontSize: 13, color: T.fg3, marginBottom: 6 }}>NVDA · SEPA Methodology</div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 20 }}>
          <div style={{ fontFamily: T.serif, fontSize: 72, color: T.accent, lineHeight: 1, letterSpacing: '-0.02em' }}>87</div>
          <div>
            <div style={{ fontSize: 15, fontWeight: 600, color: T.fg1 }}>SEPA Score · Qualified</div>
            <div style={{ fontSize: 13, color: T.fg3, marginTop: 3 }}>Stage 2 — Advancing · RS Rank 94</div>
          </div>
        </div>
        <div style={{ background: T.raised, borderRadius: 4, height: 4, overflow: 'hidden', marginTop: 16, maxWidth: 400 }}>
          <div style={{ width: '87%', height: '100%', background: `linear-gradient(90deg, ${T.accent}66, ${T.accent})`, borderRadius: 4 }} />
        </div>
      </div>

      <Tabs items={['Trend Template', 'Code 33', 'VCP', 'RS Rank']} active={tab} onChange={setTab} />

      {tab === 'Trend Template' && (
        <div style={{ maxWidth: 560 }}>
          <div style={{ fontSize: 13, color: T.fg3, marginBottom: 20 }}>
            {passes} of 8 criteria met — <span style={{ color: T.pos }}>Qualified for Stage 2</span>
          </div>
          {criteria.map((c, i) => (
            <div key={i} style={{
              display: 'flex', alignItems: 'center', gap: 14,
              padding: '11px 0', borderBottom: `1px solid ${T.border}`,
            }}>
              <div style={{
                width: 24, height: 24, borderRadius: '50%', flexShrink: 0,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                background: c.p ? T.posDim : T.negDim,
                color: c.p ? T.pos : T.neg, fontSize: 12, fontWeight: 700,
              }}>{c.p ? '✓' : '✗'}</div>
              <span style={{ fontSize: 14, color: c.p ? T.fg1 : T.fg3, lineHeight: 1.4 }}>{c.t}</span>
            </div>
          ))}
        </div>
      )}

      {tab === 'Code 33' && (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
            <div style={{ width: 10, height: 10, borderRadius: '50%', background: T.pos, boxShadow: `0 0 10px ${T.pos}` }} />
            <span style={{ fontSize: 15, fontWeight: 600, color: T.pos }}>Green — All 3 metrics accelerating</span>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12, marginBottom: 24 }}>
            {[['EPS Growth Rate', '↑ 84%', '+19pp acceleration', T.pos], ['Revenue Growth Rate', '↑ 122%', '+38pp acceleration', T.pos], ['Net Profit Margin', '↑ +7pp', 'Expanding', T.pos]].map(([l, v, s, c]) => (
              <div key={l} style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, padding: 18 }}>
                <div style={{ fontSize: 11, color: T.fg3, marginBottom: 8, textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 600 }}>{l}</div>
                <div style={{ fontFamily: T.mono, fontSize: 24, fontWeight: 600, color: c, marginBottom: 4 }}>{v}</div>
                <div style={{ fontSize: 11, color: T.fg3 }}>{s}</div>
              </div>
            ))}
          </div>
          <div style={{ fontSize: 13, color: T.fg3, lineHeight: 1.7 }}>
            Code 33 requires all three metrics to accelerate simultaneously for 3+ consecutive quarters.<br />
            <span style={{ color: T.neg }}>High growth but decelerating = Red (the Dell Computer trap).</span>
          </div>
        </div>
      )}

      {tab === 'VCP' && (
        <div style={{ maxWidth: 480 }}>
          <div style={{ fontSize: 13, color: T.fg3, marginBottom: 24 }}>Volatility Contraction Pattern — 3 contractions detected</div>
          {[['Contraction 1', '18.2%', 'Widest — sets the baseline'], ['Contraction 2', '12.4%', 'Tighter — volume declining'], ['Contraction 3', '7.1%', 'Tightest — near pivot point']].map(([l, v, s], i) => (
            <div key={i} style={{ display: 'flex', gap: 16, padding: '14px 0', borderBottom: `1px solid ${T.border}`, alignItems: 'center' }}>
              <div style={{ width: 32, height: 32, borderRadius: '50%', background: T.accentDim, border: `1px solid rgba(200,255,87,0.25)`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: T.mono, fontSize: 12, fontWeight: 600, color: T.accent, flexShrink: 0 }}>{i + 1}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, color: T.fg2 }}>{l}</div>
                <div style={{ fontSize: 11, color: T.fg3, marginTop: 2 }}>{s}</div>
              </div>
              <div style={{ fontFamily: T.mono, fontSize: 20, fontWeight: 600, color: T.fg1 }}>{v}</div>
            </div>
          ))}
          <div style={{ marginTop: 20, fontSize: 13, color: T.pos }}>Volume dry-up confirmed at C3 — buy trigger zone active</div>
        </div>
      )}

      {tab === 'RS Rank' && (
        <div style={{ maxWidth: 440 }}>
          <div style={{ fontFamily: T.serif, fontSize: 64, color: T.accent, lineHeight: 1, marginBottom: 8 }}>94</div>
          <div style={{ fontSize: 14, color: T.fg2, marginBottom: 4 }}>Top 6% of all US stocks</div>
          <div style={{ fontSize: 13, color: T.fg3, marginBottom: 24 }}>Relative strength vs S&P 500 over past 12 months</div>
          <div style={{ background: T.raised, borderRadius: 6, height: 8, overflow: 'hidden', marginBottom: 28 }}>
            <div style={{ width: '94%', height: '100%', background: `linear-gradient(90deg, ${T.accent}55, ${T.accent})`, borderRadius: 6 }} />
          </div>
          <StatRow label="RS vs S&P 500" value="+189.3% (12M)" color={T.pos} />
          <StatRow label="RS vs Sector" value="+112.4% (12M)" color={T.pos} />
          <StatRow label="Minimum RS for SEPA" value="≥ 70" />
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────
   SIDEBAR + APP SHELL
──────────────────────────────────────────────────────────────────*/
const NAV = [
  { group: 'Research', items: ['Overview', 'Financials', 'Growth & Margins', 'Valuation', 'Earnings', 'Analyst Ratings', 'Ownership', 'Peer Comparison'] },
  { group: 'SEPA', items: ['SEPA Analysis', 'Screener'] },
  { group: 'Market', items: ['Market Dashboard', 'Portfolio', 'News & Alerts'] },
];

function Sidebar({ page, setPage }) {
  const [ticker, setTicker] = React.useState('NVDA');
  return (
    <div style={{
      width: 208, flexShrink: 0, background: '#0A0A0C',
      borderRight: `1px solid ${T.border}`,
      display: 'flex', flexDirection: 'column', height: '100vh', position: 'sticky', top: 0,
    }}>
      <div style={{ padding: '22px 22px 18px', borderBottom: `1px solid ${T.border}` }}>
        <div style={{ fontFamily: T.serif, fontSize: 20, color: T.fg1, letterSpacing: '-0.01em' }}>Quant</div>
        <div style={{ fontSize: 10, color: T.fg3, letterSpacing: '0.1em', marginTop: 2, textTransform: 'uppercase' }}>Terminal</div>
      </div>

      <div style={{ padding: '12px 14px', borderBottom: `1px solid ${T.border}` }}>
        <input value={ticker} onChange={e => setTicker(e.target.value.toUpperCase())}
          style={{
            width: '100%', background: T.raised, border: `1px solid ${T.borderMid}`,
            borderRadius: 8, color: T.accent, fontFamily: T.mono,
            fontSize: 14, fontWeight: 600, padding: '8px 12px', outline: 'none', letterSpacing: '0.04em',
          }} />
      </div>

      <nav style={{ flex: 1, overflowY: 'auto', padding: '6px 0' }}>
        {NAV.map(({ group, items }) => (
          <div key={group} style={{ marginBottom: 4 }}>
            <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', color: T.fg4, padding: '10px 22px 3px' }}>{group}</div>
            {items.map(item => {
              const on = item === page;
              return (
                <div key={item} onClick={() => setPage(item)} style={{
                  padding: '8px 22px', fontSize: 13, cursor: 'pointer',
                  color: on ? T.fg1 : T.fg3,
                  background: on ? T.raised : 'transparent',
                  fontWeight: on ? 500 : 400,
                  borderLeft: `2px solid ${on ? T.accent : 'transparent'}`,
                  transition: 'all 120ms',
                }}
                  onMouseEnter={e => { if (!on) e.currentTarget.style.color = T.fg2; }}
                  onMouseLeave={e => { if (!on) e.currentTarget.style.color = T.fg3; }}
                >{item}</div>
              );
            })}
          </div>
        ))}
      </nav>

      <div style={{ padding: '12px 22px', borderTop: `1px solid ${T.border}` }}>
        <div style={{ fontSize: 10, color: T.fg4 }}>Alpaca · yfinance · Finnhub</div>
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = React.useState('Overview');
  const screens = {
    'Overview': <OverviewScreen />,
    'SEPA Analysis': <SEPAScreen />,
    'Screener': <ScreenerScreen />,
    'Market Dashboard': <MarketScreen />,
  };
  const screen = screens[page] || (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '60vh', gap: 10 }}>
      <div style={{ fontFamily: T.serif, fontSize: 40, color: T.fg4 }}>—</div>
      <div style={{ fontSize: 13, color: T.fg3 }}>"{page}" is not yet in this prototype</div>
      <div style={{ fontSize: 11, color: T.fg4 }}>Try: Overview · SEPA Analysis · Screener · Market Dashboard</div>
    </div>
  );

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: T.bg, color: T.fg1 }}>
      <Sidebar page={page} setPage={setPage} />
      <main style={{ flex: 1, overflowY: 'auto', padding: '36px 48px' }}>
        {screen}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
